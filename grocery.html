<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6426056111301969" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>解忧杂货店 — 写一封信，等一个回答 | tylerzhang.xyz</title>
    <meta name="description" content="解忧杂货店：匿名写一封信投进杂货店，AI老爷爷深夜给你回信。这里没有评判，只有温暖的回答。">
    <meta name="keywords" content="解忧杂货店,AI回信,匿名写信,心理疏导,温暖,杂货店,东野圭吾">
    <link rel="canonical" href="https://tylerzhang.xyz/grocery.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="解忧杂货店 — 写一封信，等一个回答">
    <meta property="og:description" content="巷子深处的杂货店，深夜为你亮着灯。写一封信，老爷爷会给你回信。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0c0a08;--surface:#1a1714;--border:#2a2520;--text:#e8e0d4;--text-dim:#8a7e6e;--text-muted:#5a5248;--warm:#d4a574;--warm-light:#e8c9a0;--warm-glow:rgba(212,165,116,0.15);--warm-glow2:rgba(212,165,116,0.08);--accent:#c49a6c;--lamp:#f5d4a0}
        html{scroll-behavior:smooth}
        body{font-family:'LXGW WenKai',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh}

        .container{max-width:700px;margin:0 auto;padding:80px 24px 60px}

        /* 英雄区 */
        .hero{text-align:center;margin-bottom:48px;position:relative}
        .hero-icon{font-size:4rem;margin-bottom:16px;display:block}
        .hero h1{font-size:2rem;font-weight:900;margin-bottom:12px;color:var(--warm-light)}
        .hero p{color:var(--text-dim);font-size:.9rem;line-height:1.8}
        .hero .sign{
            display:inline-block;margin-top:20px;padding:8px 24px;
            background:var(--warm-glow);border:1px solid var(--border);border-radius:12px;
            font-size:.8rem;color:var(--warm);
        }

        /* 灯光效果 */
        .lamp-glow{
            position:absolute;top:-20px;left:50%;transform:translateX(-50%);
            width:200px;height:200px;border-radius:50%;
            background:radial-gradient(circle,rgba(245,212,160,0.08) 0%,transparent 70%);
            pointer-events:none;
        }

        /* 写信区域 */
        .write-section{
            background:var(--surface);border:1px solid var(--border);border-radius:20px;
            padding:28px 24px;margin-bottom:32px;position:relative;overflow:hidden;
        }
        .write-section::before{
            content:'';position:absolute;top:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg,transparent,var(--warm),transparent);
        }

        .mood-selector{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
        .mood-btn{
            padding:6px 14px;border-radius:20px;border:1px solid var(--border);
            background:transparent;color:var(--text-dim);font-size:.85rem;
            cursor:pointer;font-family:inherit;transition:all .2s;
        }
        .mood-btn:hover{border-color:var(--warm);color:var(--warm)}
        .mood-btn.active{background:var(--warm-glow);border-color:var(--warm);color:var(--warm)}

        .write-area{
            width:100%;min-height:140px;padding:16px 18px;
            background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:14px;
            color:var(--text);font-family:inherit;font-size:.95rem;
            resize:vertical;outline:none;transition:border-color .2s;
            line-height:2;
        }
        .write-area:focus{border-color:var(--warm)}
        .write-area::placeholder{color:var(--text-muted)}

        .write-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
        .char-count{font-size:.75rem;color:var(--text-muted)}
        .submit-btn{
            padding:10px 28px;border-radius:12px;border:none;
            background:var(--warm);color:#1a1714;font-size:.9rem;font-weight:600;
            cursor:pointer;font-family:inherit;transition:all .2s;
        }
        .submit-btn:hover{opacity:.85;transform:translateY(-1px)}
        .submit-btn:disabled{opacity:.4;cursor:not-allowed}

        /* 回信 */
        .reply-card{
            margin-top:24px;padding:24px 20px;
            background:var(--warm-glow2);border:1px solid rgba(212,165,116,0.15);
            border-radius:16px;display:none;position:relative;
        }
        .reply-card.show{display:block;animation:fadeIn 0.6s ease}
        .reply-card::before{
            content:'✉️';position:absolute;top:-12px;right:20px;
            font-size:1.2rem;background:var(--surface);padding:0 8px;
        }
        .reply-label{font-size:.75rem;color:var(--warm);margin-bottom:8px;display:flex;align-items:center;gap:4px}
        .reply-text{color:var(--text);font-size:.95rem;line-height:2;font-style:italic}
        .reply-sign{text-align:right;font-size:.8rem;color:var(--text-dim);margin-top:12px}

        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

        /* 来信墙 */
        .section-title{
            font-size:1.1rem;font-weight:700;margin-bottom:20px;
            display:flex;align-items:center;gap:8px;color:var(--warm-light);
        }

        .letters-list{display:flex;flex-direction:column;gap:16px}

        .letter-card{
            background:var(--surface);border:1px solid var(--border);border-radius:16px;
            padding:20px 18px;transition:border-color .3s;position:relative;
        }
        .letter-card:hover{border-color:rgba(212,165,116,0.2)}

        .letter-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
        .letter-mood{font-size:1.1rem}
        .letter-time{font-size:.75rem;color:var(--text-muted)}

        .letter-content{color:var(--text);font-size:.9rem;line-height:1.8;margin-bottom:14px}

        .letter-reply{
            padding:14px 16px;background:var(--warm-glow2);
            border-left:3px solid var(--warm);border-radius:0 12px 12px 0;
            margin-bottom:14px;
        }
        .letter-reply .label{font-size:.7rem;color:var(--warm);margin-bottom:4px}
        .letter-reply .text{font-size:.85rem;color:var(--text-dim);line-height:1.8;font-style:italic}

        .letter-actions{display:flex;gap:16px;align-items:center}
        .letter-action{
            background:none;border:none;color:var(--text-muted);
            font-size:.8rem;cursor:pointer;font-family:inherit;
            display:flex;align-items:center;gap:4px;transition:color .2s;
        }
        .letter-action:hover{color:var(--warm)}
        .letter-action.hugged{color:var(--warm)}

        .load-more{
            width:100%;padding:12px;border-radius:12px;border:1px dashed var(--border);
            background:transparent;color:var(--text-dim);font-size:.85rem;
            cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px;
        }
        .load-more:hover{border-color:var(--warm);color:var(--warm)}

        .empty{text-align:center;color:var(--text-muted);padding:48px 0;font-size:.9rem}
        .empty .icon{font-size:3rem;margin-bottom:12px;display:block}

        .footer{text-align:center;padding:40px 24px;color:var(--text-muted);font-size:.8rem;border-top:1px solid var(--border);margin-top:60px}
        .footer a{color:var(--text-dim)}

        @media(max-width:768px){
            .container{padding:70px 16px 40px}
            .hero h1{font-size:1.5rem}
            .hero-icon{font-size:3rem}
            .mood-selector{gap:6px}
            .mood-btn{padding:5px 10px;font-size:.8rem}
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <div class="lamp-glow"></div>
        <span class="hero-icon">🏪</span>
        <h1>解忧杂货店</h1>
        <p>巷子深处的杂货店，深夜为你亮着灯。<br>写一封信投进来，老爷爷会给你回信。</p>
        <div class="sign">📮 营业时间：24小时 · 回信时间：即时</div>
    </div>

    <div class="write-section">
        <div class="mood-selector">
            <button class="mood-btn" data-mood="happy" onclick="selectMood(this)">😊 开心</button>
            <button class="mood-btn" data-mood="sad" onclick="selectMood(this)">😢 难过</button>
            <button class="mood-btn" data-mood="angry" onclick="selectMood(this)">😤 生气</button>
            <button class="mood-btn" data-mood="anxious" onclick="selectMood(this)">😰 焦虑</button>
            <button class="mood-btn" data-mood="confused" onclick="selectMood(this)">😶 迷茫</button>
            <button class="mood-btn" data-mood="grateful" onclick="selectMood(this)">🥰 感恩</button>
            <button class="mood-btn" data-mood="lonely" onclick="selectMood(this)">🥺 孤独</button>
            <button class="mood-btn" data-mood="calm" onclick="selectMood(this)">😌 平静</button>
        </div>
        <textarea class="write-area" id="writeArea" placeholder="亲爱的杂货店老爷爷：&#10;&#10;我想跟你说……" maxlength="1000"></textarea>
        <div class="write-footer">
            <span class="char-count"><span id="charCount">0</span>/1000</span>
            <button class="submit-btn" id="submitBtn" onclick="submitLetter()">📮 投进杂货店</button>
        </div>
        <div class="reply-card" id="replyCard">
            <div class="reply-label">✉️ 老爷爷的回信</div>
            <div class="reply-text" id="replyText"></div>
            <div class="reply-sign" id="replySign"></div>
        </div>
    </div>

    <div class="section-title">📬 来信墙</div>
    <div class="letters-list" id="lettersList">
        <div class="empty">
            <span class="icon">📭</span>
            <p>还没有人投过信…<br>做第一个写信的人吧</p>
        </div>
    </div>
    <button class="load-more" id="loadMore" style="display:none" onclick="loadMore()">加载更多来信…</button>
</div>

<div class="footer">
    <p>🐟 Tyler工具箱 · <a href="/">tylerzhang.xyz</a></p>
</div>

<script>
const API = '/api/grocery';
let selectedMood = '';
let offset = 0;
let isSubmitting = false;
let huggedIds = new Set(JSON.parse(localStorage.getItem('groceryHugs') || '[]'));

const moodMap = {
    happy: { emoji: '😊', label: '开心' },
    sad: { emoji: '😢', label: '难过' },
    angry: { emoji: '😤', label: '生气' },
    anxious: { emoji: '😰', label: '焦虑' },
    confused: { emoji: '😶', label: '迷茫' },
    grateful: { emoji: '🥰', label: '感恩' },
    lonely: { emoji: '🥺', label: '孤独' },
    calm: { emoji: '😌', label: '平静' },
    unknown: { emoji: '✉️', label: '' },
};

document.getElementById('writeArea').addEventListener('input', function() {
    document.getElementById('charCount').textContent = this.value.length;
});

function selectMood(btn) {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    if (selectedMood === btn.dataset.mood) {
        selectedMood = '';
    } else {
        btn.classList.add('active');
        selectedMood = btn.dataset.mood;
    }
}

async function submitLetter() {
    if (isSubmitting) return;
    const content = document.getElementById('writeArea').value.trim();
    if (!content) return;

    isSubmitting = true;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '老爷爷正在读信…';

    try {
        const visitor_id = getVisitorId();
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ visitor_id, content, mood: selectedMood }),
        });
        const data = await res.json();

        if (!data.ok) throw new Error(data.error || '投信失败');

        // 显示回信
        const reply = document.getElementById('replyCard');
        document.getElementById('replyText').textContent = data.letter.ai_reply || '夜深了，信我已收到。明天再来坐坐吧。';

        // 随机签名
        const signs = ['—— 杂货店老人', '—— 深夜的杂货店', '—— 巷子深处', '—— 老爷爷', ''];
        document.getElementById('replySign').textContent = signs[Math.floor(Math.random() * signs.length)];

        reply.classList.add('show');

        // 清空
        document.getElementById('writeArea').value = '';
        document.getElementById('charCount').textContent = '0';
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        selectedMood = '';

        // 刷新来信墙
        offset = 0;
        await loadLetters();

    } catch (err) {
        alert('投信失败：' + err.message);
    }

    isSubmitting = false;
    btn.disabled = false;
    btn.textContent = '📮 投进杂货店';
}

async function loadLetters() {
    try {
        const res = await fetch(`${API}?limit=10&offset=${offset}`);
        const data = await res.json();
        if (!data.ok) return;

        const list = document.getElementById('lettersList');
        const loadMoreBtn = document.getElementById('loadMore');

        if (offset === 0 && data.letters.length === 0) {
            list.innerHTML = `<div class="empty"><span class="icon">📭</span><p>还没有人投过信…<br>做第一个写信的人吧</p></div>`;
            loadMoreBtn.style.display = 'none';
            return;
        }

        if (offset === 0) list.innerHTML = '';

        data.letters.forEach(l => {
            const mood = moodMap[l.mood] || moodMap.unknown;
            const isHugged = huggedIds.has(l.id);
            const timeStr = formatTime(l.created_at);

            const card = document.createElement('div');
            card.className = 'letter-card';
            card.innerHTML = `
                <div class="letter-header">
                    <span class="letter-mood">${mood.emoji}</span>
                    ${mood.label ? `<span style="font-size:.75rem;color:var(--text-dim)">${mood.label}</span>` : ''}
                    <span class="letter-time">${timeStr}</span>
                </div>
                <div class="letter-content">${escapeHtml(l.content)}</div>
                ${l.ai_reply ? `<div class="letter-reply"><div class="label">✉️ 老爷爷的回信</div><div class="text">${escapeHtml(l.ai_reply)}</div></div>` : ''}
                <div class="letter-actions">
                    <button class="letter-action ${isHugged ? 'hugged' : ''}" onclick="hug(${l.id}, this)">
                        🤗 <span>${l.hugs || 0}</span> 温暖
                    </button>
                </div>
            `;
            list.appendChild(card);
        });

        loadMoreBtn.style.display = data.letters.length < 10 ? 'none' : 'block';

    } catch (err) {
        console.error('加载失败:', err);
    }
}

async function loadMore() {
    offset += 10;
    await loadLetters();
}

async function hug(id, btn) {
    if (huggedIds.has(id)) return;
    huggedIds.add(id);
    localStorage.setItem('groceryHugs', JSON.stringify([...huggedIds]));

    btn.classList.add('hugged');
    const span = btn.querySelector('span');
    span.textContent = parseInt(span.textContent) + 1;

    try {
        await fetch(API, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, action: 'hug' }),
        });
    } catch {}
}

function getVisitorId() {
    let id = localStorage.getItem('groceryVisitorId');
    if (!id) {
        id = 'gc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        localStorage.setItem('groceryVisitorId', id);
    }
    return id;
}

function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
    return `${d.getMonth()+1}月${d.getDate()}日`;
}

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

loadLetters();
</script>

    <script src="/nav.js?v2"></script>
</body>
</html>
