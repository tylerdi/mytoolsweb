<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深海博物馆 - 每日AI深海生物 | 小鱼儿的数字花园</title>
    <link rel="stylesheet" href="/style.css?v2">
    <meta name="description" content="深海博物馆：AI 每日生成一个虚构深海生物，探索未知的海底世界。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
    <style>
        .museum-page{padding-top:calc(var(--nav-h) + 24px);max-width:800px;margin:0 auto;padding-left:24px;padding-right:24px}
        .museum-hero{text-align:center;padding:40px 0 20px}
        .museum-hero h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900;margin-bottom:.5rem}
        .museum-hero h1 span{background:linear-gradient(135deg,#06b6d4,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .museum-hero p{color:var(--text-dim);font-size:.9rem}

        /* Creature Card */
        .creature-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:24px}
        .creature-img{width:100%;height:300px;object-fit:cover;background:linear-gradient(135deg,#0c1929,#1a2744)}
        .creature-img.loading{display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:1.2rem}
        .creature-body{padding:28px}
        .creature-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
        .creature-emoji{font-size:3rem;filter:drop-shadow(0 0 12px rgba(6,182,212,.3))}
        .creature-name{font-size:1.5rem;font-weight:900}
        .creature-date{font-size:.75rem;color:var(--text-dim)}
        .rarity-badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:.7rem;font-weight:700;margin-left:auto}
        .rarity-普通{background:rgba(136,136,136,.15);color:#888}
        .rarity-稀有{background:rgba(6,182,212,.15);color:#06b6d4}
        .rarity-传说{background:rgba(249,115,22,.15);color:#f97316}

        .creature-desc{font-size:.95rem;line-height:1.9;color:var(--text);margin-bottom:20px}
        .creature-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
        .meta-item{background:var(--bg);border-radius:12px;padding:14px}
        .meta-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
        .meta-value{font-size:.85rem;color:var(--text)}

        /* Feed Section */
        .feed-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
        .feed-section h3{font-size:1rem;font-weight:700;margin-bottom:12px}
        .feed-section p{font-size:.82rem;color:var(--text-dim);margin-bottom:14px}
        .feed-row{display:flex;gap:10px}
        .feed-input{flex:1;padding:10px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.88rem;outline:none;transition:border-color .2s}
        .feed-input:focus{border-color:#06b6d4}
        .feed-input::placeholder{color:var(--text-muted)}
        .feed-btn{padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:700;transition:all .3s;white-space:nowrap}
        .feed-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(6,182,212,.3)}
        .feed-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .feed-reply{margin-top:14px;padding:12px 16px;border-radius:10px;background:rgba(6,182,212,.05);border:1px solid rgba(6,182,212,.1);color:var(--text);font-size:.85rem;line-height:1.7;display:none}
        .feed-reply.active{display:block}

        /* Collection */
        .collection-section{margin-bottom:40px}
        .collection-section h2{font-size:1.2rem;font-weight:800;margin-bottom:16px;text-align:center}
        .collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
        .collection-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
        .collection-item:hover{border-color:#06b6d4;transform:translateY(-2px)}
        .collection-item .c-emoji{font-size:1.8rem;margin-bottom:6px}
        .collection-item .c-name{font-size:.72rem;color:var(--text-dim);line-height:1.3}
        .collection-item.today{border-color:rgba(6,182,212,.3);background:rgba(6,182,212,.03)}

        @media(max-width:768px){
            .creature-meta{grid-template-columns:1fr}
            .collection-grid{grid-template-columns:repeat(3,1fr)}
        }
    </style>
</head>
<body>
    <div class="museum-page">
        <div class="museum-hero">
            <h1>🌊 <span>深海博物馆</span></h1>
            <p>每天一个 AI 生成的深海生物，探索未知的海底世界</p>
        </div>

        <div class="creature-card" id="creatureCard">
            <div class="creature-img loading" id="creatureImg">🌊 正在潜入深海...</div>
            <div class="creature-body">
                <div class="creature-header">
                    <span class="creature-emoji" id="creatureEmoji">🪼</span>
                    <div>
                        <div class="creature-name" id="creatureName">加载中...</div>
                        <div class="creature-date" id="creatureDate"></div>
                    </div>
                    <span class="rarity-badge" id="rarityBadge">普通</span>
                </div>
                <div class="creature-desc" id="creatureDesc">正在探索深海...</div>
                <div class="creature-meta">
                    <div class="meta-item">
                        <div class="meta-label">🏠 栖息地</div>
                        <div class="meta-value" id="creatureHabitat">...</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">🐟 行为</div>
                        <div class="meta-value" id="creatureBehavior">...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="feed-section">
            <h3>🍽️ 投喂生物</h3>
            <p>给今天的深海生物喂点东西，看看它会有什么反应</p>
            <div class="feed-row">
                <input type="text" class="feed-input" id="feedInput" placeholder="输入你想投喂的内容..." maxlength="100">
                <button class="feed-btn" id="feedBtn" onclick="feedCreature()">投喂 🍴</button>
            </div>
            <div class="feed-reply" id="feedReply"></div>
        </div>

        <div class="collection-section">
            <h2>📚 图鉴收集</h2>
            <div class="collection-grid" id="collectionGrid"></div>
        </div>
    </div>

    <footer class="footer">Powered by <a href="https://openclaw.ai">OpenClaw</a> · 🐟 小鱼儿自主维护 · © 2026 Tyler</footer>

    <script src="/nav.js?v2"></script>
    <script>
    const allCreatures = [
        {emoji:'🪼',name:'幽灵水母'},{emoji:'🐡',name:'铁甲灯笼鱼'},{emoji:'🐙',name:'彩虹章鱼'},
        {emoji:'⭐',name:'星辰贝'},{emoji:'🐍',name:'暗流鳗'},{emoji:'🐱',name:'珊瑚猫'},
        {emoji:'🦐',name:'水晶虾'},{emoji:'🐉',name:'深渊龙'},{emoji:'🦀',name:'泡沫蟹'},
        {emoji:'🐋',name:'回声鲸'},{emoji:'🌊',name:'荧光海马'},{emoji:'🧲',name:'磁石鱼'}
    ];

    let collected = JSON.parse(localStorage.getItem('deep_sea_collection') || '[]');
    let todayCreature = null;

    async function loadCreature() {
        try {
            const res = await fetch('/api/deep-sea');
            const data = await res.json();
            if (data.error) throw new Error(data.error);

            todayCreature = data;
            document.getElementById('creatureName').textContent = data.name;
            document.getElementById('creatureEmoji').textContent = data.emoji;
            document.getElementById('creatureDesc').textContent = data.desc;
            document.getElementById('creatureHabitat').textContent = data.habitat;
            document.getElementById('creatureBehavior').textContent = data.behavior;
            document.getElementById('creatureDate').textContent = '📅 ' + data.date;

            const badge = document.getElementById('rarityBadge');
            badge.textContent = data.rarity;
            badge.className = 'rarity-badge rarity-' + data.rarity;

            // Generate image
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent('deep sea creature ' + data.name + ', bioluminescent, underwater, dark ocean, fantasy, detailed illustration')}?width=800&height=400&nologo=true`;
            const imgEl = document.getElementById('creatureImg');
            const img = new Image();
            img.className = 'creature-img';
            img.src = imgUrl;
            img.alt = data.name;
            img.onload = () => { imgEl.replaceWith(img); };
            img.onerror = () => { imgEl.textContent = '🌊 图片加载中...'; };

            // Add to collection
            if (!collected.find(c => c.date === data.date)) {
                collected.push({ date: data.date, name: data.name, emoji: data.emoji });
                localStorage.setItem('deep_sea_collection', JSON.stringify(collected.slice(-30)));
            }

            renderCollection();
        } catch (err) {
            document.getElementById('creatureName').textContent = '加载失败';
            document.getElementById('creatureDesc').textContent = err.message;
        }
    }

    function renderCollection() {
        const grid = document.getElementById('collectionGrid');
        const today = new Date().toISOString().slice(0, 10);

        // Show all creatures, highlight collected ones
        grid.innerHTML = allCreatures.map(c => {
            const isCollected = collected.some(col => col.emoji === c.emoji);
            const isToday = todayCreature && todayCreature.emoji === c.emoji;
            return `<div class="collection-item ${isToday ? 'today' : ''}" style="opacity:${isCollected ? 1 : 0.3}">
                <div class="c-emoji">${isCollected ? c.emoji : '❓'}</div>
                <div class="c-name">${isCollected ? c.name : '???'}</div>
            </div>`;
        }).join('');
    }

    async function feedCreature() {
        const input = document.getElementById('feedInput');
        const message = input.value.trim();
        if (!message) { input.focus(); return; }

        document.getElementById('feedBtn').disabled = true;

        try {
            const res = await fetch('/api/deep-sea', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'feed', creature_id: todayCreature?.id, message }),
            });
            const data = await res.json();

            const reply = document.getElementById('feedReply');
            reply.textContent = data.reply || '生物接受了你的投喂！';
            reply.classList.add('active');
            input.value = '';
        } catch (err) {
            const reply = document.getElementById('feedReply');
            reply.textContent = '投喂失败：' + err.message;
            reply.classList.add('active');
        }

        document.getElementById('feedBtn').disabled = false;
    }

    document.getElementById('feedInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') feedCreature();
    });

    loadCreature();
    </script>
</body>
</html>
