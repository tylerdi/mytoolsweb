            <li><strong>机会发现</strong>— 识别可优化的点，主动建议</li>
            <li><strong>预防性维护</strong>— 在问题发生前修复</li>
          </ul>
          <div class="example">被动 Agent：你说「帮我查天气」→ 查。主动 Agent：看到要下雨→「明天有雨，建议带伞，已加到日历提醒」。</div>
        `
      },
      'social': {
        icon: '👥', title: '社交性', desc: '与人类和其他 Agent 交互',
        content: `
          <p>Agent 不是孤岛，需要与外界交互。</p>
          <ul>
            <li><strong>人机交互</strong>— 理解人类意图，用人类能理解的方式回复</li>
            <li><strong>Agent 间通信</strong>— 标准化的消息协议</li>
            <li><strong>群体智能</strong>— 多 Agent 协作产生涌现行为</li>
            <li><strong>社会规范</strong>— 遵守安全、伦理、隐私规则</li>
          </ul>
          <div class="example">OpenClaw 的多 Agent 系统：三丰在飞书和你聊天，乔峰在另一个群回答问题，清扬在写代码——它们互相知道对方的存在。</div>
        `
      },
    };

    function showDetail(key) {
      const d = DETAILS[key];
      if (!d) return;
      document.getElementById('detailIcon').textContent = d.icon;
      document.getElementById('detailTitle').textContent = d.title;
      document.getElementById('detailDesc').textContent = d.desc;
      document.getElementById('detailContent').innerHTML = d.content;
      const panel = document.getElementById('detailPanel');
      panel.classList.add('show');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideDetail() {
      document.getElementById('detailPanel').classList.remove('show');
    }
    </script>
