    <style>
        :root{--sidebar-w:260px;--toolbar-h:52px;--accent:#646cff;--c-core:#646cff;--c-tool:#f59e0b;--c-perm:#ef4444;--c-life:#8b5cf6;--c-prompt:#22c55e;--c-ctx:#06b6d4;--c-mem:#a855f7;--c-resil:#f97316;--c-recover:#ec4899;--c-plan:#14b8a6;--c-sub:#6366f1;--c-trigger:#eab308;--c-channel:#3b82f6;--c-integ:#10b981}
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{overflow:hidden!important;height:100vh!important;min-height:0!important;display:block!important;flex-direction:unset!important}
        body{font-family:'LXGW WenKai',-apple-system,sans-serif;background:#0a0a0a;color:#e8e8e8}
        /* 左侧导航 */
        .sidebar{position:fixed!important;top:0!important;left:0!important;width:var(--sidebar-w)!important;height:100vh!important;background:#111;border-right:1px solid #1e1e1e;overflow-y:auto;z-index:100;padding-top:calc(var(--nav-h,56px) + var(--toolbar-h))!important}
        .sidebar-header{padding:12px 16px;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:#111;z-index:1}
        .sidebar-header h2{font-size:1rem;margin-bottom:6px}
        .sidebar-search{width:100%;padding:6px 10px;border:1px solid #333;border-radius:6px;background:#1a1a1a;color:#e8e8e8;font-size:.8rem;outline:none}
        .sidebar-search:focus{border-color:var(--accent)}
        .sidebar-group{margin:8px 0}
        .sidebar-group-title{font-size:.7rem;color:#666;text-transform:uppercase;letter-spacing:1px;padding:8px 16px 4px;font-weight:600}
        .sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 16px;cursor:pointer;font-size:.82rem;color:#aaa;transition:all .15s;border-left:3px solid transparent}
        .sidebar-item:hover{background:#1a1a1a;color:#e8e8e8}
        .sidebar-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(100,108,255,.08)}
        .sidebar-item .num{font-size:.7rem;color:#555;width:22px;flex-shrink:0}
        .sidebar-item.active .num{color:var(--accent)}
        /* 顶部工具栏 */
        .toolbar{position:fixed!important;top:var(--nav-h,56px)!important;left:var(--sidebar-w)!important;right:0!important;height:var(--toolbar-h)!important;background:#111;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;padding:0 20px;gap:12px;z-index:100}
        .toolbar-title{font-size:1rem;font-weight:600;white-space:nowrap}
        .toolbar-pos{font-size:.75rem;color:#666;margin-left:8px}

        .toolbar-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        /* 移动端汉堡 */
        .hamburger{display:none;position:fixed;top:10px;left:12px;z-index:200;background:#111;border:1px solid #333;border-radius:6px;padding:6px 10px;color:#e8e8e8;font-size:1.2rem;cursor:pointer}
        /* 主内容区 */
        .main{margin-left:var(--sidebar-w)!important;margin-top:calc(var(--nav-h,56px) + var(--toolbar-h))!important;height:calc(100vh - var(--nav-h,56px) - var(--toolbar-h))!important;overflow-y:auto!important;scroll-behavior:smooth}
        /* 每个专题区域 */
        .section{padding:32px 40px;min-height:400px;border-bottom:1px solid #1a1a1a}
        .section-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
        .section-num{font-size:1.8rem;font-weight:700;opacity:.15}
        .section-title{font-size:1.3rem;font-weight:600}
        .section-subtitle{font-size:.8rem;color:#666;margin-top:2px}
        /* SVG 流程图 */
        .flow-container{background:#0d0d0d;border:1px solid #1e1e1e;border-radius:12px;padding:24px;margin:16px 0;overflow-x:auto}
        .flow-svg{display:block;margin:0 auto}
        .flow-svg text{font-family:'LXGW WenKai',sans-serif}
        .node-rect{rx:10;ry:10;stroke-width:2;cursor:pointer;transition:all .2s}
        .node-rect:hover{filter:brightness(1.3) drop-shadow(0 0 8px currentColor)}
        .node-label{font-size:13px;fill:#e8e8e8;pointer-events:none}
        .node-sub{font-size:10px;fill:#888;pointer-events:none}
        .edge{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
        .edge-active{stroke:var(--accent);stroke-width:2}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .pulse{animation:pulse 1.5s ease-in-out infinite}
        /* 详情面板 */
        .detail{position:fixed;bottom:0;left:var(--sidebar-w);right:0;max-height:45vh;background:#111;border-top:1px solid #1e1e1e;padding:20px 24px;z-index:90;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
        .detail.show{transform:translateY(0)}
        .detail-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
        .detail-icon{font-size:1.5rem}
        .detail-head h3{font-size:1.1rem;margin:0}
        .detail-head p{font-size:.8rem;color:#666;margin:0}
        .detail-close{margin-left:auto;background:none;border:none;color:#666;font-size:1.3rem;cursor:pointer}
        .detail-close:hover{color:#e8e8e8}
        .detail-body{font-size:.88rem;line-height:1.8;color:#ccc}
        .detail-body h4{color:var(--accent);font-size:.95rem;margin:12px 0 6px}
        .detail-body ul{padding-left:1.2rem}
        .detail-body li{margin-bottom:4px}
        .detail-body .analogy{background:#1a1a1a;border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:.85rem}
        .detail-body .analogy::before{content:'💡 类比：';font-weight:600;color:var(--accent)}
        .detail-body .example{background:#0d0d0d;border:1px solid #1e1e1e;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:.85rem}
        .detail-body .example::before{content:'🔧 实际应用：';font-weight:600;color:#f59e0b}
        /* 移动端适配 */
        @media(max-width:768px){
            .sidebar{transform:translateX(-100%);transition:transform .3s}

            .hamburger{display:block}
            .toolbar{left:0!important;top:var(--nav-h,56px)!important}
            .main{margin-left:0!important;margin-top:calc(var(--nav-h,56px) + var(--toolbar-h))!important;height:calc(100vh - var(--nav-h,56px) - var(--toolbar-h))!important}
            .section{padding:20px 16px}
            .detail{left:0!important}
        }

    <script src="/nav.js?v2"></script>
    <script>
    // ========== 数据定义 ==========
    const SECTIONS = [
      { id:'u01', title:'核心循环', en:'Agent Loop', group:'core', icon:'🔄', color:'var(--c-core)',
        desc:'一切 Agent 的公分母：触发 → 装配上下文 → LLM 推理 → 工具调用? → 执行 → 回馈 → while 循环',
        nodes:['trigger','context_assembly','llm_reason','tool_decide','execute','feedback'],
        detail:{
          trigger:{title:'触发 Trigger',desc:'启动 Agent 循环的入口',body:'<h4>触发方式</h4><ul><li><strong>用户消息</strong>— 最常见，用户发一条消息触发回复</li><li><strong>定时事件</strong>— Cron/Heartbeat 定期唤醒</li><li><strong>系统事件</strong>— 文件变化、Webhook、其他 Agent 消息</li><li><strong>内部事件</strong>— 子任务完成、超时、错误恢复</li></ul><div class="analogy">就像人的"闹钟"：可以是别人叫你（用户消息）、闹钟响了（定时）、或者听到门铃（系统事件）</div><div class="example">OpenClaw 的 Heartbeat 每30分钟触发一次，检查邮件、日历等</div>'},
          context_assembly:{title:'装配上下文',desc:'把所有相关信息打包给 LLM',body:'<h4>上下文组成</h4><ul><li><strong>System Prompt</strong>— Agent 的身份、能力、规则</li><li><strong>对话历史</strong>— 最近 N 轮对话</li><li><strong>工具定义</strong>— 可用工具的 JSON Schema</li><li><strong>RAG 检索结果</strong>— 从知识库拉取的相关文档</li><li><strong>环境信息</strong>— 时间、地点、用户偏好</li></ul><div class="analogy">就像你开会前整理资料：把相关文件、邮件、数据都摊在桌上</div>'},
          llm_reason:{title:'LLM 推理',desc:'大模型理解上下文，决定下一步',body:'<h4>推理策略</h4><ul><li><strong>Chain-of-Thought</strong>— 一步步推理</li><li><strong>Tree-of-Thought</strong>— 探索多条路径</li><li><strong>ReAct</strong>— 推理+行动交替</li></ul><div class="analogy">就像大脑思考：看到问题 → 调动记忆 → 分析判断 → 决定做什么</div>'},
          tool_decide:{title:'工具决策',desc:'LLM 判断是否需要调用工具',body:'<h4>决策逻辑</h4><ul><li>LLM 输出工具调用请求（JSON）</li><li>如果没有工具调用 → 直接回复用户</li><li>如果有工具调用 → 执行工具后继续循环</li></ul><div class="analogy">就像你判断"这件事我自己能做"还是"需要查一下/问一下别人"</div>'},
          execute:{title:'执行 Action',desc:'调用工具或生成回复',body:'<h4>执行类型</h4><ul><li><strong>工具执行</strong>— 调用 API、运行代码、操作文件</li><li><strong>文本生成</strong>— 直接回复用户</li><li><strong>子任务派发</strong>— 把任务交给子 Agent</li></ul><div class="example">OpenClaw 的 exec 工具可以运行 shell 命令、read 可以读文件</div>'},
          feedback:{title:'反馈 Feedback',desc:'执行结果回馈给 LLM，决定是否继续',body:'<h4>反馈循环</h4><ul><li>工具返回结果 → 注入上下文 → LLM 再次推理</li><li>如果 LLM 判断"任务完成" → 回复用户</li><li>如果 LLM 判断"还需要做" → 继续循环</li></ul><div class="analogy">就像你做菜：尝一口（反馈）→ 咸了加水淡了加盐（调整）→ 再尝 → 直到满意</div>'}
        }
      },
      { id:'u02', title:'工具系统', en:'Tool Use', group:'core', icon:'🔧', color:'var(--c-tool)',
        desc:'给 AI 装上手和脚：Function Calling 机制、工具注册、参数校验',
        nodes:['fc_mechanism','tool_registry','param_schema','result_handling'],
        detail:{
          fc_mechanism:{title:'Function Calling',desc:'LLM 输出结构化的工具调用请求',body:'<h4>机制流程</h4><ul><li>定义工具的 JSON Schema（名称、参数、描述）</li><li>LLM 分析用户意图，决定调用哪个工具</li><li>LLM 输出 JSON 格式的调用请求</li><li>系统执行工具，返回结果</li><li>LLM 基于结果生成最终回复</li></ul><div class="analogy">就像你给下属下指令：说清楚"做什么"、"用什么参数"，下属执行后汇报结果</div>'},
          tool_registry:{title:'工具注册',desc:'告诉 LLM 有哪些工具可用',body:'<h4>注册方式</h4><ul><li><strong>静态注册</strong>— 在 System Prompt 中定义所有工具</li><li><strong>动态注册</strong>— 根据场景加载相关工具</li><li><strong>MCP 协议</strong>— 标准化的工具发现和调用协议</li></ul><div class="example">OpenClaw 通过 Skills 系统注册工具，每个 Skill 定义自己的工具集</div>'},
          param_schema:{title:'参数校验',desc:'确保 LLM 传入合法参数',body:'<h4>校验层</h4><ul><li><strong>类型检查</strong>— string/number/boolean/array/object</li><li><strong>必填检查</strong>— 哪些参数是必须的</li><li><strong>范围检查</strong>— 数值范围、字符串长度</li><li><strong>自定义校验</strong>— 业务逻辑校验</li></ul>'},
          result_handling:{title:'结果处理',desc:'工具返回结果的标准化和错误处理',body:'<h4>处理策略</h4><ul><li><strong>成功</strong>— 格式化结果注入上下文</li><li><strong>失败</strong>— 错误信息注入，LLM 决定重试或换方案</li><li><strong>超时</strong>— 设置合理超时，避免无限等待</li><li><strong>重试</strong>— 网络错误自动重试</li></ul><div class="example">OpenClaw 的 exec 工具有 yieldMs 参数，长命令自动后台化</div>'}
        }
      },
      { id:'u03', title:'权限与确认', en:'Permission', group:'core', icon:'🔐', color:'var(--c-perm)',
        desc:'安全边界：哪些操作需要确认，哪些可以自主执行',
        nodes:['permission_levels','confirmation_flow','sandbox'],
        detail:{
          permission_levels:{title:'权限分级',desc:'不同操作的风险等级',body:'<h4>三级权限</h4><ul><li><strong>绿色（自由执行）</strong>— 读文件、搜索、查日历</li><li><strong>黄色（需要确认）</strong>— 发邮件、发消息、修改配置</li><li><strong>红色（严格限制）</strong>— 删除数据、执行破坏性命令</li></ul><div class="analogy">就像公司的审批流程：日常采购自己定，大额支出要老板批</div>'},
          confirmation_flow:{title:'确认流程',desc:'高风险操作的审批机制',body:'<h4>流程</h4><ul><li>Agent 判断操作风险等级</li><li>高风险 → 暂停，向用户展示操作详情</li><li>用户确认 → 执行；用户拒绝 → 取消或换方案</li><li>allow-once 模式：仅本次授权，下次重新确认</li></ul><div class="example">OpenClaw 的 elevated 权限：sudo 命令需要用户手动 /approve</div>'},
          sandbox:{title:'沙箱隔离',desc:'限制 Agent 的能力边界',body:'<h4>隔离机制</h4><ul><li><strong>文件系统</strong>— 限制可访问的目录</li><li><strong>网络</strong>— 限制可访问的外部地址</li><li><strong>进程</strong>— 限制可执行的命令</li><li><strong>资源</strong>— 限制 CPU/内存/Token 用量</li></ul><div class="analogy">就像儿童安全锁：可以玩，但有些柜子打不开</div>'}
        }
      },
      { id:'u04', title:'生命周期钩子', en:'Lifecycle', group:'core', icon:'♻️', color:'var(--c-life)',
        desc:'Agent 从启动到结束的完整生命周期管理',
        nodes:['init','warmup','run','cleanup','error'],
        detail:{
          init:{title:'初始化 Init',desc:'加载配置、注册工具、建立连接',body:'<h4>初始化步骤</h4><ul><li>加载 System Prompt 和配置</li><li>注册可用工具和 Skill</li><li>建立数据库/API 连接</li><li>恢复上次会话状态</li></ul>'},
          warmup:{title:'预热 Warmup',desc:'加载模型、缓存数据、预编译',body:'<h4>预热内容</h4><ul><li>模型加载到 GPU（如果自部署）</li><li>常用数据缓存到内存</li><li>向量索引预加载</li><li>工具连接池初始化</li></ul>'},
          run:{title:'运行 Run',desc:'处理请求、执行任务的主循环',body:'<h4>运行模式</h4><ul><li><strong>单次</strong>— 处理一个请求后结束</li><li><strong>持续</strong>— 保持运行，等待新请求</li><li><strong>流式</strong>— 边生成边输出</li></ul>'},
          cleanup:{title:'清理 Cleanup',desc:'释放资源、保存状态、关闭连接',body:'<h4>清理内容</h4><ul><li>关闭数据库连接</li><li>保存会话状态到磁盘</li><li>清理临时文件</li><li>释放 GPU 显存</li></ul>'},
          error:{title:'错误处理 Error',desc:'异常捕获、降级、恢复策略',body:'<h4>错误策略</h4><ul><li><strong>捕获</strong>— try/catch 包裹所有关键操作</li><li><strong>降级</strong>— 主方案失败用备选方案</li><li><strong>重试</strong>— 网络错误自动重试</li><li><strong>上报</strong>— 严重错误通知用户</li></ul><div class="example">OpenClaw 的 fallback 模型：主模型 429 时自动切换备选模型</div>'}
        }
      },
      { id:'u05', title:'提示词与技能', en:'Prompt & Skills', group:'context', icon:'📝', color:'var(--c-prompt)',
        desc:'System Prompt 设计、Skill 系统、动态指令注入',
        nodes:['system_prompt','skill_system','dynamic_injection'],
        detail:{
          system_prompt:{title:'System Prompt',desc:'定义 Agent 的身份、能力、行为规则',body:'<h4>设计原则</h4><ul><li><strong>身份定义</strong>— 你是谁、你的角色</li><li><strong>能力边界</strong>— 你能做什么、不能做什么</li><li><strong>行为规则</strong>— 回复风格、安全约束</li><li><strong>输出格式</strong>— JSON/Markdown/纯文本</li></ul><div class="analogy">就像员工手册：新员工入职第一天，先读一遍公司规定</div>'},
          skill_system:{title:'Skill 系统',desc:'模块化的能力扩展',body:'<h4>Skill 架构</h4><ul><li><strong>SKILL.md</strong>— 技能描述和使用指南</li><li><strong>工具定义</strong>— 技能提供的工具集</li><li><strong>示例</strong>— 典型使用场景</li><li><strong>版本控制</strong>— 技能的版本管理</li></ul><div class="example">OpenClaw 的 Skills：weather、slack、notion 等，每个 Skill 封装一个领域能力</div>'},
          dynamic_injection:{title:'动态注入',desc:'根据上下文动态调整 Prompt',body:'<h4>注入内容</h4><ul><li><strong>用户偏好</strong>— MEMORY.md 中的长期记忆</li><li><strong>项目上下文</strong>— AGENTS.md、当前项目文件</li><li><strong>环境信息</strong>— 时间、日期、天气</li><li><strong>工具状态</strong>— 哪些工具可用、哪些故障</li></ul>'}
        }
      },

    // ========== 渲染左侧导航 ==========
    function renderSidebar() {
      const nav = document.getElementById('sidebarNav');
      let html = '';
      GROUPS.forEach(g => {
        html += '<div class="sidebar-group"><div class="sidebar-group-title">' + g.label + '</div>';
        g.items.forEach(id => {
          const s = SECTIONS.find(x => x.id === id);
          html += '<div class="sidebar-item" data-id="' + id + '" onclick="scrollToSection(\'' + id + '\')">'
            + '<span class="num">' + id + '</span>'
            + '<span>' + s.icon + ' ' + s.title + '</span>'
            + '</div>';
        });
        html += '</div>';
      });
      nav.innerHTML = html;
    }

    // ========== 渲染主内容 ==========
    function renderSections() {
      const main = document.getElementById('mainContent');
      let html = '';
      SECTIONS.forEach(s => {
        html += '<div class="section" id="section-' + s.id + '">';
        html += '<div class="section-header">';
        html += '<span class="section-num" style="color:' + s.color + '">' + s.id.toUpperCase() + '</span>';
        html += '<div><div class="section-title">' + s.icon + ' ' + s.title + '</div>';
        html += '<div class="section-subtitle">' + s.en + ' — ' + s.desc + '</div></div>';
        html += '</div>';

        // SVG 流程图
        html += '<div class="flow-container">';
        html += renderFlow(s);
        html += '</div>';

        // 详情面板占位
        html += '<div class="detail" id="detail-' + s.id + '"></div>';
        html += '</div>';
      });
      main.innerHTML = html;
    }

    // ========== 渲染单个流程图 ==========
    function renderFlow(section) {
      const nodes = section.nodes;
      const n = nodes.length;
      const nodeW = 140, nodeH = 50, gap = 40;
      const totalW = n * nodeW + (n-1) * gap;
      const svgW = Math.max(totalW + 60, 500);
      const svgH = 120;

      let svg = '<svg class="flow-svg" viewBox="0 0 ' + svgW + ' ' + svgH + '" width="' + svgW + '" height="' + svgH + '">';
      svg += '<defs><marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#444"/></marker></defs>';

      // 连线
      for (let i = 0; i < n - 1; i++) {
        const x1 = 30 + i * (nodeW + gap) + nodeW;
        const x2 = 30 + (i+1) * (nodeW + gap);
        const y = svgH / 2;
        svg += '<line class="edge" x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '"/>';
      }
      // 循环线（从最后一个节点回到第一个）
      if (n > 2) {
        const lastX = 30 + (n-1) * (nodeW + gap) + nodeW/2;
        const firstX = 30 + nodeW/2;
        const loopY = svgH - 10;
        svg += '<path class="edge" d="M' + lastX + ',' + (svgH/2+nodeH/2) + ' L' + lastX + ',' + loopY + ' L' + firstX + ',' + loopY + ' L' + firstX + ',' + (svgH/2+nodeH/2) + '" stroke-dasharray="4,4"/>';
      }

      // 节点
      nodes.forEach((nid, i) => {
        const x = 30 + i * (nodeW + gap);
        const y = svgH/2 - nodeH/2;
        const detail = section.detail[nid];
        const label = detail ? detail.title : nid;
        const sub = detail ? detail.desc : '';
        svg += '<g class="node" onclick="showDetail(\'' + section.id + '\',\'' + nid + '\')">';
        svg += '<rect class="node-rect" x="' + x + '" y="' + y + '" width="' + nodeW + '" height="' + nodeH + '" fill="#1a1a2e" stroke="' + section.color + '"/>';
        svg += '<text class="node-label" x="' + (x+nodeW/2) + '" y="' + (y+nodeH/2-4) + '" text-anchor="middle">' + label + '</text>';
        svg += '<text class="node-sub" x="' + (x+nodeW/2) + '" y="' + (y+nodeH/2+12) + '" text-anchor="middle">' + sub.slice(0,12) + '</text>';
        svg += '</g>';
      });

      svg += '</svg>';
      return svg;
    }

    // ========== 详情面板 ==========
    function showDetail(sectionId, nodeId) {
      const section = SECTIONS.find(s => s.id === sectionId);
      if (!section || !section.detail[nodeId]) return;
      const d = section.detail[nodeId];

      document.getElementById('detailIcon').textContent = section.icon;
      document.getElementById('detailTitle').textContent = d.title;
      document.getElementById('detailDesc').textContent = d.desc;
      document.getElementById('detailBody').innerHTML = d.body;

      // 高亮侧边栏
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      const sidebarItem = document.querySelector('.sidebar-item[data-id="' + sectionId + '"]');
      if (sidebarItem) sidebarItem.classList.add('active');

      const panel = document.getElementById('detailPanel');
      panel.classList.add('show');
      // 给主内容区留出空间
      document.getElementById('mainContent').style.height = 'calc(100vh - var(--nav-h,56px) - var(--toolbar-h) - 45vh)';
    }

    function hideDetail() {
      document.getElementById('detailPanel').classList.remove('show');
      document.getElementById('mainContent').style.height = '';
    }

    // ========== 导航 ==========
    function scrollToSection(id) {
      const el = document.getElementById('section-' + id);
      if (el) {
        el.scrollIntoView({behavior:'smooth'});
        document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
        document.querySelector('.sidebar-item[data-id="' + id + '"]').classList.add('active');
        document.getElementById('posIndicator').textContent = id.toUpperCase() + ' ' + SECTIONS.find(s=>s.id===id).title;
      }
      // 移动端关闭侧边栏
      document.querySelector('.sidebar').classList.remove('open');
    }

    function expandAll() {
      document.querySelectorAll('.section .detail').forEach(el => el.classList.add('show'));
    }
    function collapseAll() {
      document.querySelectorAll('.section .detail').forEach(el => el.classList.remove('show'));
      hideDetail();
    }

    // ========== 搜索 ==========
    function filterNodes(query) {
      const q = query.toLowerCase();
      document.querySelectorAll('.sidebar-item').forEach(el => {
        const id = el.dataset.id;
        const s = SECTIONS.find(x => x.id === id);
        const match = !q || s.title.toLowerCase().includes(q) || s.en.toLowerCase().includes(q) || s.id.includes(q);
        el.style.display = match ? '' : 'none';
      });
      // 分组标题显示/隐藏
      document.querySelectorAll('.sidebar-group').forEach(g => {
        const visible = g.querySelectorAll('.sidebar-item:not([style*="display: none"])').length;
        g.style.display = visible ? '' : 'none';
      });
    }

    // ========== 滚动监听 ==========
    document.getElementById('mainContent').addEventListener('scroll', function() {
      const sections = document.querySelectorAll('.section');
      let current = 'u01';
      sections.forEach(s => {
        if (s.getBoundingClientRect().top < 200) {
          current = s.id.replace('section-','');
        }
      });
      document.getElementById('posIndicator').textContent = current.toUpperCase() + ' ' + (SECTIONS.find(s=>s.id===current)||{}).title;
      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === current);
      });
    });

    // ========== 初始化 ==========
    renderSidebar();
    renderSections();
    </script>
</body>
</html>
