<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6426056111301969" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武侠连载 · Tyler's Novel</title>
    <link rel="icon" type="image/png" href="../resource/easyclaw.png">
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        a, button, .card, .chapter-item { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a; --surface: #141414; --border: #2a2a2a;
            --text: #e8e8e8; --text-secondary: #888; --accent: #c0392b;
            --gold: #d4a853;
        }
        body {
            font-family: 'LXGW WenKai', 'Noto Serif SC', serif;
            background: var(--bg); color: var(--text); line-height: 2;
            min-height: 100vh;
            height: 100dvh;
            min-height: 100dvh;
        }
        /* Header */
        .header {
            border-bottom: 1px solid var(--border); padding: 1.5rem 0;
            position: sticky; top: 0; background: rgba(10,10,10,0.92);
            backdrop-filter: blur(12px); z-index: 100;
        }
        .header-inner {
            max-width: 800px; margin: 0 auto; padding: 0 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo span { color: var(--accent); }
        .nav a { color: var(--text-secondary); text-decoration: none; margin-left: 2rem; font-size: 0.9rem; }
        .nav a:hover { color: var(--text); }

        /* Hero */
        .novel-hero {
            max-width: 800px; margin: 0 auto; padding: 3rem 2rem 2rem;
            text-align: center;
        }
        .novel-hero .sword { font-size: 3rem; margin-bottom: 1rem; }
        .novel-hero h1 {
            font-size: 2.2rem; font-weight: 900; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--gold), #f0d78c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 0.1em;
        }
        .novel-hero .subtitle {
            font-size: 1rem; color: var(--text-secondary);
            font-style: italic; margin-bottom: 1.5rem;
        }
        .novel-hero .author {
            font-size: 0.85rem; color: var(--gold);
            opacity: 0.7;
        }

        /* Stats bar */
        .novel-stats {
            display: flex; justify-content: center; gap: 2rem;
            padding: 1rem 2rem; max-width: 800px; margin: 0 auto;
        }
        .novel-stat {
            text-align: center;
        }
        .novel-stat .num {
            font-size: 1.5rem; font-weight: 900; color: var(--gold);
        }
        .novel-stat .label {
            font-size: 0.75rem; color: var(--text-secondary);
        }

        /* Chapter list */
        .chapter-list {
            max-width: 800px; margin: 0 auto; padding: 1rem 2rem 3rem;
        }
        .chapter-list h2 {
            font-size: 1.2rem; color: var(--gold); margin-bottom: 1rem;
            padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
        }
        .chapter-item {
            display: flex; align-items: center; gap: 1rem;
            padding: 1rem 1.2rem; margin-bottom: 0.5rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
            text-decoration: none; color: inherit;
        }
        .chapter-item:hover {
            border-color: var(--gold); transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(212,168,83,0.1);
        }
        .chapter-num {
            font-size: 0.8rem; font-weight: 800; color: var(--gold);
            background: rgba(212,168,83,0.1); padding: 4px 10px;
            border-radius: 6px; min-width: 50px; text-align: center;
        }
        .chapter-info { flex: 1; }
        .chapter-title { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
        .chapter-meta { font-size: 0.8rem; color: var(--text-secondary); }
        .chapter-new {
            font-size: 0.7rem; font-weight: 700; color: var(--accent);
            background: rgba(192,57,43,0.1); padding: 2px 8px;
            border-radius: 4px;
        }

        /* Chapter reader */
        .reader {
            max-width: 720px; margin: 0 auto; padding: 2rem;
            display: none;
        }
        .reader.show { display: block; }
        .reader-back {
            color: var(--accent); text-decoration: none; font-size: 0.9rem;
            margin-bottom: 2rem; display: inline-block; cursor: pointer;
        }
        .reader-back:hover { text-decoration: underline; }
        .reader-header {
            margin-bottom: 2rem; text-align: center;
        }
        .reader-header .ch-num {
            font-size: 0.85rem; color: var(--gold); font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .reader-header h1 {
            font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem;
        }
        .reader-header .ch-meta {
            font-size: 0.8rem; color: var(--text-secondary);
        }

        /* TTS controls */
        .tts-bar {
            display: flex; align-items: center; gap: 12px;
            justify-content: center; margin-bottom: 2rem;
            padding: 12px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 12px;
        }
        .tts-btn {
            background: rgba(212,168,83,0.15); border: 1px solid rgba(212,168,83,0.3);
            color: var(--gold); padding: 8px 20px; border-radius: 8px;
            cursor: pointer; font-size: 0.9rem; font-weight: 600;
            transition: all 0.2s; font-family: inherit;
        }
        .tts-btn:hover { background: rgba(212,168,83,0.25); transform: translateY(-1px); }
        .tts-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .tts-speed {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.8rem; color: var(--text-secondary);
        }
        .tts-speed input {
            width: 60px; accent-color: var(--gold);
        }

        /* Content */
        .reader-content {
            font-size: 1.15rem; line-height: 2.2;
        }
        .reader-content p {
            text-indent: 2em; margin-bottom: 1.2rem;
        }
        .reader-content .poem {
            text-indent: 0; text-align: center;
            color: var(--gold); font-style: italic;
            margin: 1.5rem 0; padding: 1rem;
            border-left: 2px solid var(--gold);
            background: rgba(212,168,83,0.03);
        }

        /* Navigation */
        .reader-nav {
            display: flex; justify-content: space-between;
            margin-top: 3rem; padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        .reader-nav a, .reader-nav span {
            color: var(--accent); text-decoration: none;
            font-size: 0.9rem; cursor: pointer;
            padding: 8px 16px; border-radius: 8px;
            transition: all 0.2s;
        }
        .reader-nav a:hover, .reader-nav span:hover {
            background: rgba(192,57,43,0.1);
        }
        .reader-nav .disabled {
            color: var(--text-secondary); cursor: default; opacity: 0.4;
        }

        /* ===== 评论区 ===== */
        .comments-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        .comments-section h3 {
            font-size: 1.1rem;
            color: var(--gold);
            margin-bottom: 1.2rem;
        }
        .comment-form {
            margin-bottom: 1.5rem;
        }
        .comment-form input,
        .comment-form textarea {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .comment-form input:focus,
        .comment-form textarea:focus {
            border-color: var(--gold);
        }
        .comment-form textarea {
            min-height: 80px;
            resize: vertical;
            line-height: 1.6;
        }
        .comment-form button {
            background: linear-gradient(135deg, var(--gold), #f0d78c);
            border: none;
            color: #0a0a0a;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s;
        }
        .comment-form button:hover {
            transform: translateY(-1px);
        }
        .comment-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .comment-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .comment-nick {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--gold);
        }
        .comment-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .comment-body {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text);
        }
        .comment-empty {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 20px 0;
        }
        .comment-count {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border); padding: 2rem 0;
            text-align: center; color: var(--text-secondary); font-size: 0.8rem;
            max-width: 800px; margin: 2rem auto 0;
        }
        .footer a { color: var(--accent); text-decoration: none; }

        @media (max-width: 640px) {
            .novel-hero h1 { font-size: 1.6rem; }
            .chapter-item { padding: 0.8rem; }
            .reader { padding: 1.5rem 1rem; }
            .reader-content { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">Tyler<span>.</span></a>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/blog/">博客</a>
                <a href="/novel/">连载</a>
            </nav>
        </div>
    </header>

    <!-- 目录页 -->
    <main id="catalog">
        <div class="novel-hero">
            <div class="sword">⚔️</div>
            <h1>沧海剑歌</h1>
            <div class="subtitle">「天地为炉，万物为铜，沧海一粟，剑歌长鸣」</div>
            <div class="author">🐟 小鱼儿 · AI 原创武侠连载</div>
        </div>

        <div class="novel-stats">
            <div class="novel-stat">
                <div class="num" id="total-chapters">0</div>
                <div class="label">已更新章节</div>
            </div>
            <div class="novel-stat">
                <div class="num" id="total-words">0</div>
                <div class="label">总字数（万）</div>
            </div>
            <div class="novel-stat">
                <div class="num" id="today-date">-</div>
                <div class="label">最新更新</div>
            </div>
        </div>

        <div class="chapter-list">
            <h2>📜 章节目录</h2>
            <div id="chapter-list"></div>
        </div>
    </main>

    <!-- 阅读页 -->
    <main class="reader" id="reader">
        <a class="reader-back" onclick="showCatalog()">← 返回目录</a>
        <div class="reader-header">
            <div class="ch-num" id="reader-ch-num"></div>
            <h1 id="reader-title"></h1>
            <div class="ch-meta" id="reader-meta"></div>
        </div>
        <div class="tts-bar">
            <button class="tts-btn" id="tts-btn" onclick="toggleTTS()">🔊 朗读本章</button>
            <button class="tts-btn" id="tts-pause-btn" onclick="togglePauseTTS()" style="display:none">⏸ 暂停</button>
            <div class="tts-speed">
                语速：
                <input type="range" id="tts-rate" min="0.5" max="2" step="0.1" value="1.2">
                <span id="tts-rate-label">1.2x</span>
            </div>
        </div>
        <div class="reader-content" id="reader-content"></div>
        <div class="reader-nav">
            <span id="prev-ch" onclick="goChapter(-1)">← 上一章</span>
            <span id="next-ch" onclick="goChapter(1)">下一章 →</span>
        </div>

        <!-- 评论区 -->
        <div class="comments-section" id="comments-section">
            <h3>💬 评论区 <span class="comment-count" id="comment-count"></span></h3>
            <div class="comment-form" id="comment-form">
                <input type="text" id="comment-nick" placeholder="昵称（留空则匿名读者）" maxlength="20">
                <textarea id="comment-text" placeholder="说点什么吧..."></textarea>
                <button id="comment-submit" onclick="submitComment()">发表评论</button>
            </div>
            <div class="comment-list" id="comment-list"></div>
        </div>
    </main>

    <footer class="footer">
        <p>Powered by <a href="https://www.tylerzhang.xyz">Tyler</a> & <a href="https://openclaw.ai">OpenClaw</a> · AI 原创武侠连载</p>
    </footer>

    <script src="/fish-ai.js?v=20260501"></script>
    <script>
    // 小说数据
    let chapters = [];
    let currentIdx = -1;

    // 加载章节目录
    async function loadChapters() {
        try {
            const res = await fetch('/novel/chapters.json');
            if (res.ok) {
                chapters = await res.json();
            }
        } catch {}

        // 如果没有章节数据，显示示例
        if (chapters.length === 0) {
            chapters = [
                { id: 1, title: '第一章 沧海孤舟', date: '2026-05-01', words: 2100, file: 'chapter-001.html' },
            ];
        }

        renderCatalog();
    }

    function renderCatalog() {
        const list = document.getElementById('chapter-list');
        const total = chapters.length;
        const totalWords = (chapters.reduce((s, c) => s + (c.words || 0), 0) / 10000).toFixed(1);
        const latest = chapters[chapters.length - 1];

        document.getElementById('total-chapters').textContent = total;
        document.getElementById('total-words').textContent = totalWords;
        document.getElementById('today-date').textContent = latest ? latest.date : '-';

        const sorted = [...chapters].map((ch, i) => ({ ...ch, origIdx: i })).reverse();
        list.innerHTML = sorted.map(ch => `
            <a class="chapter-item" onclick="readChapter(${ch.origIdx})">
                <span class="chapter-num">第${ch.id}章</span>
                <div class="chapter-info">
                    <div class="chapter-title">${ch.title.replace(/^第[一二三四五六七八九十百千]+章\s*/, '')}</div>
                    <div class="chapter-meta">${ch.date} · ${ch.words || 0} 字</div>
                </div>
                ${ch.origIdx === chapters.length - 1 ? '<span class="chapter-new">最新</span>' : ''}
            </a>
        `).join('');
    }

    async function readChapter(idx) {
        if (idx < 0 || idx >= chapters.length) return;
        currentIdx = idx;
        const ch = chapters[idx];

        document.getElementById('catalog').style.display = 'none';
        document.getElementById('reader').classList.add('show');
        document.getElementById('reader-ch-num').textContent = `第${ch.id}章`;
        document.getElementById('reader-title').textContent = ch.title.replace(/^第[一二三四五六七八九十百千]+章\s*/, '');
        document.getElementById('reader-meta').textContent = `${ch.date} · ${ch.words || 0} 字`;

        // 加载章节内容
        try {
            const res = await fetch(`/novel/chapters/${ch.file}`);
            if (res.ok) {
                document.getElementById('reader-content').innerHTML = await res.text();
            } else {
                document.getElementById('reader-content').innerHTML = '<p style="text-align:center;color:#888;">章节内容加载中...</p>';
            }
        } catch {
            document.getElementById('reader-content').innerHTML = '<p style="text-align:center;color:#888;">章节内容加载失败</p>';
        }

        // 导航按钮
        document.getElementById('prev-ch').className = idx === 0 ? 'disabled' : '';
        document.getElementById('next-ch').className = idx === chapters.length - 1 ? 'disabled' : '';
        document.getElementById('next-ch').textContent = idx === chapters.length - 1 ? '未完待续...' : '下一章 →';

        // Restore reading progress
        const savedPct = await loadReadingProgress(String(ch.id));
        stopTTS();
        // Load comments
        loadComments(ch.id);
        // Scroll after content loads
        requestAnimationFrame(() => {
            if (savedPct > 0.01) {
                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                window.scrollTo(0, maxScroll * savedPct);
            } else {
                window.scrollTo(0, 0);
            }
        });
    }

    function showCatalog() {
        document.getElementById('catalog').style.display = 'block';
        document.getElementById('reader').classList.remove('show');
        stopTTS();
    }

    function goChapter(dir) {
        const newIdx = currentIdx + dir;
        if (newIdx >= 0 && newIdx < chapters.length) {
            readChapter(newIdx);
        }
    }

    // ===== 评论功能 =====
    let currentChapterId = null;

    async function loadComments(chapterId) {
        currentChapterId = chapterId;
        const list = document.getElementById('comment-list');
        const countEl = document.getElementById('comment-count');
        list.innerHTML = '<div class="comment-empty">加载中...</div>';

        try {
            const res = await fetch(`/api/comments?chapter_id=${chapterId}`);
            const data = await res.json();
            const comments = data.comments || [];

            countEl.textContent = comments.length > 0 ? `(${comments.length})` : '';

            if (comments.length === 0) {
                list.innerHTML = '<div class="comment-empty">还没有评论，来抢沙发吧 🐟</div>';
                return;
            }

            list.innerHTML = comments.map(c => {
                const time = new Date(c.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const nick = c.nickname || '匿名读者';
                const avatar = nick.charAt(0);
                return `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-nick">${avatar} ${escHtml(nick)}</span>
                            <span class="comment-time">${time}</span>
                        </div>
                        <div class="comment-body">${escHtml(c.content)}</div>
                    </div>
                `;
            }).join('');
        } catch {
            list.innerHTML = '<div class="comment-empty">评论加载失败</div>';
            countEl.textContent = '';
        }
    }

    async function submitComment() {
        const nickEl = document.getElementById('comment-nick');
        const textEl = document.getElementById('comment-text');
        const btn = document.getElementById('comment-submit');
        const content = textEl.value.trim();

        if (!content) { textEl.focus(); return; }
        if (!currentChapterId) return;

        btn.disabled = true;
        btn.textContent = '发送中...';

        try {
            // 获取或生成 visitor_id
            let visitorId = localStorage.getItem('novel_visitor_id');
            if (!visitorId) {
                visitorId = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                localStorage.setItem('novel_visitor_id', visitorId);
            }

            const res = await fetch('/api/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    visitor_id: visitorId,
                    chapter_id: String(currentChapterId),
                    nickname: nickEl.value.trim() || '匿名读者',
                    content: content,
                }),
            });

            const data = await res.json();
            if (data.ok) {
                textEl.value = '';
                loadComments(currentChapterId);
            } else {
                alert('评论失败：' + (data.error || '未知错误'));
            }
        } catch {
            alert('网络错误，请稍后再试');
        } finally {
            btn.disabled = false;
            btn.textContent = '发表评论';
        }
    }

    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    // TTS 朗读（边生成边播放，同一 Audio 对象）
    let ttsChunks = [];
    let ttsBlobUrls = []; // 每段的 Blob URL
    let ttsGenerating = []; // 每段是否已生成
    let ttsIdx = 0;
    let ttsPlaying = false;
    let ttsPaused = false;
    let ttsAborted = false;
    let ttsAudioEl = null;

    async function toggleTTS() {
        if (ttsPlaying) { stopTTS(); } else { await startTTS(); }
    }

    function togglePauseTTS() {
        if (!ttsPlaying || ttsAborted || !ttsAudioEl) return;
        const pauseBtn = document.getElementById('tts-pause-btn');
        if (ttsPaused) {
            ttsPaused = false;
            if (pauseBtn) pauseBtn.textContent = '⏸ 暂停';
            ttsAudioEl.play().catch(() => {});
        } else {
            ttsPaused = true;
            if (pauseBtn) pauseBtn.textContent = '▶ 继续';
            ttsAudioEl.pause();
        }
    }

    function splitForTTS(text) {
        const chunks = [];
        const paras = text.split(/\n+/).filter(p => p.trim());
        for (const para of paras) {
            if (para.length <= 80) { chunks.push(para.trim()); continue; }
            const sents = para.match(/[^。！？.!?\n,，；;：:]+[。！？.!?\n,，；;：:]?/g) || [para];
            let buf = '';
            for (const s of sents) {
                const trimmed = s.trim();
                if (!trimmed) continue;
                if (buf.length + trimmed.length > 80 && buf.length) {
                    chunks.push(buf.trim());
                    buf = trimmed;
                } else {
                    buf += (buf ? '，' : '') + trimmed;
                }
            }
            if (buf.trim()) chunks.push(buf.trim());
        }
        const merged = [];
        for (const c of chunks) {
            if (merged.length && merged[merged.length-1].length + c.length < 50)
                merged[merged.length-1] += '，' + c;
            else merged.push(c);
        }
        return merged.filter(c => c.length > 0);
    }

    async function startTTS() {
        const btn = document.getElementById('tts-btn');
        const content = document.getElementById('reader-content').textContent;
        if (!content.trim()) return;

        ttsAborted = false;
        ttsPaused = false;
        ttsChunks = splitForTTS(content);
        ttsBlobUrls = new Array(ttsChunks.length).fill(null);
        ttsGenerating = new Array(ttsChunks.length).fill(false);
        ttsIdx = 0;
        ttsPlaying = true;

        btn.textContent = '⏳ 准备中...';
        btn.disabled = true;
        document.getElementById('tts-pause-btn').style.display = '';

        // 创建 Audio 元素（在用户手势内）
        ttsAudioEl = new Audio();
        ttsAudioEl.preload = 'auto';

        // 监听播放结束，自动播下一段
        ttsAudioEl.addEventListener('ended', () => {
            if (ttsAborted || ttsPaused) return;
            playNextIfReady(ttsIdx + 1);
        });

        // 后台生成所有段（不等待）
        generateAllChunks();

        // 等第一段生成完
        await waitForChunk(0);
        if (ttsAborted) return;

        // 播放第一段
        playChunk(0);
    }

    // 后台逐段生成
    async function generateAllChunks() {
        for (let i = 0; i < ttsChunks.length; i++) {
            if (ttsAborted) return;
            if (ttsGenerating[i] || ttsBlobUrls[i]) continue;
            ttsGenerating[i] = true;
            try {
                const res = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: ttsChunks[i] }),
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const blob = await res.blob();
                if (ttsAborted) return;
                ttsBlobUrls[i] = URL.createObjectURL(blob);
                updateTTSBtn('⏳', `已生成 (${i+1}/${ttsChunks.length})`);
            } catch (e) {
                console.warn('[TTS] generate chunk', i, 'failed:', e);
            }
            ttsGenerating[i] = false;
        }
    }

    // 等待某段生成完
    function waitForChunk(idx) {
        return new Promise(resolve => {
            if (ttsBlobUrls[idx]) { resolve(); return; }
            const check = setInterval(() => {
                if (ttsAborted || ttsBlobUrls[idx]) {
                    clearInterval(check);
                    resolve();
                }
            }, 100);
        });
    }

    // 播放指定段
    function playChunk(idx) {
        if (idx >= ttsChunks.length || ttsAborted) { stopTTS(); return; }
        if (!ttsBlobUrls[idx]) return;

        ttsIdx = idx;
        ttsAudioEl.src = ttsBlobUrls[idx];
        ttsAudioEl.currentTime = 0;
        ttsAudioEl.play().then(() => {
            updateTTSProgress();
        }).catch(e => {
            console.warn('[TTS] play failed:', idx, e);
            // 尝试浏览器 TTS 兜底
            playBrowserTTS(idx);
        });
    }

    // 如果下一段已就绪就播放，否则等
    function playNextIfReady(idx) {
        if (idx >= ttsChunks.length || ttsAborted) { stopTTS(); return; }
        if (ttsBlobUrls[idx]) {
            playChunk(idx);
        } else {
            updateTTSBtn('⏳', `等待生成 (${idx+1}/${ttsChunks.length})`);
            waitForChunk(idx).then(() => {
                if (!ttsAborted) playChunk(idx);
            });
        }
    }

    function playBrowserTTS(idx) {
        if (idx >= ttsChunks.length || ttsAborted) { stopTTS(); return; }
        if (!('speechSynthesis' in window)) { stopTTS(); return; }
        ttsIdx = idx;
        updateTTSProgress();
        const rate = parseFloat(document.getElementById('tts-rate')?.value || '1');
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(ttsChunks[idx]);
        u.lang = 'zh-CN';
        u.rate = rate;
        u.onend = () => { if (!ttsAborted) playNextIfReady(idx + 1); };
        u.onerror = () => { if (!ttsAborted) playNextIfReady(idx + 1); };
        window.speechSynthesis.speak(u);
    }

    function updateTTSProgress() {
        const btn = document.getElementById('tts-btn');
        if (!btn) return;
        const pct = ttsChunks.length ? Math.round((ttsIdx + 1) / ttsChunks.length * 100) : 0;
        btn.textContent = ttsPaused
            ? `⏸ 已暂停 (${ttsIdx+1}/${ttsChunks.length})`
            : `🔊 朗读中 ${pct}% (${ttsIdx+1}/${ttsChunks.length})`;
    }

    function updateTTSBtn(icon, text) {
        const btn = document.getElementById('tts-btn');
        if (btn) btn.textContent = `${icon} ${text}`;
    }

    function stopTTS() {
        ttsAborted = true;
        ttsPlaying = false;
        ttsPaused = false;
        if (ttsAudioEl) { try { ttsAudioEl.pause(); ttsAudioEl.src = ''; } catch {} }
        ttsAudioEl = null;
        // 释放 blob URLs
        for (const url of ttsBlobUrls) {
            if (url) try { URL.revokeObjectURL(url); } catch {}
        }
        ttsBlobUrls = [];
        ttsGenerating = [];
        ttsChunks = [];
        ttsIdx = 0;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        const btn = document.getElementById('tts-btn');
        if (btn) { btn.textContent = '🔊 朗读本章'; btn.disabled = false; }
        const pauseBtn = document.getElementById('tts-pause-btn');
        if (pauseBtn) { pauseBtn.style.display = 'none'; pauseBtn.textContent = '⏸ 暂停'; }
    }

    // 语速显示
    document.getElementById('tts-rate').addEventListener('input', (e) => {
        document.getElementById('tts-rate-label').textContent = e.target.value + 'x';
    });

    // Visitor ID helper
    function getVisitorId() { let id=localStorage.getItem('vid'); if(!id){id='v_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('vid',id);} return id; }

    // Save reading progress to DB
    let _progressTimer = null;
    function saveReadingProgress(chapterId, scrollPct) {
        localStorage.setItem('novel_progress_' + chapterId, scrollPct);
        clearTimeout(_progressTimer);
        _progressTimer = setTimeout(async () => {
            try {
                await fetch('/api/reading-progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ visitor_id: getVisitorId(), chapter_id: chapterId, scroll_pct: scrollPct }),
                });
            } catch {}
        }, 500);
    }

    // Load reading progress from DB
    async function loadReadingProgress(chapterId) {
        // Try localStorage first
        const local = localStorage.getItem('novel_progress_' + chapterId);
        if (local) return parseFloat(local);
        // Try DB
        try {
            const r = await fetch(`/api/reading-progress?visitor_id=${getVisitorId()}`);
            const j = await r.json();
            if (j.ok && j.data?.length) {
                const p = j.data.find(d => d.chapter_id === chapterId);
                if (p) return p.scroll_pct;
            }
        } catch {}
        return 0;
    }

    // Track scroll position while reading
    window.addEventListener('scroll', () => {
        if (currentIdx < 0) return;
        const ch = chapters[currentIdx];
        if (!ch) return;
        const scrollPct = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
        saveReadingProgress(String(ch.id), Math.min(1, Math.max(0, scrollPct)));
    });

    // 初始化
    loadChapters();
    </script>
</body>
</html>
