<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武侠连载 · Tyler's Novel</title>
    <link rel="icon" type="image/png" href="../resource/easyclaw.png">
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a; --surface: #141414; --border: #2a2a2a;
            --text: #e8e8e8; --text-secondary: #888; --accent: #c0392b;
            --gold: #d4a853;
        }
        body {
            font-family: 'LXGW WenKai', 'Noto Serif SC', serif;
            background: var(--bg); color: var(--text); line-height: 2;
            min-height: 100vh;
        }
        /* Header */
        .header {
            border-bottom: 1px solid var(--border); padding: 1.5rem 0;
            position: sticky; top: 0; background: rgba(10,10,10,0.92);
            backdrop-filter: blur(12px); z-index: 100;
        }
        .header-inner {
            max-width: 800px; margin: 0 auto; padding: 0 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo span { color: var(--accent); }
        .nav a { color: var(--text-secondary); text-decoration: none; margin-left: 2rem; font-size: 0.9rem; }
        .nav a:hover { color: var(--text); }

        /* Hero */
        .novel-hero {
            max-width: 800px; margin: 0 auto; padding: 3rem 2rem 2rem;
            text-align: center;
        }
        .novel-hero .sword { font-size: 3rem; margin-bottom: 1rem; }
        .novel-hero h1 {
            font-size: 2.2rem; font-weight: 900; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--gold), #f0d78c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 0.1em;
        }
        .novel-hero .subtitle {
            font-size: 1rem; color: var(--text-secondary);
            font-style: italic; margin-bottom: 1.5rem;
        }
        .novel-hero .author {
            font-size: 0.85rem; color: var(--gold);
            opacity: 0.7;
        }

        /* Stats bar */
        .novel-stats {
            display: flex; justify-content: center; gap: 2rem;
            padding: 1rem 2rem; max-width: 800px; margin: 0 auto;
        }
        .novel-stat {
            text-align: center;
        }
        .novel-stat .num {
            font-size: 1.5rem; font-weight: 900; color: var(--gold);
        }
        .novel-stat .label {
            font-size: 0.75rem; color: var(--text-secondary);
        }

        /* Chapter list */
        .chapter-list {
            max-width: 800px; margin: 0 auto; padding: 1rem 2rem 3rem;
        }
        .chapter-list h2 {
            font-size: 1.2rem; color: var(--gold); margin-bottom: 1rem;
            padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
        }
        .chapter-item {
            display: flex; align-items: center; gap: 1rem;
            padding: 1rem 1.2rem; margin-bottom: 0.5rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
            text-decoration: none; color: inherit;
        }
        .chapter-item:hover {
            border-color: var(--gold); transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(212,168,83,0.1);
        }
        .chapter-num {
            font-size: 0.8rem; font-weight: 800; color: var(--gold);
            background: rgba(212,168,83,0.1); padding: 4px 10px;
            border-radius: 6px; min-width: 50px; text-align: center;
        }
        .chapter-info { flex: 1; }
        .chapter-title { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
        .chapter-meta { font-size: 0.8rem; color: var(--text-secondary); }
        .chapter-new {
            font-size: 0.7rem; font-weight: 700; color: var(--accent);
            background: rgba(192,57,43,0.1); padding: 2px 8px;
            border-radius: 4px;
        }

        /* Chapter reader */
        .reader {
            max-width: 720px; margin: 0 auto; padding: 2rem;
            display: none;
        }
        .reader.show { display: block; }
        .reader-back {
            color: var(--accent); text-decoration: none; font-size: 0.9rem;
            margin-bottom: 2rem; display: inline-block; cursor: pointer;
        }
        .reader-back:hover { text-decoration: underline; }
        .reader-header {
            margin-bottom: 2rem; text-align: center;
        }
        .reader-header .ch-num {
            font-size: 0.85rem; color: var(--gold); font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .reader-header h1 {
            font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem;
        }
        .reader-header .ch-meta {
            font-size: 0.8rem; color: var(--text-secondary);
        }

        /* TTS controls */
        .tts-bar {
            display: flex; align-items: center; gap: 12px;
            justify-content: center; margin-bottom: 2rem;
            padding: 12px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 12px;
        }
        .tts-btn {
            background: rgba(212,168,83,0.15); border: 1px solid rgba(212,168,83,0.3);
            color: var(--gold); padding: 8px 20px; border-radius: 8px;
            cursor: pointer; font-size: 0.9rem; font-weight: 600;
            transition: all 0.2s; font-family: inherit;
        }
        .tts-btn:hover { background: rgba(212,168,83,0.25); transform: translateY(-1px); }
        .tts-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .tts-speed {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.8rem; color: var(--text-secondary);
        }
        .tts-speed input {
            width: 60px; accent-color: var(--gold);
        }

        /* Content */
        .reader-content {
            font-size: 1.15rem; line-height: 2.2;
        }
        .reader-content p {
            text-indent: 2em; margin-bottom: 1.2rem;
        }
        .reader-content .poem {
            text-indent: 0; text-align: center;
            color: var(--gold); font-style: italic;
            margin: 1.5rem 0; padding: 1rem;
            border-left: 2px solid var(--gold);
            background: rgba(212,168,83,0.03);
        }

        /* Navigation */
        .reader-nav {
            display: flex; justify-content: space-between;
            margin-top: 3rem; padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        .reader-nav a, .reader-nav span {
            color: var(--accent); text-decoration: none;
            font-size: 0.9rem; cursor: pointer;
            padding: 8px 16px; border-radius: 8px;
            transition: all 0.2s;
        }
        .reader-nav a:hover, .reader-nav span:hover {
            background: rgba(192,57,43,0.1);
        }
        .reader-nav .disabled {
            color: var(--text-secondary); cursor: default; opacity: 0.4;
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border); padding: 2rem 0;
            text-align: center; color: var(--text-secondary); font-size: 0.8rem;
            max-width: 800px; margin: 2rem auto 0;
        }
        .footer a { color: var(--accent); text-decoration: none; }

        @media (max-width: 640px) {
            .novel-hero h1 { font-size: 1.6rem; }
            .chapter-item { padding: 0.8rem; }
            .reader { padding: 1.5rem 1rem; }
            .reader-content { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">Tyler<span>.</span></a>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/blog/">博客</a>
                <a href="/novel/">连载</a>
            </nav>
        </div>
    </header>

    <!-- 目录页 -->
    <main id="catalog">
        <div class="novel-hero">
            <div class="sword">⚔️</div>
            <h1>沧海剑歌</h1>
            <div class="subtitle">「天地为炉，万物为铜，沧海一粟，剑歌长鸣」</div>
            <div class="author">🐟 小鱼儿 · AI 原创武侠连载</div>
        </div>

        <div class="novel-stats">
            <div class="novel-stat">
                <div class="num" id="total-chapters">0</div>
                <div class="label">已更新章节</div>
            </div>
            <div class="novel-stat">
                <div class="num" id="total-words">0</div>
                <div class="label">总字数（万）</div>
            </div>
            <div class="novel-stat">
                <div class="num" id="today-date">-</div>
                <div class="label">最新更新</div>
            </div>
        </div>

        <div class="chapter-list">
            <h2>📜 章节目录</h2>
            <div id="chapter-list"></div>
        </div>
    </main>

    <!-- 阅读页 -->
    <main class="reader" id="reader">
        <a class="reader-back" onclick="showCatalog()">← 返回目录</a>
        <div class="reader-header">
            <div class="ch-num" id="reader-ch-num"></div>
            <h1 id="reader-title"></h1>
            <div class="ch-meta" id="reader-meta"></div>
        </div>
        <div class="tts-bar">
            <button class="tts-btn" id="tts-btn" onclick="toggleTTS()">🔊 朗读本章</button>
            <div class="tts-speed">
                语速：
                <input type="range" id="tts-rate" min="0.5" max="2" step="0.1" value="1.2">
                <span id="tts-rate-label">1.2x</span>
            </div>
        </div>
        <div class="reader-content" id="reader-content"></div>
        <div class="reader-nav">
            <span id="prev-ch" onclick="goChapter(-1)">← 上一章</span>
            <span id="next-ch" onclick="goChapter(1)">下一章 →</span>
        </div>
    </main>

    <footer class="footer">
        <p>Powered by <a href="https://www.tylerzhang.xyz">Tyler</a> & <a href="https://openclaw.ai">OpenClaw</a> · AI 原创武侠连载</p>
    </footer>

    <script src="/fish-ai.js?v=20260501"></script>
    <script>
    // 小说数据
    let chapters = [];
    let currentIdx = -1;

    // 加载章节目录
    async function loadChapters() {
        try {
            const res = await fetch('/novel/chapters.json');
            if (res.ok) {
                chapters = await res.json();
            }
        } catch {}

        // 如果没有章节数据，显示示例
        if (chapters.length === 0) {
            chapters = [
                { id: 1, title: '第一章 沧海孤舟', date: '2026-05-01', words: 2100, file: 'chapter-001.html' },
            ];
        }

        renderCatalog();
    }

    function renderCatalog() {
        const list = document.getElementById('chapter-list');
        const total = chapters.length;
        const totalWords = (chapters.reduce((s, c) => s + (c.words || 0), 0) / 10000).toFixed(1);
        const latest = chapters[chapters.length - 1];

        document.getElementById('total-chapters').textContent = total;
        document.getElementById('total-words').textContent = totalWords;
        document.getElementById('today-date').textContent = latest ? latest.date : '-';

        list.innerHTML = chapters.map((ch, i) => `
            <a class="chapter-item" onclick="readChapter(${i})">
                <span class="chapter-num">第${ch.id}章</span>
                <div class="chapter-info">
                    <div class="chapter-title">${ch.title.replace(/^第[一二三四五六七八九十百千]+章\s*/, '')}</div>
                    <div class="chapter-meta">${ch.date} · ${ch.words || 0} 字</div>
                </div>
                ${i === chapters.length - 1 ? '<span class="chapter-new">最新</span>' : ''}
            </a>
        `).reverse().join('');
    }

    async function readChapter(idx) {
        if (idx < 0 || idx >= chapters.length) return;
        currentIdx = idx;
        const ch = chapters[idx];

        document.getElementById('catalog').style.display = 'none';
        document.getElementById('reader').classList.add('show');
        document.getElementById('reader-ch-num').textContent = `第${ch.id}章`;
        document.getElementById('reader-title').textContent = ch.title.replace(/^第[一二三四五六七八九十百千]+章\s*/, '');
        document.getElementById('reader-meta').textContent = `${ch.date} · ${ch.words || 0} 字`;

        // 加载章节内容
        try {
            const res = await fetch(`/novel/chapters/${ch.file}`);
            if (res.ok) {
                document.getElementById('reader-content').innerHTML = await res.text();
            } else {
                document.getElementById('reader-content').innerHTML = '<p style="text-align:center;color:#888;">章节内容加载中...</p>';
            }
        } catch {
            document.getElementById('reader-content').innerHTML = '<p style="text-align:center;color:#888;">章节内容加载失败</p>';
        }

        // 导航按钮
        document.getElementById('prev-ch').className = idx === 0 ? 'disabled' : '';
        document.getElementById('next-ch').className = idx === chapters.length - 1 ? 'disabled' : '';
        document.getElementById('next-ch').textContent = idx === chapters.length - 1 ? '未完待续...' : '下一章 →';

        window.scrollTo(0, 0);
        stopTTS();
    }

    function showCatalog() {
        document.getElementById('catalog').style.display = 'block';
        document.getElementById('reader').classList.remove('show');
        stopTTS();
    }

    function goChapter(dir) {
        const newIdx = currentIdx + dir;
        if (newIdx >= 0 && newIdx < chapters.length) {
            readChapter(newIdx);
        }
    }

    // TTS 朗读（流式分段 + 激进预加载，无缝衔接）
    let ttsChunks = [];
    let ttsCache = new Map();
    let ttsIdx = 0;
    let ttsPlaying = false;
    let ttsAborted = false;
    const PRELOAD_AHEAD = 3; // 提前预加载3段

    async function toggleTTS() {
        if (ttsPlaying) { stopTTS(); } else { await startTTS(); }
    }

    function splitForTTS(text) {
        const chunks = [];
        for (const para of text.split(/\n+/)) {
            if (!para.trim()) continue;
            if (para.length <= 100) { chunks.push(para.trim()); continue; }
            const sents = para.match(/[^。！？.!?,，；;]+[。！？.!?,，；;]?/g) || [para];
            let buf = '';
            for (const s of sents) {
                if (buf.length + s.length > 100 && buf.length) { chunks.push(buf.trim()); buf = s; }
                else buf += s;
            }
            if (buf.trim()) chunks.push(buf.trim());
        }
        // 合并过短段（<50字合并）
        const merged = [];
        for (const c of chunks) {
            if (merged.length && merged[merged.length-1].length + c.length < 60)
                merged[merged.length-1] += c;
            else merged.push(c);
        }
        return merged.filter(c => c.length > 0);
    }

    async function startTTS() {
        const btn = document.getElementById('tts-btn');
        const content = document.getElementById('reader-content').textContent;
        if (!content.trim()) return;

        ttsAborted = false;
        ttsChunks = splitForTTS(content);
        ttsCache.clear();
        ttsIdx = 0;
        ttsPlaying = true;

        btn.textContent = '⏳ 准备中...';
        btn.disabled = true;

        // 生成第一段（必须等）
        const first = await genTTSChunk(ttsChunks[0]);
        if (!first || ttsAborted) return;
        ttsCache.set(0, first);

        // 后台并行预加载后续段（不等待）
        for (let i = 1; i <= PRELOAD_AHEAD && i < ttsChunks.length; i++) {
            preloadOne(i);
        }

        // 立即播放第一段
        playTTSChunk(0);
    }

    // 后台预加载单个chunk（fire-and-forget）
    async function preloadOne(idx) {
        if (idx >= ttsChunks.length || ttsAborted || ttsCache.has(idx)) return;
        try {
            const a = await genTTSChunk(ttsChunks[idx]);
            if (a && !ttsAborted) ttsCache.set(idx, a);
        } catch {}
    }

    // 保持预加载队列：确保当前播放idx之后有N段已缓存
    function ensurePreload(currentIdx) {
        for (let i = 1; i <= PRELOAD_AHEAD; i++) {
            preloadOne(currentIdx + i);
        }
    }

    async function playTTSChunk(idx) {
        if (idx >= ttsChunks.length || ttsAborted) { stopTTS(); return; }
        ttsIdx = idx;
        const btn = document.getElementById('tts-btn');
        btn.textContent = `⏸️ 停止 (${idx+1}/${ttsChunks.length})`;
        btn.disabled = false;

        let audio = ttsCache.get(idx);

        if (!audio) {
            // 还没缓存好，等一下（最多2秒）
            btn.textContent = `⏳ 加载中 (${idx+1}/${ttsChunks.length})`;
            for (let w = 0; w < 20; w++) {
                if (ttsAborted) return;
                audio = ttsCache.get(idx);
                if (audio) break;
                await new Promise(r => setTimeout(r, 100));
            }
            if (!audio) {
                // 还是没有，现场生成
                audio = await genTTSChunk(ttsChunks[idx]);
                if (!audio || ttsAborted) return;
                ttsCache.set(idx, audio);
            }
        }
        if (ttsAborted) return;

        // 播放当前段
        audio.onended = () => {
            // 播完立即播下一段，同时确保更后面的段在预加载
            ensurePreload(idx + 1);
            playTTSChunk(idx + 1);
        };
        audio.onerror = () => playTTSChunk(idx + 1);

        try { await audio.play(); } catch { playTTSChunk(idx + 1); }

        // 播放开始后，确保后续段在预加载
        ensurePreload(idx + 1);
    }

    async function genTTSChunk(text) {
        try {
            const rate = parseFloat(document.getElementById('tts-rate').value);
            const res = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, speed: rate }),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const blob = await res.blob();
            if (blob.size < 100) throw new Error('empty');
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.preload = 'auto';
            await new Promise(r => { audio.addEventListener('canplaythrough', r, { once: true }); audio.addEventListener('error', r, { once: true }); setTimeout(r, 3000); });
            return audio;
        } catch (e) {
            console.warn('[Novel TTS] chunk failed:', e.message);
            // 浏览器 TTS 兜底
            return browserTTSChunk(text);
        }
    }

    function browserTTSChunk(text) {
        if (!('speechSynthesis' in window)) return null;
        const rate = parseFloat(document.getElementById('tts-rate').value);
        return {
            play() {
                return new Promise(resolve => {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'zh-CN'; u.rate = rate;
                    u.onend = () => resolve();
                    u.onerror = () => resolve();
                    setTimeout(() => window.speechSynthesis.speak(u), 50);
                });
            },
            onended: null, onerror: null,
        };
    }

    async function preloadTTS(from) {
        // 保留兼容，实际用 ensurePreload
        for (let i = 0; i < PRELOAD_AHEAD; i++) {
            preloadOne(from + i);
        }
    }

    function stopTTS() {
        ttsAborted = true;
        ttsPlaying = false;
        for (const [, a] of ttsCache) { try { a.pause(); a.currentTime = 0; } catch {} }
        for (const [, a] of ttsCache) { try { if (a.src?.startsWith('blob:')) URL.revokeObjectURL(a.src); } catch {} }
        ttsCache.clear();
        ttsChunks = [];
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        document.getElementById('tts-btn').textContent = '🔊 朗读本章';
        document.getElementById('tts-btn').disabled = false;
    }

    // 语速显示
    document.getElementById('tts-rate').addEventListener('input', (e) => {
        document.getElementById('tts-rate-label').textContent = e.target.value + 'x';
    });

    // 初始化
    loadChapters();
    </script>
</body>
</html>
