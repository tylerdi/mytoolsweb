          desc: '文字生图，创意无限',
          concepts: [
            { name:'Prompt 描述', level:'must', desc:'用文字描述你想要的画面。', analogy:'像给画师下需求单：越详细，画出来越接近你想要的。', usage:'「一个女孩在樱花树下看书，水彩风格，暖色调」' },
            { name:'风格控制', level:'must', desc:'指定画风：写实、动漫、油画、赛博朋克等。', analogy:'像选择滤镜：同一张照片，不同滤镜效果完全不同。', usage:'「用赛博朋克风格」或「水墨画风格」' },
            { name:'比例与构图', level:'should', desc:'选择图片尺寸和构图方式。', analogy:'像选相框：横版、竖版、方形各有用途。', usage:'手机壁纸用竖版，公众号头图用横版。' },
          ],
          quiz: [
            { q:'生成 AI 图片时，Prompt 应该？', options:['越短越好','描述画面内容、风格、色调等细节','只说「画一张图」','不需要描述'], answer:1, explain:'详细的 Prompt 能生成更精确的图像。' },
          ],
          tool: '/ai-image',
          toolName: '用 AI 画图工具实践',
        },
        {
          title: 'AI 视频配音',
          desc: '文字转语音，有声内容制作',
          concepts: [
            { name:'TTS 语音合成', level:'must', desc:'把文字变成自然语音。', analogy:'像请了一个播音员，你说什么它读什么。', usage:'为视频配音、做有声读物、播客。' },
            { name:'语速语调', level:'should', desc:'调整语音的速度和情感。', analogy:'像调节音乐播放器的速度和音效。', usage:'讲故事用慢速有感情，新闻播报用正常速度。' },
            { name:'多角色配音', level:'nice', desc:'不同角色用不同声音。', analogy:'像广播剧：旁白、主角、配角各有声音。', usage:'制作有声故事、广播剧。' },
          ],
          quiz: [
            { q:'想为视频配音，第一步是？', options:['直接录音','准备好文案脚本','找人帮忙','买设备'], answer:1, explain:'TTS 需要文字输入，先准备好文案是第一步。' },
          ],
          tool: '/ai-tts',
          toolName: '用 AI 语音工具试试',
        },
        {
          title: '内容工作流',
          desc: '打造你的 AI 内容生产线',
          concepts: [
            { name:'模板化', level:'must', desc:'把常用 Prompt 做成模板。', analogy:'像厨师的菜谱卡，每次做菜照着来。', usage:'固定文章结构、风格、长度的 Prompt 模板。' },
            { name:'批处理', level:'should', desc:'一次处理多条内容。', analogy:'像工厂流水线，批量生产。', usage:'批量生成社交媒体帖子、产品描述。' },
            { name:'质量检查', level:'must', desc:'AI 生成的内容必须人工审核。', analogy:'像质检员：出厂前必须检查。', usage:'检查事实准确性、品牌调性、错别字。' },
          ],
          quiz: [
            { q:'用 AI 批量生成内容后，最重要的一步是？', options:['直接发布','人工审核质量','不需要检查','删掉重来'], answer:1, explain:'AI 生成的内容必须经过人工审核，确保质量和准确性。' },
          ],
          tool: '/ai-tools',
          toolName: '探索更多 AI 工具',
        },
      ],
      developer: [
        {
          title: 'AI 辅助编程',
          desc: 'Copilot 级别的开发体验',
          concepts: [
            { name:'代码生成', level:'must', desc:'用自然语言描述需求，AI 生成代码。', analogy:'像结对编程伙伴，你说逻辑它写代码。', usage:'「用 Python 写一个读取 CSV 并按列排序的脚本」' },
            { name:'代码解释', level:'must', desc:'让 AI 解释复杂代码。', analogy:'像老员工给新人 code review 讲解。', usage:'「解释一下这段正则表达式在匹配什么」' },
            { name:'Debug 辅助', level:'should', desc:'把错误信息发给 AI，让它帮你找 Bug。', analogy:'像请了一个经验丰富的调试专家。', usage:'贴上报错信息和相关代码，让 AI 分析原因。' },
          ],
          quiz: [
            { q:'AI 生成的代码，你应该？', options:['直接用到生产环境','先理解逻辑，测试后再用','不需要看，直接复制','问 AI 为什么要这样写'], answer:1, explain:'AI 代码需要理解、审查、测试后才能使用。' },
          ],
          tool: '/ai-chat',
          toolName: '用 AI 聊天辅助编程',
        },
        {
          title: 'Prompt 工程进阶',
          desc: '写出专业级 Prompt',
          concepts: [
            { name:'结构化 Prompt', level:'must', desc:'用固定格式组织复杂指令。', analogy:'像写需求文档：背景、目标、约束、输出格式。', usage:'角色 + 任务 + 约束 + 格式 + 示例' },
            { name:'Chain-of-Thought', level:'must', desc:'让 AI 分步骤推理。', analogy:'像数学证明题，一步步推导。', usage:'「请一步一步分析，先列出已知条件...」' },
            { name:'元提示', level:'nice', desc:'让 AI 帮你优化 Prompt。', analogy:'像让老师帮你改作文指导。', usage:'「帮我优化以下 Prompt，使其更清晰具体：[原始 Prompt]」' },
          ],
          quiz: [
            { q:'Chain-of-Thought 的核心思想是？', options:['让 AI 更快回答','让 AI 分步骤推理','让 AI 回答更短','让 AI 不思考'], answer:1, explain:'CoT 通过引导 AI 展示推理过程，提高复杂问题的回答质量。' },
          ],
          tool: '/ai-chat',
          toolName: '练习结构化 Prompt',
        },
        {
          title: 'RAG 与知识库',
          desc: '让 AI 学习你的私有数据',
          concepts: [
            { name:'RAG 原理', level:'must', desc:'检索增强生成：先检索相关文档，再让 AI 基于文档回答。', analogy:'像开卷考试：AI 先翻书找答案，再组织语言回答。', usage:'让 AI 基于你的产品文档回答客户问题。' },
            { name:'向量数据库', level:'should', desc:'存储文本的语义向量，用于相似度检索。', analogy:'像图书管理员，按内容主题（而非书名）找书。', usage:'Pinecone、Milvus、Supabase pgvector。' },
            { name:'Embedding', level:'should', desc:'把文本转换成数字向量。', analogy:'像把文字翻译成计算机能理解的「数字语言」。', usage:'用于语义搜索、相似文本匹配。' },
          ],
          quiz: [
            { q:'RAG 的核心思路是？', options:['让 AI 背诵所有知识','先检索相关文档，再让 AI 基于文档回答','让 AI 记住所有对话','不需要外部数据'], answer:1, explain:'RAG 通过检索外部知识来增强 AI 的回答，特别适合私有数据场景。' },
          ],
          tool: null,
        },
        {
          title: 'Agent 开发实战',
          desc: '构建你的 AI 助手',
          concepts: [
            { name:'Agent 架构', level:'must', desc:'感知→规划→执行→反馈的循环。', analogy:'像自动驾驶：感知环境→规划路线→执行操作→反馈调整。', usage:'构建能自动处理工单、回复邮件的 Agent。' },
            { name:'Function Calling', level:'must', desc:'让 AI 调用你定义的函数。', analogy:'像给 AI 装上了手和脚，它能真正「做事」。', usage:'AI 调用天气 API、数据库查询、发邮件。' },
            { name:'Multi-Agent', level:'nice', desc:'多个 Agent 协作完成复杂任务。', analogy:'像一个团队：PM、设计师、开发者各司其职。', usage:'调研 Agent + 写作 Agent + 审核 Agent 协作产出报告。' },
          ],
          quiz: [
            { q:'Agent 的核心循环是？', options:['输入→输出','感知→规划→执行→反馈','搜索→回答','训练→部署'], answer:1, explain:'Agent 通过感知环境、规划行动、执行任务、接收反馈来完成目标。' },
          ],
          tool: null,
        },
      ],
    };

    // ============ 渲染逻辑 ============
    let currentPath = 'beginner';
    let completed = JSON.parse(localStorage.getItem('ai-learn-progress') || '{}');

    function saveProgress() {
      localStorage.setItem('ai-learn-progress', JSON.stringify(completed));
    }

    function updateProgress() {
      const path = PATHS[currentPath];
      const done = path.filter((_, i) => completed[`${currentPath}-${i}`]).length;
      const pct = Math.round(done / path.length * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = `已完成 ${done} / ${path.length} 站`;
    }

    function renderStations() {
      const container = document.getElementById('stations');
      const path = PATHS[currentPath];
      container.innerHTML = path.map((s, i) => {
        const isOpen = i === 0;
        const isDone = completed[`${currentPath}-${i}`];
        return `
        <div class="station ${isOpen ? 'open' : ''}" id="station-${i}">
          <div class="station-header" onclick="toggleStation(${i})">
            <div class="station-num ${isDone ? 'done' : ''}">${isDone ? '✓' : String(i+1).padStart(2,'0')}</div>
            <div class="station-info">
              <h3>${s.title}</h3>
              <p>${s.desc}</p>
            </div>
            <div class="station-check ${isDone ? 'checked' : ''}" onclick="event.stopPropagation();toggleDone(${i})" title="标记完成">✓</div>
            <div class="station-toggle">▼</div>
          </div>
          <div class="station-body">
            <div class="concept-grid">
              ${s.concepts.map(c => `
                <div class="concept-card">
                  <span class="level level-${c.level}">${c.level === 'must' ? '核心' : c.level === 'should' ? '重要' : '进阶'}</span>
                  <h4>${c.name}</h4>
                  <p style="font-size:.85rem;margin:.3rem 0">${c.desc}</p>
                  <div class="analogy">${c.analogy}</div>
                  <div class="usage">${c.usage}</div>
                </div>
              `).join('')}
            </div>

            ${s.tool ? `<a href="${s.tool}" class="tool-link" target="_blank">🔗 ${s.toolName || '打开工具'}</a>` : ''}

            ${s.quiz.length ? `
            <div class="quiz" id="quiz-${i}">
              <h4>🧠 小测验</h4>
              ${s.quiz.map((q, qi) => `
                <div class="quiz-item" data-qi="${qi}">
                  <p style="font-size:.9rem;margin-bottom:.5rem">${q.q}</p>
                  ${q.options.map((o, oi) => `
                    <button class="quiz-option" onclick="checkQuiz(${i},${qi},${oi})">${o}</button>
                  `).join('')}
                  <div class="quiz-feedback" id="feedback-${i}-${qi}"></div>
                </div>
              `).join('')}
            </div>` : ''}
          </div>
        </div>`;
      }).join('');
      updateProgress();
    }

    function toggleStation(i) {
      document.getElementById('station-' + i).classList.toggle('open');
    }

    function toggleDone(i) {
      const key = `${currentPath}-${i}`;
      completed[key] = !completed[key];
      saveProgress();
      renderStations();
    }

    function checkQuiz(stationIdx, questionIdx, optionIdx) {
      const q = PATHS[currentPath][stationIdx].quiz[questionIdx];
      const item = document.querySelector(`#quiz-${stationIdx} .quiz-item[data-qi="${questionIdx}"]`);
      const btns = item.querySelectorAll('.quiz-option');
      const fb = document.getElementById(`feedback-${stationIdx}-${questionIdx}`);

      btns.forEach((b, idx) => {
        b.disabled = true;
        if (idx === q.answer) b.classList.add('correct');
        else if (idx === optionIdx && idx !== q.answer) b.classList.add('wrong');
      });

      fb.style.display = 'block';
      if (optionIdx === q.answer) {
        fb.innerHTML = `<span style="color:#10b981">✅ 正确！</span> ${q.explain}`;
      } else {
        fb.innerHTML = `<span style="color:#ef4444">❌ 不对。</span> ${q.explain}`;
      }
    }

    // 路径切换
    document.querySelectorAll('.path-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.path-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentPath = tab.dataset.path;
        renderStations();
      });
    });

    renderStations();
    </script>
