<head>

    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v2">
    <style>
        .news-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;transition:all .3s}
        .news-card:hover{border-color:var(--accent);box-shadow:0 4px 20px var(--accent-glow)}
        .news-card h3{font-size:1.1rem;margin-bottom:8px;line-height:1.4}
        .news-card h3 a{color:var(--text)}
        .news-card h3 a:hover{color:var(--accent)}
        .news-meta{display:flex;align-items:center;gap:12px;font-size:.8rem;color:var(--text-dim)}
        .source-tag{padding:2px 8px;background:rgba(100,108,255,.1);border-radius:4px;font-size:.75rem}
        .hot-tag{color:#ff6b9d}
        .summary{color:var(--text-dim);font-size:.9rem;margin-top:8px;line-height:1.6}
        .importance{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
        .importance-5{background:#ff4444}
        .importance-4{background:#ff8800}
        .importance-3{background:#ffcc00}
        .importance-2{background:#44bb44}
        .importance-1{background:#4488ff}
        .loading{text-align:center;padding:40px;color:var(--text-dim)}
        .loading .spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-right:8px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
        .empty .emoji{font-size:3rem;margin-bottom:16px}
        .refresh-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:.85rem;cursor:pointer;transition:all .2s;margin-top:16px}
        .refresh-btn:hover{transform:scale(1.05)}
        .refresh-btn:disabled{opacity:.5;cursor:not-allowed}
        .category-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
        .category-tab{padding:6px 14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:.8rem;color:var(--text-dim);cursor:pointer;transition:all .2s}
        .category-tab.active{background:var(--accent);color:white;border-color:var(--accent)}
        .category-tab:hover{border-color:var(--accent)}
        .back-home{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:.85rem;margin-bottom:20px}
        .back-home:hover{color:var(--accent);text-decoration:none}
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-home">← 返回首页</a>

        <div class="header">
            <h1>📰 每日新闻简报</h1>
            <p>AI 智能整理，一文掌握今日全网热点</p>
            <div class="date-badge" id="currentDate"></div>
        </div>

        <div class="category-tabs">
            <div class="category-tab active" data-cat="all">全部</div>
            <div class="category-tab" data-cat="微博">微博</div>
            <div class="category-tab" data-cat="知乎">知乎</div>
            <div class="category-tab" data-cat="百度">百度</div>
            <div class="category-tab" data-cat="科技">科技</div>
            <div class="category-tab" data-cat="财经">财经</div>
        </div>

        <div id="newsContainer">
            <div class="loading">
                <span class="spinner"></span>
                正在加载今日新闻...
            </div>
        </div>

        <div style="text-align:center">
            <button class="refresh-btn" id="refreshBtn">🔄 刷新新闻</button>
        </div>
    </div>

    <script>
        // 设置当前日期
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);

        let allNews = [];
        let currentCategory = 'all';
        const loadingHtml = '<div class="empty"><div class="emoji">⏳</div><p>正在获取最新新闻...</p></div>';
        document.getElementById('newsContainer').innerHTML = loadingHtml;

        // 渲染新闻列表
        function renderNews(newsList) {
            const container = document.getElementById('newsContainer');

            if (newsList.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="emoji">📭</div>
                        <p>暂无相关新闻</p>
                    </div>
                `;
                return;
            }

            // 按重要性排序
            const sorted = [...newsList].sort((a, b) => b.importance - a.importance);

            container.innerHTML = sorted.map((news, index) => `
                <div class="news-card" style="animation: fadeIn 0.3s ease ${index * 0.05}s both">
                    <h3>
                        <span class="importance importance-${news.importance}"></span>
                        <a href="${news.url}" target="_blank">${news.title}</a>
                    </h3>
                    <div class="summary">${news.summary}</div>
                    <div class="news-meta">
                        <span class="source-tag">${news.source || news.category}</span>
                        ${news.hot ? `<span class="hot-tag">🔥 ${news.hot}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 分类筛选
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.cat;

                if (currentCategory === 'all') {
                    renderNews(allNews);
                } else {
                    const filtered = allNews.filter(n => n.category === currentCategory);
                    renderNews(filtered);
                }
            });
        });

        // 刷新按钮
        document.getElementById('refreshBtn').addEventListener('click', async () => {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 正在获取...';

            try {
                const response = await fetch('/api/daily-news');

                if (response.ok) {
                    const data = await response.json();
                    if (data.news && data.news.length > 0) {
                        allNews = data.news;
                        renderNews(allNews);
                        document.getElementById('loadingSpinner') && (document.getElementById('loadingSpinner').style.display='none');
                    }
                }
            } catch (e) {
                console.error('Fetch failed:', e);
            }

            btn.disabled = false;
            btn.textContent = '🔄 刷新新闻';
        });

        // 初始渲染（显示加载状态）
        renderNews(allNews);

        // 自动获取新闻
        (async () => {
            try {
                const response = await fetch('/api/daily-news');
                if (response.ok) {
                    const data = await response.json();
                    if (data.news && data.news.length > 0) {
                        allNews = data.news;
                        renderNews(allNews);
                    }
                }
            } catch (e) {
                console.error('Auto-load failed:', e);
            }
        })();

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = '@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}';
        document.head.appendChild(style);
    </script>
<script src="/fish-tracker.js"></script>
    <script src="/nav.js?v2"></script>
</body>
</html>
