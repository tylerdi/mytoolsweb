<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇测试</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: Arial; }
        #game { display: inline-block; border: 2px solid #ff2a6d; }
        .row { display: flex; }
        .cell { width: 20px; height: 20px; border: 1px solid #333; }
        .snake { background: #05d9e8; }
        .food { background: #ff2a6d; border-radius: 50%; }
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; margin: 5px; background: #ff2a6d; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>贪吃蛇测试</h1>
    <div id="game"></div>
    <div class="score">得分: <span id="score">0</span></div>
    <div class="controls">
        <button onclick="changeDirection('up')">↑</button><br>
        <button onclick="changeDirection('left')">←</button>
        <button onclick="changeDirection('down')">↓</button>
        <button onclick="changeDirection('right')">→</button>
    </div>

    <script>
        const GRID_SIZE = 20;
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 1, dy = 0;
        let score = 0;
        let gameInterval;

        // 初始化游戏
        function init() {
            const game = document.getElementById('game');
            game.innerHTML = '';
            
            for (let y = 0; y < GRID_SIZE; y++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${x}-${y}`;
                    row.appendChild(cell);
                }
                game.appendChild(row);
            }
            
            draw();
            gameInterval = setInterval(move, 200);
        }

        // 绘制
        function draw() {
            // 清空所有单元格
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('snake', 'food');
            });

            // 绘制蛇
            snake.forEach(segment => {
                document.getElementById(`cell-${segment.x}-${segment.y}`).classList.add('snake');
            });

            // 绘制食物
            document.getElementById(`cell-${food.x}-${food.y}`).classList.add('food');
        }

        // 移动
        function move() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                clearInterval(gameInterval);
                alert(`游戏结束！得分: ${score}`);
                return;
            }

            // 撞自己
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                clearInterval(gameInterval);
                alert(`游戏结束！得分: ${score}`);
                return;
            }

            snake.unshift(head);

            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                // 生成新食物
                do {
                    food = {
                        x: Math.floor(Math.random() * GRID_SIZE),
                        y: Math.floor(Math.random() * GRID_SIZE)
                    };
                } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
            } else {
                snake.pop();
            }

            draw();
        }

        // 改变方向
        function changeDirection(dir) {
            switch(dir) {
                case 'up': if (dy !== 1) { dx = 0; dy = -1; } break;
                case 'down': if (dy !== -1) { dx = 0; dy = 1; } break;
                case 'left': if (dx !== 1) { dx = -1; dy = 0; } break;
                case 'right': if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        }

        // 键盘控制
        document.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': e.preventDefault(); changeDirection('up'); break;
                case 'ArrowDown': e.preventDefault(); changeDirection('down'); break;
                case 'ArrowLeft': e.preventDefault(); changeDirection('left'); break;
                case 'ArrowRight': e.preventDefault(); changeDirection('right'); break;
            }
        });

        // 触屏控制
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        document.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                changeDirection(dx > 0 ? 'right' : 'left');
            } else {
                changeDirection(dy > 0 ? 'down' : 'up');
            }
        });

        // 启动游戏
        window.onload = init;
    </script>
</body>
</html>
