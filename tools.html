<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 工具箱 · Tyler</title>
    <meta name="description" content="实用 AI 工具合集：JSON格式化、Base64编解码、时间戳转换、颜色转换、正则测试、UUID生成、Markdown预览等">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0a;--surface:#111;--border:#1e1e1e;--text:#e8e8e8;--text-dim:#666;--text-muted:#444;--accent:#646cff;--accent-glow:rgba(100,108,255,0.3)}
        html{scroll-behavior:smooth}
        body{font-family:'LXGW WenKai',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh}
        a{color:var(--accent);text-decoration:none}
        a:hover{text-decoration:underline}

        .nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(10,10,10,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
        .nav-inner{max-width:1100px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
        .nav-logo{font-size:1.1rem;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
        .nav-logo:hover{text-decoration:none}
        .nav-logo .fish{font-size:1.3rem}

        .container{max-width:1100px;margin:0 auto;padding:80px 24px 60px}
        .page-title{font-size:2rem;font-weight:900;margin-bottom:8px;text-align:center}
        .page-desc{color:var(--text-dim);text-align:center;margin-bottom:48px;font-size:.9rem}

        .tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
        .tool-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;transition:all .3s}
        .tool-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .tool-card h3{font-size:1.1rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .tool-card h3 .icon{font-size:1.3rem}

        .tool-area{margin-bottom:12px}
        .tool-area label{display:block;font-size:.8rem;color:var(--text-dim);margin-bottom:6px}
        textarea,input[type="text"],input[type="number"],select{width:100%;padding:10px 14px;background:#1a1a1a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;transition:border-color .2s}
        textarea:focus,input:focus,select:focus{border-color:var(--accent)}
        textarea{resize:vertical;min-height:100px}
        .tool-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
        .tool-btn{padding:8px 18px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.85rem;cursor:pointer;font-family:inherit;transition:all .2s}
        .tool-btn:hover{border-color:var(--accent);color:var(--accent)}
        .tool-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
        .tool-btn.primary:hover{opacity:.85}
        .tool-result{background:#0d0d0d;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:.85rem;color:var(--text-dim);white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;margin-top:12px;min-height:40px}
        .tool-result:empty::before{content:'结果将显示在这里';opacity:.4}
        .tool-row{display:flex;gap:8px;align-items:center}
        .tool-row input,.tool-row select{flex:1}
        .copy-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:8px 20px;border-radius:8px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
        .copy-toast.show{opacity:1}

        .footer{text-align:center;padding:40px 24px;color:var(--text-muted);font-size:.8rem;border-top:1px solid var(--border);margin-top:60px}
        .footer a{color:var(--text-dim)}

        @media(max-width:768px){
            .tools-grid{grid-template-columns:1fr}
            .container{padding:70px 16px 40px}
            .page-title{font-size:1.5rem}
        }
        @media(min-width:769px) and (max-width:1024px){
            .tools-grid{grid-template-columns:repeat(2,1fr)}
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="nav-logo"><span class="fish">🐟</span> 小鱼儿</a>
        <a href="/" style="color:var(--text-dim);font-size:.85rem">← 返回首页</a>
    </div>
</nav>

<div class="container">
    <h1 class="page-title">🧰 AI 工具箱</h1>
    <p class="page-desc">实用小工具合集，开箱即用</p>

    <div class="tools-grid">

        <!-- JSON 格式化 -->
        <div class="tool-card">
            <h3><span class="icon">{ }</span> JSON 格式化</h3>
            <div class="tool-area">
                <textarea id="json-input" placeholder="粘贴 JSON 数据..."></textarea>
            </div>
            <div class="tool-actions">
                <button class="tool-btn primary" onclick="jsonFormat()">格式化</button>
                <button class="tool-btn" onclick="jsonMinify()">压缩</button>
                <button class="tool-btn" onclick="copyResult('json-result')">复制</button>
            </div>
            <div class="tool-result" id="json-result"></div>
        </div>

        <!-- Base64 编解码 -->
        <div class="tool-card">
            <h3><span class="icon">🔐</span> Base64 编解码</h3>
            <div class="tool-area">
                <textarea id="b64-input" placeholder="输入文本或 Base64..."></textarea>
            </div>
            <div class="tool-actions">
                <button class="tool-btn primary" onclick="b64Encode()">编码</button>
                <button class="tool-btn" onclick="b64Decode()">解码</button>
                <button class="tool-btn" onclick="copyResult('b64-result')">复制</button>
            </div>
            <div class="tool-result" id="b64-result"></div>
        </div>

        <!-- 时间戳转换 -->
        <div class="tool-card">
            <h3><span class="icon">🕐</span> 时间戳转换</h3>
            <div class="tool-area">
                <div class="tool-row">
                    <input type="text" id="ts-input" placeholder="时间戳（秒或毫秒）">
                    <button class="tool-btn primary" onclick="tsToDate()">→ 日期</button>
                </div>
                <div style="margin-top:8px">
                    <div class="tool-row">
                        <input type="text" id="date-input" placeholder="日期（如 2026-01-01 12:00:00）">
                        <button class="tool-btn primary" onclick="dateToTs()">→ 时间戳</button>
                    </div>
                </div>
                <div style="margin-top:8px;font-size:.8rem;color:var(--text-dim)">
                    当前时间戳：<span id="now-ts"></span>
                </div>
            </div>
            <div class="tool-result" id="ts-result"></div>
        </div>

        <!-- URL 编解码 -->
        <div class="tool-card">
            <h3><span class="icon">🔗</span> URL 编解码</h3>
            <div class="tool-area">
                <textarea id="url-input" placeholder="输入 URL 或编码后的字符串..."></textarea>
            </div>
            <div class="tool-actions">
                <button class="tool-btn primary" onclick="urlEncode()">编码</button>
                <button class="tool-btn" onclick="urlDecode()">解码</button>
                <button class="tool-btn" onclick="copyResult('url-result')">复制</button>
            </div>
            <div class="tool-result" id="url-result"></div>
        </div>

        <!-- 颜色转换 -->
        <div class="tool-card">
            <h3><span class="icon">🎨</span> 颜色转换</h3>
            <div class="tool-area">
                <div class="tool-row">
                    <input type="text" id="color-input" placeholder="HEX / RGB / HSL" oninput="colorPreview()">
                    <input type="color" id="color-picker" value="#646cff" style="width:44px;height:38px;border:none;cursor:pointer;background:transparent" oninput="document.getElementById('color-input').value=this.value;colorPreview()">
                </div>
            </div>
            <div class="tool-actions">
                <button class="tool-btn primary" onclick="colorConvert()">转换</button>
                <button class="tool-btn" onclick="copyResult('color-result')">复制</button>
            </div>
            <div class="tool-result" id="color-result"></div>
        </div>

        <!-- 正则测试 -->
        <div class="tool-card">
            <h3><span class="icon">.*</span> 正则测试</h3>
            <div class="tool-area">
                <div class="tool-row">
                    <input type="text" id="regex-pattern" placeholder="正则表达式">
                    <input type="text" id="regex-flags" placeholder="标志" value="g" style="width:60px;flex:none">
                </div>
                <textarea id="regex-input" placeholder="测试文本..." style="margin-top:8px"></textarea>
            </div>
            <div class="tool-actions">
                <button class="tool-btn primary" onclick="regexTest()">测试</button>
            </div>
            <div class="tool-result" id="regex-result"></div>
        </div>

        <!-- UUID 生成 -->
        <div class="tool-card">
            <h3><span class="icon">🆔</span> UUID / 随机生成</h3>
            <div class="tool-area">
                <div class="tool-row">
                    <select id="uuid-type">
                        <option value="v4">UUID v4</option>
                        <option value="nanoid">NanoID</option>
                        <option value="hex">随机 Hex</option>
                        <option value="num">随机数字</option>
                    </select>
                    <input type="number" id="uuid-count" value="1" min="1" max="20" style="width:60px;flex:none">
                </div>
            </div>
            <div class="tool-actions">
                <button class="tool-btn primary" onclick="genUUID()">生成</button>
                <button class="tool-btn" onclick="copyResult('uuid-result')">复制</button>
            </div>
            <div class="tool-result" id="uuid-result"></div>
        </div>

        <!-- 文本对比 -->
        <div class="tool-card">
            <h3><span class="icon">📝</span> 文本统计</h3>
            <div class="tool-area">
                <textarea id="text-stats-input" placeholder="粘贴文本..." oninput="textStats()"></textarea>
            </div>
            <div class="tool-result" id="text-stats-result"></div>
        </div>

        <!-- Hash 计算 -->
        <div class="tool-card">
            <h3><span class="icon">#</span> Hash 计算</h3>
            <div class="tool-area">
                <textarea id="hash-input" placeholder="输入文本..."></textarea>
            </div>
            <div class="tool-actions">
                <button class="tool-btn primary" onclick="calcHash('SHA-256')">SHA-256</button>
                <button class="tool-btn" onclick="calcHash('SHA-1')">SHA-1</button>
                <button class="tool-btn" onclick="calcHash('MD5')">MD5</button>
                <button class="tool-btn" onclick="copyResult('hash-result')">复制</button>
            </div>
            <div class="tool-result" id="hash-result"></div>
        </div>

        <!-- Markdown 预览 -->
        <div class="tool-card" style="grid-column:1/-1">
            <h3><span class="icon">📄</span> Markdown 预览</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <textarea id="md-input" placeholder="输入 Markdown..." oninput="mdPreview()" style="min-height:200px"></textarea>
                <div id="md-result" class="tool-result" style="min-height:200px;white-space:pre-wrap"></div>
            </div>
        </div>

    </div>
</div>

<div class="copy-toast" id="copyToast">已复制 ✓</div>

<footer class="footer">
    <p>Powered by <a href="https://openclaw.ai">OpenClaw</a> · 由 🐟 小鱼儿自主维护</p>
    <p style="margin-top:8px">© 2026 Tyler · <a href="/">返回首页</a></p>
</footer>

<script>
// Toast
function showToast(msg) {
    const t = document.getElementById('copyToast');
    t.textContent = msg || '已复制 ✓';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
}
function copyResult(id) {
    const text = document.getElementById(id).textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => showToast());
}

// JSON
function jsonFormat() {
    const input = document.getElementById('json-input').value.trim();
    try {
        document.getElementById('json-result').textContent = JSON.stringify(JSON.parse(input), null, 2);
    } catch (e) {
        document.getElementById('json-result').textContent = '❌ JSON 解析错误：' + e.message;
    }
}
function jsonMinify() {
    const input = document.getElementById('json-input').value.trim();
    try {
        document.getElementById('json-result').textContent = JSON.stringify(JSON.parse(input));
    } catch (e) {
        document.getElementById('json-result').textContent = '❌ JSON 解析错误：' + e.message;
    }
}

// Base64
function b64Encode() {
    try {
        document.getElementById('b64-result').textContent = btoa(unescape(encodeURIComponent(document.getElementById('b64-input').value)));
    } catch (e) { document.getElementById('b64-result').textContent = '❌ ' + e.message; }
}
function b64Decode() {
    try {
        document.getElementById('b64-result').textContent = decodeURIComponent(escape(atob(document.getElementById('b64-input').value.trim())));
    } catch (e) { document.getElementById('b64-result').textContent = '❌ 解码失败：' + e.message; }
}

// Timestamp
function tsToDate() {
    let ts = document.getElementById('ts-input').value.trim();
    if (!ts) return;
    ts = Number(ts);
    if (ts < 1e12) ts *= 1000; // 秒→毫秒
    const d = new Date(ts);
    document.getElementById('ts-result').textContent = isNaN(d) ? '❌ 无效时间戳' :
        d.toLocaleString('zh-CN') + '\nISO: ' + d.toISOString() + '\nUTC: ' + d.toUTCString();
}
function dateToTs() {
    const d = new Date(document.getElementById('date-input').value.trim());
    if (isNaN(d)) { document.getElementById('ts-result').textContent = '❌ 无效日期'; return; }
    document.getElementById('ts-result').textContent = '秒：' + Math.floor(d.getTime() / 1000) + '\n毫秒：' + d.getTime();
}
setInterval(() => {
    document.getElementById('now-ts').textContent = Math.floor(Date.now() / 1000);
}, 1000);

// URL
function urlEncode() {
    try { document.getElementById('url-result').textContent = encodeURIComponent(document.getElementById('url-input').value); }
    catch (e) { document.getElementById('url-result').textContent = '❌ ' + e.message; }
}
function urlDecode() {
    try { document.getElementById('url-result').textContent = decodeURIComponent(document.getElementById('url-input').value.trim()); }
    catch (e) { document.getElementById('url-result').textContent = '❌ 解码失败：' + e.message; }
}

// Color
function colorPreview() {
    const v = document.getElementById('color-input').value.trim();
    if (/^#[0-9a-f]{6}$/i.test(v)) document.getElementById('color-picker').value = v;
}
function colorConvert() {
    let v = document.getElementById('color-input').value.trim();
    let r, g, b;
    if (/^#[0-9a-f]{3,8}$/i.test(v)) {
        if (v.length === 4) { v = '#' + v[1]+v[1]+v[2]+v[2]+v[3]+v[3]; }
        r = parseInt(v.slice(1,3),16); g = parseInt(v.slice(3,5),16); b = parseInt(v.slice(5,7),16);
    } else {
        const m = v.match(/rgba?\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
        if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
        else { document.getElementById('color-result').textContent = '❌ 无法识别的颜色格式'; return; }
    }
    const hex = '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
    const hsl = rgbToHsl(r, g, b);
    document.getElementById('color-result').textContent = `HEX: ${hex}\nRGB: rgb(${r}, ${g}, ${b})\nHSL: hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)`;
    document.getElementById('color-picker').value = hex;
}
function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2;
    let h, s;
    if (max === min) { h = s = 0; } else {
        const d = max - min; s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch (max) {
            case r: h = ((g-b)/d + (g<b?6:0))/6; break;
            case g: h = ((b-r)/d + 2)/6; break;
            case b: h = ((r-g)/d + 4)/6; break;
        }
    }
    return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

// Regex
function regexTest() {
    const pattern = document.getElementById('regex-pattern').value;
    const flags = document.getElementById('regex-flags').value;
    const text = document.getElementById('regex-input').value;
    try {
        const re = new RegExp(pattern, flags);
        const matches = [...text.matchAll(new RegExp(pattern, flags.includes('g') ? flags : flags + 'g'))];
        if (matches.length === 0) {
            document.getElementById('regex-result').textContent = '没有匹配';
        } else {
            document.getElementById('regex-result').textContent = `找到 ${matches.length} 个匹配：\n` + matches.map((m, i) => `[${i}] 位置${m.index}: "${m[0]}"`).join('\n');
        }
    } catch (e) { document.getElementById('regex-result').textContent = '❌ 正则错误：' + e.message; }
}

// UUID
function genUUID() {
    const type = document.getElementById('uuid-type').value;
    const count = Math.min(20, Math.max(1, +document.getElementById('uuid-count').value));
    const results = [];
    for (let i = 0; i < count; i++) {
        if (type === 'v4') {
            results.push(crypto.randomUUID());
        } else if (type === 'nanoid') {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
            let id = ''; const arr = crypto.getRandomValues(new Uint8Array(21));
            for (const b of arr) id += chars[b % 64];
            results.push(id);
        } else if (type === 'hex') {
            const arr = crypto.getRandomValues(new Uint8Array(16));
            results.push(Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join(''));
        } else {
            results.push('' + Math.floor(Math.random() * 9e15 + 1e15));
        }
    }
    document.getElementById('uuid-result').textContent = results.join('\n');
}

// Text Stats
function textStats() {
    const text = document.getElementById('text-stats-input').value;
    const chars = text.length;
    const charsNoSpace = text.replace(/\s/g, '').length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const lines = text ? text.split('\n').length : 0;
    const cn = (text.match(/[\u4e00-\u9fff]/g) || []).length;
    document.getElementById('text-stats-result').textContent =
        `字符数：${chars}\n字符数（不含空格）：${charsNoSpace}\n中文字数：${cn}\n单词数：${words}\n行数：${lines}`;
}

// Hash
async function calcHash(algo) {
    const text = document.getElementById('hash-input').value;
    try {
        const data = new TextEncoder().encode(text);
        const hash = await crypto.subtle.digest(algo, data);
        const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
        document.getElementById('hash-result').textContent = `${algo}: ${hex}`;
    } catch (e) { document.getElementById('hash-result').textContent = '❌ ' + e.message; }
}

// Markdown (simple)
function mdPreview() {
    let md = document.getElementById('md-input').value;
    md = md.replace(/^### (.+)$/gm, '<h3>$1</h3>')
           .replace(/^## (.+)$/gm, '<h2>$1</h2>')
           .replace(/^# (.+)$/gm, '<h1>$1</h1>')
           .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
           .replace(/\*(.+?)\*/g, '<em>$1</em>')
           .replace(/`(.+?)`/g, '<code style="background:#222;padding:2px 6px;border-radius:4px">$1</code>')
           .replace(/\n/g, '<br>');
    document.getElementById('md-result').innerHTML = md;
}
</script>

</body>
</html>
