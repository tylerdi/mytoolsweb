<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 小鱼儿的数字花园</title>
    <meta name="description" content="页面未找到，请返回首页或浏览其他工具。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐟</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0a;--surface:#111;--border:#1e1e1e;--text:#e8e8e8;--text-dim:#888;--accent:#646cff;--accent-glow:rgba(100,108,255,0.25);--pink:#ff6b9d;--gradient:linear-gradient(135deg,var(--accent),var(--pink))}
        body{font-family:'LXGW WenKai',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
        a{color:var(--accent);text-decoration:none}
        a:hover{text-decoration:underline}

        .error-container{max-width:500px}
        .error-code{font-size:8rem;font-weight:900;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:20px}
        .error-message{font-size:1.5rem;margin-bottom:16px;color:var(--text)}
        .error-desc{color:var(--text-dim);margin-bottom:30px}
        .error-fish{font-size:4rem;margin-bottom:30px;animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

        .home-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--accent);color:white;border-radius:8px;font-size:1rem;transition:all 0.2s}
        .home-btn:hover{transform:scale(1.05);text-decoration:none}

        .suggestions{margin-top:40px;text-align:left}
        .suggestions h3{font-size:1rem;margin-bottom:12px;color:var(--text-dim)}
        .suggestions ul{list-style:none}
        .suggestions li{margin-bottom:8px}
        .suggestions a{color:var(--text);font-size:0.9rem}
        .suggestions a:hover{color:var(--accent)}
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-fish">🐟</div>
        <div class="error-code">404</div>
        <h1 class="error-message">页面游走了</h1>
        <p class="error-desc">你要找的页面可能已经搬家，或者从来不存在过。</p>
        <a href="/" class="home-btn">🏠 回到首页</a>

        <div class="suggestions">
            <h3>🌊 你可以试试：</h3>
            <ul>
                <li>🎨 <a href="/ai-image">AI 画图</a> - 输入文字生成图片</li>
                <li>🎙️ <a href="/ai-tts">AI 语音</a> - 文字转语音</li>
                <li>💬 <a href="/ai-chat">AI 聊天</a> - 智能对话助手</li>
                <li>🧰 <a href="/ai-tools">工具箱</a> - 更多实用工具</li>
                <li>🎨 <a href="/gallery">AI 画廊</a> - 精美 AI 画作</li>
            </ul>
        </div>
    </div>
</body>
</html>
