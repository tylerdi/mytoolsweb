<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6426056111301969" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="/style.css">
    <meta name="description" content="AI 工具箱：集合多个实用 AI 小工具，包括文本润色、邮件改写、代码解释、翻译、摘要、扩写等。免费使用，无需注册。">
    <meta name="keywords" content="AI工具箱,文本润色,邮件改写,代码解释,翻译,摘要,AI写作工具,免费AI工具">
    <link rel="canonical" href="https://tylerzhang.xyz/ai-tools">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tylerzhang.xyz/ai-tools">
    <meta property="og:title" content="AI 工具箱 - 多个实用 AI 小工具">
    <meta property="og:description" content="集合多个实用 AI 小工具，免费使用，无需注册。">
    <meta property="og:image" content="https://tylerzhang.xyz/assets/og-tools.png">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        :root{--bg:#0a0a0a;--card:#141414;--border:#222;--text:#e0e0e0;--muted:#888;--accent:#00d4ff;--accent2:#ff6b6b;--accent3:#51cf66;--accent4:#ffd43b}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
        
        /* Navigation */

        .close-btn{float:right;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer}

        @media(max-width:768px){}
        
        /* Main */
        .main{max-width:1200px;margin:0 auto;padding:80px 20px 40px}
        .hero{text-align:center;padding:60px 0 40px}
        .hero h1{font-size:clamp(28px,5vw,48px);font-weight:800;background:linear-gradient(135deg,var(--accent4),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
        .hero p{font-size:18px;color:var(--muted);max-width:600px;margin:0 auto}
        
        /* Tools Grid */
        .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:40px}
        .tool-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;cursor:pointer;transition:all 0.3s}
        .tool-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,212,255,0.1)}
        .tool-card .icon{font-size:32px;margin-bottom:12px}
        .tool-card h3{font-size:18px;margin-bottom:8px}
        .tool-card p{font-size:14px;color:var(--muted);margin-bottom:16px}
        .tool-card .tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;background:var(--bg);color:var(--muted);margin-right:6px}
        .tool-card .tag.hot{background:rgba(255,107,107,0.15);color:var(--accent2)}
        .tool-card .tag.new{background:rgba(0,212,255,0.15);color:var(--accent)}
        
        /* Tool Modal */
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:200;justify-content:center;align-items:center;padding:20px}
        .modal-overlay.show{display:flex}
        .modal{background:var(--card);border-radius:16px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;position:relative}
        .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .modal-header h2{font-size:20px}
        .modal-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer}
        .modal-body{padding:24px}
        .modal-body textarea{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;color:var(--text);font-size:14px;resize:vertical;outline:none;font-family:inherit}
        .modal-body textarea:focus{border-color:var(--accent)}
        .modal-body .options{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
        .modal-body .option-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;cursor:pointer;transition:all 0.2s}
        .modal-body .option-btn:hover{border-color:var(--accent);color:var(--accent)}
        .modal-body .option-btn.active{background:var(--accent);border-color:var(--accent);color:#000}
        .modal-body .run-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),#0099cc);color:#000;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
        .modal-body .result{background:var(--bg);border-radius:8px;padding:16px;margin-top:16px;min-height:100px;white-space:pre-wrap;font-size:14px;line-height:1.8}
        .modal-body .result .copy-btn{float:right;padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
        .modal-body .result .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
        
        /* Stats */
        .stats{text-align:center;margin-top:60px;padding:40px 0;border-top:1px solid var(--border)}
        .stats h2{font-size:24px;margin-bottom:20px}
        .stats-grid{display:flex;justify-content:center;gap:60px;flex-wrap:wrap}
        .stat-item{text-align:center}
        .stat-item .number{font-size:36px;font-weight:800;color:var(--accent)}
        .stat-item .label{font-size:14px;color:var(--muted)}
        
        /* Footer */
        .footer{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:60px}
        .footer a{color:var(--accent);text-decoration:none}
        
        /* Loading */
        .loading{display:none;text-align:center;padding:20px}
        .loading.show{display:block}
        .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 8px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

    <div class="main">
        <div class="hero">
            <h1>🧰 AI 工具箱</h1>
            <p>多个实用 AI 小工具，免费使用，无需注册。每个工具都是独立 SEO 页面。</p>
        </div>

        <div class="tools-grid" id="toolsGrid">
            <!-- Tools will be rendered here -->
        </div>

        <div class="stats">
            <h2>📊 使用统计</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="number">12</div>
                    <div class="label">可用工具</div>
                </div>
                <div class="stat-item">
                    <div class="number">∞</div>
                    <div class="label">免费使用</div>
                </div>
                <div class="stat-item">
                    <div class="number">0</div>
                    <div class="label">需要注册</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tool Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">工具名称</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <textarea id="toolInput" placeholder="在这里输入内容..."></textarea>
                <div class="options" id="toolOptions"></div>
                <button class="run-btn" id="runToolBtn" onclick="runTool()">🚀 开始处理</button>
                <div class="loading" id="toolLoading">
                    <div class="spinner"></div>
                    <p>AI 处理中...</p>
                </div>
                <div class="result" id="toolResult" style="display:none">
                    <button class="copy-btn" onclick="copyResult()">📋 复制</button>
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
    </div>

        <footer class="footer">Powered by <a href="https://openclaw.ai">OpenClaw</a> · 🐟 小鱼儿自主维护 · © 2026 Tyler</footer>
    <script>
        // Tools configuration
        const TOOLS = [
            {
                id: 'polish',
                icon: '✨',
                name: '文本润色',
                desc: '优化文字表达，让文章更专业、更流畅',
                tags: ['热门', '写作'],
                tagClasses: ['hot', ''],
                options: ['专业', '轻松', '正式', '创意'],
                systemPrompt: '你是一个专业的文字编辑。请润色以下文本，使其更专业、更流畅。保持原意，优化表达。'
            },
            {
                id: 'email',
                icon: '📧',
                name: '邮件改写',
                desc: '将你的草稿改写成专业的商务邮件',
                tags: ['热门', '办公'],
                tagClasses: ['hot', ''],
                options: ['正式', '友好', '催促', '感谢'],
                systemPrompt: '你是一个商务邮件写作专家。请将以下内容改写成专业的商务邮件。根据选择的风格调整语气。'
            },
            {
                id: 'explain-code',
                icon: '💻',
                name: '代码解释',
                desc: '用通俗易懂的语言解释代码逻辑',
                tags: ['编程', '学习'],
                tagClasses: ['', ''],
                options: ['初学者', '中级', '高级', '逐行'],
                systemPrompt: '你是一个编程教育专家。请用通俗易懂的语言解释以下代码。根据选择的详细程度调整解释深度。'
            },
            {
                id: 'translate',
                icon: '🌍',
                name: '智能翻译',
                desc: '支持中英日韩等多语言互译',
                tags: ['热门', '语言'],
                tagClasses: ['hot', ''],
                options: ['中→英', '英→中', '中→日', '日→中', '中→韩'],
                systemPrompt: '你是一个专业翻译。请翻译以下文本。根据选择的语言方向进行翻译，保持原文的语气和风格。'
            },
            {
                id: 'summarize',
                icon: '📝',
                name: '文本摘要',
                desc: '提取长文本的核心要点',
                tags: ['效率', '阅读'],
                tagClasses: ['', ''],
                options: ['简短', '详细', '要点列表', '思维导图'],
                systemPrompt: '你是一个信息提取专家。请提取以下文本的核心要点。根据选择的格式输出摘要。'
            },
            {
                id: 'expand',
                icon: '📖',
                name: '内容扩写',
                desc: '将简短内容扩展成完整文章',
                tags: ['写作', '创作'],
                tagClasses: ['', ''],
                options: ['公众号', '论文', '报告', '故事'],
                systemPrompt: '你是一个内容创作专家。请将以下简短内容扩展成完整的文章。根据选择的格式调整风格和长度。'
            },
            {
                id: 'grammar',
                icon: '✅',
                name: '语法检查',
                desc: '检查并修正语法错误',
                tags: ['学习', '写作'],
                tagClasses: ['', ''],
                options: ['中文', '英文', '日文'],
                systemPrompt: '你是一个语法检查专家。请检查以下文本的语法错误，并给出修正建议。标注修改的地方和理由。'
            },
            {
                id: 'title-gen',
                icon: '🎯',
                name: '标题生成',
                desc: '为文章生成吸引眼球的标题',
                tags: ['创作', '营销'],
                tagClasses: ['', ''],
                options: ['公众号', '小红书', 'B站', '知乎'],
                systemPrompt: '你是一个标题创作专家。请根据以下内容生成5个吸引眼球的标题。根据选择的平台调整风格。'
            },
            {
                id: 'simplify',
                icon: '🔄',
                name: '简化表达',
                desc: '将复杂文字简化为通俗易懂的表达',
                tags: ['效率', '沟通'],
                tagClasses: ['', ''],
                options: ['口语化', '儿童版', '老人版', '外行版'],
                systemPrompt: '你是一个沟通专家。请将以下复杂文字简化为通俗易懂的表达。根据选择的目标人群调整难度。'
            },
            {
                id: 'format',
                icon: '📊',
                name: '格式整理',
                desc: '将混乱的文本整理成结构化格式',
                tags: ['效率', '办公'],
                tagClasses: ['', ''],
                options: ['Markdown', '表格', '列表', '大纲'],
                systemPrompt: '你是一个文档整理专家。请将以下混乱的文本整理成结构化的格式。根据选择的格式输出。'
            },
            {
                id: 'roleplay',
                icon: '🎭',
                name: '角色扮演',
                desc: '让 AI 扮演特定角色回答问题',
                tags: ['创意', '学习'],
                tagClasses: ['', ''],
                options: ['面试官', '客户', '老师', '朋友'],
                systemPrompt: '你是一个角色扮演专家。请根据以下设定扮演相应角色。根据选择的角色调整语气和回答方式。'
            },
            {
                id: 'json-gen',
                icon: '🔧',
                name: 'JSON 生成',
                desc: '将自然语言描述转换为 JSON 格式',
                tags: ['编程', '效率'],
                tagClasses: ['', ''],
                options: ['简单', '详细', '带注释', 'TypeScript'],
                systemPrompt: '你是一个数据格式化专家。请将以下自然语言描述转换为 JSON 格式。根据选择的详细程度调整输出。'
            }
        ];

        let currentTool = null;

        // Render tools
        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = TOOLS.map(tool => `
                <div class="tool-card" onclick="openTool('${tool.id}')">
                    <div class="icon">${tool.icon}</div>
                    <h3>${tool.name}</h3>
                    <p>${tool.desc}</p>
                    <div>
                        ${tool.tags.map((tag, i) => `<span class="tag ${tool.tagClasses[i]}">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openTool(toolId) {
            currentTool = TOOLS.find(t => t.id === toolId);
            document.getElementById('modalTitle').textContent = currentTool.icon + ' ' + currentTool.name;
            document.getElementById('toolInput').value = '';
            document.getElementById('toolResult').style.display = 'none';
            document.getElementById('toolLoading').classList.remove('show');

            // Render options
            const optionsDiv = document.getElementById('toolOptions');
            optionsDiv.innerHTML = currentTool.options.map((opt, i) => 
                `<button class="option-btn ${i === 0 ? 'active' : ''}" onclick="selectOption(this)">${opt}</button>`
            ).join('');

            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function selectOption(btn) {
            btn.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function runTool() {
            const input = document.getElementById('toolInput').value.trim();
            if (!input) return;

            const selectedOption = document.querySelector('#toolOptions .option-btn.active')?.textContent || '';
            
            document.getElementById('toolLoading').classList.add('show');
            document.getElementById('toolResult').style.display = 'none';

            try {
                const response = await fetch('https://fufu.iqach.top/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'mimo-v2-flash',
                        messages: [
                            { role: 'system', content: currentTool.systemPrompt + (selectedOption ? ` 风格/模式：${selectedOption}` : '') },
                            { role: 'user', content: input }
                        ],
                        max_tokens: 2000,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    document.getElementById('resultContent').textContent = data.choices[0].message.content;
                    document.getElementById('toolResult').style.display = 'block';
                } else {
                    document.getElementById('resultContent').textContent = '❌ 错误：' + (data.error?.message || '未知错误');
                    document.getElementById('toolResult').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('resultContent').textContent = '❌ 网络错误：' + err.message;
                document.getElementById('toolResult').style.display = 'block';
            }

            document.getElementById('toolLoading').classList.remove('show');
        }

        function copyResult() {
            const text = document.getElementById('resultContent').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ 已复制';
                setTimeout(() => btn.textContent = '📋 复制', 2000);
            });
        }

        // Close modal on overlay click
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // Init
        renderTools();
    </script>
<script src="/fish-tracker.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
