<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感墙 | Ideas Wall</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { 
            color: white; 
            text-align: center; 
            font-size: 2.5em; 
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .ideas-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
        }
        .idea-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .idea-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        .idea-emoji { font-size: 2em; margin-bottom: 12px; }
        .idea-title { font-size: 1.3em; font-weight: 600; margin-bottom: 8px; color: #333; }
        .idea-desc { color: #666; line-height: 1.5; margin-bottom: 12px; }
        .idea-meta { display: flex; justify-content: space-between; align-items: center; }
        .idea-tag { 
            background: #f0f0f0; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.85em; 
            color: #555;
        }
        .idea-date { color: #999; font-size: 0.85em; }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💡 灵感墙</h1>
        <div class="ideas-grid">
        </div>
        <p class="footer">✨ 每日灵感，点亮思维</p>
    </div>
    
    <script>

            { emoji: "📱", title: "数字断舍离", desc: "AI分析手机使用习惯，建议删除哪些App", tag: "生活", date: "2026-07-15" },
            { emoji: "🎵", title: "情绪BGM", desc: "根据你的心情自动生成背景音乐", tag: "AI", date: "2026-07-15" },
            { emoji: "🧊", title: "时间冰块", desc: "把任务冻结成冰块，融化时提醒你去做", tag: "效率", date: "2026-07-15" },
            { emoji: "🧬", title: "代码基因图谱", desc: "把项目代码可视化成DNA双螺旋，一眼看出架构健壮度", tag: "AI", date: "2026-07-14" },
            { emoji: "🧹", title: "懒人整理术", desc: "拍一张乱房间照片，AI生成三步归位指南，按步执行不崩溃", tag: "生活", date: "2026-07-14" },
            { emoji: "🎧", title: "声音胶囊", desc: "把一段话录成音波胶囊，未来某天随机触发播放给你听", tag: "技术", date: "2026-07-14" },
            { emoji: "🎨", title: "反向设计工具", desc: "上传照片自动逆向工程出Figma源文件", tag: "设计", date: "2026-07-13" },
            { emoji: "☕", title: "咖啡续命计算器", desc: "根据你的睡眠数据推荐今天该喝第几杯", tag: "生活", date: "2026-07-13" },
            { emoji: "🧬", title: "情绪基因组", desc: "用AI分析你的聊天记录生成专属情绪DNA图谱", tag: "AI", date: "2026-07-13" },
            { emoji: "☕", title: "咖啡地图", desc: "用手机拍每杯咖啡，AI自动识别豆种+烘焙度+产地", tag: "生活", date: "2026-07-12" },
            { emoji: "🎨", title: "AI调色板共创", desc: "输入心情词→AI生成专属配色方案，设计师可一键导出Figma", tag: "设计", date: "2026-07-12" },

            { emoji: "🧩", title: "代码拼图游戏", desc: "把开源项目拆成拼图碎片，每天拼一小块学架构", tag: "技术", date: "2026-07-12" },
            { emoji: "🔊", title: "声景房间", desc: "根据你的状态自动调整环境声音，专注时屏蔽一切杂音", tag: "产品", date: "2026-07-12" },
            { emoji: "🌙", title: "梦境画师", desc: "描述昨晚的梦，AI生成画面并分析潜意识情绪主题", tag: "AI", date: "2026-07-12" },
            { emoji: "🎨", title: "情绪色卡", desc: "每天用颜色记录心情，年终生成一幅专属情绪画卷", tag: "设计,生活", date: "2026-07-11" },
            { emoji: "🔄", title: "反向日历", desc: "从截止日期倒推，AI自动帮你规划每天该做什么", tag: "效率,产品", date: "2026-07-11" },
            { emoji: "🧠", title: "AI睡眠教练", desc: "用AI分析你的睡眠数据，像私人教练一样帮你优化作息节奏", tag: "AI,生活", date: "2026-07-11" },
            { emoji: "🫧", title: "灵感泡泡", desc: "把你散落在各处的便签/笔记/收藏自动聚合成一个灵感云图", tag: "效率", date: "2026-07-10" },
            { emoji: "🍳", title: "共享冰箱地图", desc: "实时显示周围餐厅食堂的剩余菜品，AI预测还能抢到什么", tag: "创业", date: "2026-07-10" },
            { emoji: "🔮", title: "代码考古学家", desc: "AI分析你删掉的代码，挖掘被遗忘但仍有价值的设计思路", tag: "技术", date: "2026-07-10" },
            { emoji: "🪴", title: "植物社交网络", desc: "给每盆植物装传感器，创建社区让邻居互相提醒浇水施肥", tag: "创业", date: "2026-07-09" },
            { emoji: "🧊", title: "AI冰箱管家", desc: "用摄像头识别食材，自动生成菜谱并提醒快过期的东西", tag: "AI", date: "2026-07-08" },
            { emoji: "🎨", title: "情绪调色板", desc: "根据你的心情实时生成专属配色方案，可直接用于设计项目", tag: "设计", date: "2026-07-07" },
            { emoji: "🪞", title: "数字镜像人生", desc: "给每个人建一个数字孪生体，模拟1000种人生选择后的你", tag: "创业", date: "2026-07-06" },
            { emoji: "🧊", title: "冰块记忆法", desc: "把要记的东西写在冰块上，融化过程就是复习过程", tag: "生活", date: "2026-07-05" },
            { emoji: "🎵", title: "情绪调频器", desc: "根据你的文字输入，AI自动匹配一首BGM并生成专属氛围页面", tag: "AI", date: "2026-07-04" },
            { emoji: "🪞", title: "数字镜像人格", desc: "AI分析你的聊天记录生成你的说话风格模型，帮你预览发出前的语气", tag: "AI", date: "2026-07-04" },
            { emoji: "🌊", title: "反向闹钟", desc: "只在你睡过头时才响，根据你的日程智能判断是否需要叫醒", tag: "产品", date: "2026-07-04" },
        ];
        
        // 渲染灵感卡片
        function renderIdeas() {
            const grid = document.querySelector('.ideas-grid');
            ideas.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            grid.innerHTML = ideas.map(idea => `
                <div class="idea-card">
                    <div class="idea-emoji">${idea.emoji}</div>
                    <div class="idea-title">${idea.title}</div>
                    <div class="idea-desc">${idea.desc}</div>
                    <div class="idea-meta">
                        <span class="idea-tag">${idea.tag}</span>
                        <span class="idea-date">${idea.date}</span>
                    </div>
                </div>
            `).join('');
        }
        
        renderIdeas();
    </script>
</body>
</html>

</html>
