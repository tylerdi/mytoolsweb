<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6426056111301969" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日灵感 · Tyler</title>
    <link rel="icon" type="image/png" href="resource/easyclaw.png">
    <style>
        a, button, .card { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-2: #1e1e1e;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-secondary: #888;
            --accent: #646cff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        .header {
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo span { color: var(--accent); }
        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav a:hover { color: var(--text); }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .page-header { margin-bottom: 3rem; }
        .page-header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }
        .page-header p { color: var(--text-secondary); font-size: 0.95rem; }
        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .filter-btn {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .ideas-list { display: flex; flex-direction: column; gap: 1rem; }
        .idea-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, border-color 0.2s;
        }
        .idea-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }
        .idea-top {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .idea-emoji { font-size: 1.5rem; }
        .idea-title { font-size: 1.1rem; font-weight: 700; }
        .idea-tag {
            margin-left: auto;
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            font-size: 0.75rem;
            background: rgba(100, 108, 255, 0.15);
            color: var(--accent);
        }
        .idea-desc { color: var(--text-secondary); font-size: 0.95rem; }
        .idea-date { color: var(--text-secondary); font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.6; }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }
        .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }
        @media (max-width: 768px) {
            .container { padding: 2rem 1rem; }
            .page-header h1 { font-size: 1.5rem; }
            .header-inner { padding: 0 1rem; }
            .nav a { margin-left: 1rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">Tyler<span>.</span></a>
            <nav class="nav">
                <a href="index.html">首页</a>
                <a href="tools.html">工具</a>
                <a href="resources.html">资源</a>
                <a href="ideas.html">灵感</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>💡 每日灵感</h1>
            <p>AI 生成的创意点子，每天更新，激发你的灵感</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterIdeas('all')">全部</button>
            <button class="filter-btn" onclick="filterIdeas('AI')">AI</button>
            <button class="filter-btn" onclick="filterIdeas('创业')">创业</button>
            <button class="filter-btn" onclick="filterIdeas('产品')">产品</button>
            <button class="filter-btn" onclick="filterIdeas('技术')">技术</button>
            <button class="filter-btn" onclick="filterIdeas('设计')">设计</button>
            <button class="filter-btn" onclick="filterIdeas('效率')">效率</button>
            <button class="filter-btn" onclick="filterIdeas('生活')">生活</button>
        </div>

        <div class="ideas-list" id="ideasList"></div>
    </div>

    <script>
        const ideas = [
            // IDEAS_PLACEHOLDER
            { emoji: "⚡", title: "代码味觉", desc: "给代码库加个味道评分，重构就像调味", tag: "技术", date: "2026-05-31" },
            { emoji: "🎨", title: "反向设计系统", desc: "先写用户差评，再反推产品该怎么做", tag: "产品", date: "2026-05-31" },
            { emoji: "🧠", title: "AI记忆胶囊", desc: "让AI帮你记住灵感碎片，月底自动拼成一篇文章", tag: "AI", date: "2026-05-31" },
        ];

        function filterIdeas(tag) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderIdeas(tag);
        }

        function renderIdeas(filter = 'all') {
            const list = document.getElementById('ideasList');
            const filtered = filter === 'all' ? ideas : ideas.filter(i => i.tag === filter);
            
            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="emoji">🌱</div><p>还没有灵感，敬请期待</p></div>`;
                return;
            }

            list.innerHTML = filtered.map(idea => `
                <div class="idea-card">
                    <div class="idea-top">
                        <span class="idea-emoji">${idea.emoji}</span>
                        <span class="idea-title">${idea.title}</span>
                        <span class="idea-tag">${idea.tag}</span>
                    </div>
                    <div class="idea-desc">${idea.desc}</div>
                    <div class="idea-date">${idea.date}</div>
                </div>
            `).join('');
        }

        renderIdeas();
    </script>
<script src="/fish-tracker.js"></script>
</body>
</html>
