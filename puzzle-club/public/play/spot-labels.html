    <h1>谁写错了杯贴？</h1>
    <p class="play-intro">杯子上贴了三句话，核对桌上的点单表。 找出与事实不符的一条。</p>
    <form data-puzzle data-key="spot-labels" data-answer="1" data-evidence="0,1">
      <div class="instruction"><b>已知事实</b><p>已核对的点单表显示，小陆点少冰柠檬茶，小孟点去冰柠檬茶，小叶点美式。美式固定无糖、不加柠檬。每人一杯，都拿到了自己的杯子。</p>
    </div>
    <fieldset class="choices">
      <legend>选一个答案</legend>
      <label class="choice">
        <input type="radio" name="answer" value="0" required>
        <span class="choice-letter">A</span>
        <span><span class="clue-meta">小陆 <span aria-hidden="true">·</span> 柠檬茶</span><span class="clue-text">我的杯贴写的是少冰。</span></span>
      </label><label class="choice">
        <input type="radio" name="answer" value="1" required>
        <span class="choice-letter">B</span>
        <span><span class="clue-meta">小孟 <span aria-hidden="true">·</span> 柠檬茶</span><span class="clue-text">我的杯贴也写的是少冰。</span></span>
      </label><label class="choice">
        <input type="radio" name="answer" value="2" required>
        <span class="choice-letter">C</span>
        <span><span class="clue-meta">小叶 <span aria-hidden="true">·</span> 美式</span><span class="clue-text">我的杯贴写无糖、不加柠檬。</span></span>
      </label>
    </fieldset>
      <div class="actions"><button type="submit" class="button primary" data-submit hidden>确认答案</button></div>
    </form>
    <noscript><details class="answer"><summary>打开答案与解析</summary><p><strong>B · 柠檬茶</strong>的说法对不上。</p>
    <p>点单表明确小孟点的是去冰，杯贴却写成和小陆一样的少冰。小陆和小叶的杯贴与已核对的订单一致。</p></details></noscript>
    <section class="answer" data-result hidden aria-labelledby="result-title">
      <h2 id="result-title" tabindex="-1" data-verdict>答案与解析</h2>
      <p><strong>B · 柠檬茶</strong>的说法对不上。</p>
    <p>点单表明确小孟点的是去冰，杯贴却写成和小陆一样的少冰。小陆和小叶的杯贴与已核对的订单一致。</p>
