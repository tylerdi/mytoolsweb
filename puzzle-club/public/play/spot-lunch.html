    <h1>谁先动了封口贴？</h1>
    <p class="play-intro">一包封口贴，一张照片，三条店员留下的记录。 找出与事实不符的一条。</p>
    <form data-puzzle data-key="spot-lunch" data-answer="2" data-evidence="1,2">
      <div class="instruction"><b>已知事实</b><p>新拆的封口贴固定 20 张。当天只有这一包，每封一杯用一张，没有丢弃或补入。</p>
    </div>
    <fieldset class="choices">
      <legend>选一个答案</legend>
      <label class="choice">
        <input type="radio" name="answer" value="0" required>
        <span class="choice-letter">A</span>
        <span><span class="clue-meta">09:02 <span aria-hidden="true">·</span> 拆封记录</span><span class="clue-text">刚拆开这包封口贴。</span></span>
      </label><label class="choice">
        <input type="radio" name="answer" value="1" required>
        <span class="choice-letter">B</span>
        <span><span class="clue-meta">09:05 <span aria-hidden="true">·</span> 留档照片</span><span class="clue-text">这包里剩下 18 张。</span></span>
      </label><label class="choice">
        <input type="radio" name="answer" value="2" required>
        <span class="choice-letter">C</span>
        <span><span class="clue-meta">交班时 <span aria-hidden="true">·</span> 店员留言</span><span class="clue-text">今天第一张封口贴是 09:10 用的。</span></span>
      </label>
    </fieldset>
      <div class="actions"><button type="submit" class="button primary" data-submit hidden>确认答案</button></div>
    </form>
    <noscript><details class="answer"><summary>打开答案与解析</summary><p><strong>C · 店员留言</strong>的说法对不上。</p>
    <p>09:05 时已经用掉 2 张，因为 20 − 18 = 2。第一张最迟在 09:05 用掉，交班留言把它说成了 09:10。拆封记录和照片可以同时成立。</p></details></noscript>
    <section class="answer" data-result hidden aria-labelledby="result-title">
