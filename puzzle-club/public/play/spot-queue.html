    <h1>排在门口的三个人</h1>
    <p class="play-intro">三个人各写了一条自己在队伍里的观察。 找出与事实不符的一条。</p>
    <form data-puzzle data-key="spot-queue" data-answer="1" data-evidence="1,2">
      <div class="instruction"><b>已知事实</b><p>入口摄像记录只拍到两点：红帽既不在队首，也不在队尾。黄帽进队时站在蓝帽后面，之后没人换位。队伍一共三人。</p>
    </div>
    <fieldset class="choices">
      <legend>选一个答案</legend>
      <label class="choice">
        <input type="radio" name="answer" value="0" required>
        <span class="choice-letter">A</span>
        <span><span class="clue-meta">蓝帽 <span aria-hidden="true">·</span> 我看到</span><span class="clue-text">我前面没有其他人。</span></span>
      </label><label class="choice">
        <input type="radio" name="answer" value="1" required>
        <span class="choice-letter">B</span>
        <span><span class="clue-meta">红帽 <span aria-hidden="true">·</span> 我看到</span><span class="clue-text">黄帽站在我正前面。</span></span>
      </label><label class="choice">
        <input type="radio" name="answer" value="2" required>
        <span class="choice-letter">C</span>
        <span><span class="clue-meta">黄帽 <span aria-hidden="true">·</span> 我看到</span><span class="clue-text">红帽在我前面，蓝帽比红帽更靠前。</span></span>
      </label>
    </fieldset>
      <div class="actions"><button type="submit" class="button primary" data-submit hidden>确认答案</button></div>
    </form>
    <noscript><details class="answer"><summary>打开答案与解析</summary><p><strong>B · 我看到</strong>的说法对不上。</p>
    <p>队伍顺序是蓝帽、红帽、黄帽。黄帽在红帽后面，红帽把前后说反了。蓝帽确实排第一，黄帽对前两人的描述也正确。</p></details></noscript>
