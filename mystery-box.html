<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6426056111301969" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 盲盒 — 每次打开都有惊喜 | tylerzhang.xyz</title>
    <meta name="description" content="AI 盲盒：点击一下，随机获得冷知识、毒鸡汤、笑话、诗词、彩虹屁…每次都不一样，永远有惊喜。">
    <meta name="keywords" content="AI盲盒,随机惊喜,冷知识,毒鸡汤,笑话,在线小游戏,AI娱乐,mystery box">
    <link rel="canonical" href="https://tylerzhang.xyz/mystery-box.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AI 盲盒 — 每次打开都有惊喜">
    <meta property="og:description" content="点一下，不知道会抽到什么。冷知识？毒鸡汤？还是彩虹屁？">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0a;--surface:#111;--border:#1e1e1e;--text:#e8e8e8;--text-dim:#666;--accent:#646cff;--accent-glow:rgba(100,108,255,0.3)}
        html{scroll-behavior:smooth}
        body{font-family:'LXGW WenKai',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh;display:flex;flex-direction:column;align-items:center}

        .main{margin-top:80px;padding:24px;width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center}

        .title{font-size:2rem;font-weight:900;text-align:center;margin-bottom:8px}
        .subtitle{color:var(--text-dim);text-align:center;margin-bottom:48px;font-size:.9rem}

        /* 盲盒区域 */
        .box-area{position:relative;width:280px;height:280px;margin:0 auto 40px;perspective:800px}

        .box-3d{
            width:100%;height:100%;position:relative;transform-style:preserve-3d;
            transition:transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
            cursor:pointer;
        }
        .box-3d:hover{transform:scale(1.05)}
        .box-3d.opening{
            animation:boxShake 0.5s ease-in-out, boxOpen 0.8s ease-out 0.5s forwards;
        }

        .box-face{
            position:absolute;width:100%;height:100%;
            display:flex;align-items:center;justify-content:center;
            border-radius:24px;font-size:8rem;
            background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
            border:2px solid var(--accent);
            box-shadow:0 0 40px var(--accent-glow),inset 0 0 60px rgba(100,108,255,0.1);
        }
        .box-face::after{
            content:'';position:absolute;inset:0;border-radius:24px;
            background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.05));
        }

        /* 盒子上的蝴蝶结 */
        .ribbon{
            position:absolute;top:-15px;left:50%;transform:translateX(-50%);
            width:60px;height:30px;z-index:2;
        }
        .ribbon::before,.ribbon::after{
            content:'';position:absolute;top:0;
            width:28px;height:28px;background:#e74c3c;
            border-radius:50% 50% 50% 0;transform:rotate(-45deg);
        }
        .ribbon::before{left:0}
        .ribbon::after{right:0;transform:rotate(45deg)}
        .ribbon-center{
            position:absolute;top:2px;left:50%;transform:translateX(-50%);
            width:16px;height:16px;background:#c0392b;border-radius:50%;z-index:3;
        }

        /* 光粒子 */
        .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
        .particle{
            position:absolute;width:4px;height:4px;border-radius:50%;
            background:var(--accent);opacity:0;
        }

        @keyframes boxShake{
            0%,100%{transform:rotate(0)}
            20%{transform:rotate(-8deg) scale(1.1)}
            40%{transform:rotate(8deg) scale(1.1)}
            60%{transform:rotate(-5deg) scale(1.05)}
            80%{transform:rotate(5deg) scale(1.05)}
        }
        @keyframes boxOpen{
            0%{transform:scale(1);opacity:1}
            50%{transform:scale(1.3) rotateY(180deg);opacity:0.8}
            100%{transform:scale(0.8) rotateY(360deg);opacity:0}
        }

        /* 结果卡片 */
        .result-card{
            width:100%;background:var(--surface);border:1px solid var(--border);
            border-radius:20px;padding:32px 24px;text-align:center;
            opacity:0;transform:translateY(30px) scale(0.95);
            transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
            position:relative;overflow:hidden;
        }
        .result-card.show{opacity:1;transform:translateY(0) scale(1)}
        .result-card::before{
            content:'';position:absolute;top:0;left:0;right:0;height:3px;
            background:linear-gradient(90deg,var(--accent),#e74c3c,#f39c12,#2ecc71,#3498db);
        }

        .result-type{
            display:inline-flex;align-items:center;gap:6px;
            padding:6px 16px;border-radius:20px;font-size:.8rem;
            background:rgba(100,108,255,0.15);color:var(--accent);
            margin-bottom:16px;
        }
        .result-emoji{font-size:3rem;margin-bottom:16px;display:block}
        .result-content{
            font-size:1.1rem;line-height:2;color:var(--text);
            margin-bottom:24px;min-height:60px;
        }
        .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

        .btn{
            padding:10px 24px;border-radius:12px;border:1px solid var(--border);
            background:transparent;color:var(--text-dim);font-size:.9rem;
            cursor:pointer;font-family:inherit;transition:all .2s;
            display:flex;align-items:center;gap:6px;
        }
        .btn:hover{border-color:var(--accent);color:var(--accent)}
        .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
        .btn.primary:hover{opacity:.85}

        /* 历史记录 */
        .history{width:100%;margin-top:48px}
        .history h3{font-size:1rem;color:var(--text-dim);margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .history-list{display:flex;flex-direction:column;gap:12px}
        .history-item{
            display:flex;align-items:flex-start;gap:12px;
            padding:14px 16px;background:var(--surface);border:1px solid var(--border);
            border-radius:12px;font-size:.85rem;
        }
        .history-item .emoji{font-size:1.3rem;flex-shrink:0}
        .history-item .type-tag{
            font-size:.7rem;padding:2px 8px;border-radius:10px;
            background:rgba(100,108,255,0.1);color:var(--accent);
        }
        .history-item .text{color:var(--text-dim);line-height:1.6}

        .empty-hint{text-align:center;color:var(--text-muted);padding:40px 0;font-size:.85rem}

        /* 计数器 */
        .counter{
            margin-top:24px;font-size:.8rem;color:var(--text-muted);
            display:flex;gap:24px;justify-content:center;
        }
        .counter span{display:flex;align-items:center;gap:4px}

        .footer{text-align:center;padding:40px 24px;color:var(--text-muted);font-size:.8rem;border-top:1px solid var(--border);margin-top:60px;width:100%}

        @media(max-width:768px){
            .main{padding:16px;margin-top:70px}
            .title{font-size:1.5rem}
            .box-area{width:220px;height:220px}
            .box-face{font-size:6rem}
            .result-content{font-size:1rem}
        }
    </style>
</head>
<body>

<div class="main">
    <h1 class="title">🎁 AI 盲盒</h1>
    <p class="subtitle">点一下，不知道会抽到什么</p>

    <div class="box-area" onclick="openBox()">
        <div class="box-3d" id="box">
            <div class="ribbon"></div>
            <div class="ribbon-center"></div>
            <div class="box-face">🎁</div>
        </div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="counter">
        <span>📦 已开 <strong id="openCount">0</strong> 次</span>
        <span>🔥 连开 <strong id="comboCount">0</strong> 次</span>
    </div>

    <div class="result-card" id="resultCard">
        <span class="result-type" id="resultType"></span>
        <span class="result-emoji" id="resultEmoji"></span>
        <div class="result-content" id="resultContent"></div>
        <div class="result-actions">
            <button class="btn primary" onclick="openBox()">🎲 再来一次</button>
            <button class="btn" onclick="copyResult()">📋 复制</button>
            <button class="btn" onclick="shareResult()">📤 分享</button>
        </div>
    </div>

    <div class="history" id="historySection" style="display:none">
        <h3>📜 开箱记录</h3>
        <div class="history-list" id="historyList"></div>
    </div>
</div>

<div class="footer">
    <p>🐟 小鱼儿的数字花园 · <a href="/">tylerzhang.xyz</a></p>
</div>

<script>
const API = '/api/mystery-box';
let lastType = '';
let lastContent = '';
let openCount = parseInt(localStorage.getItem('mysteryBoxCount') || '0');
let comboCount = 0;
let isOpening = false;
let history = JSON.parse(localStorage.getItem('mysteryBoxHistory') || '[]');

document.getElementById('openCount').textContent = openCount;
renderHistory();

async function openBox() {
    if (isOpening) return;
    isOpening = true;

    const box = document.getElementById('box');
    const resultCard = document.getElementById('resultCard');

    // 隐藏上次结果
    resultCard.classList.remove('show');

    // 开箱动画
    box.classList.add('opening');
    spawnParticles();

    try {
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ exclude: lastType }),
        });
        const data = await res.json();

        if (!data.ok) throw new Error(data.error || '开箱失败');

        // 等动画结束
        await new Promise(r => setTimeout(r, 1200));

        // 显示结果
        lastType = data.type;
        lastContent = data.content;

        document.getElementById('resultType').innerHTML = `${data.emoji} ${data.type}`;
        document.getElementById('resultEmoji').textContent = data.emoji;
        document.getElementById('resultContent').textContent = data.content;

        resultCard.classList.add('show');

        // 更新计数
        openCount++;
        comboCount++;
        document.getElementById('openCount').textContent = openCount;
        document.getElementById('comboCount').textContent = comboCount;
        localStorage.setItem('mysteryBoxCount', openCount.toString());

        // 保存历史
        history.unshift({ type: data.type, emoji: data.emoji, content: data.content, time: Date.now() });
        if (history.length > 20) history = history.slice(0, 20);
        localStorage.setItem('mysteryBoxHistory', JSON.stringify(history));
        renderHistory();

    } catch (err) {
        await new Promise(r => setTimeout(r, 800));
        document.getElementById('resultType').innerHTML = '😅 出错了';
        document.getElementById('resultEmoji').textContent = '🎁';
        document.getElementById('resultContent').textContent = '盲盒坏了，再试一次？';
        resultCard.classList.add('show');
    }

    // 重置盒子
    setTimeout(() => {
        box.classList.remove('opening');
        isOpening = false;
    }, 500);
}

function spawnParticles() {
    const container = document.getElementById('particles');
    container.innerHTML = '';
    const colors = ['#646cff', '#e74c3c', '#f39c12', '#2ecc71', '#3498db', '#9b59b6'];
    for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = '50%';
        p.style.top = '50%';
        p.style.width = (3 + Math.random() * 5) + 'px';
        p.style.height = p.style.width;
        container.appendChild(p);

        const angle = (Math.PI * 2 * i) / 20 + Math.random() * 0.5;
        const dist = 80 + Math.random() * 100;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;

        p.animate([
            { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' },
            { opacity: 0, transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)` }
        ], { duration: 800 + Math.random() * 400, easing: 'cubic-bezier(0,0.5,0.5,1)', fill: 'forwards' });
    }
}

function renderHistory() {
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');
    if (history.length === 0) { section.style.display = 'none'; return; }
    section.style.display = 'block';

    list.innerHTML = history.slice(0, 10).map(h => {
        const ago = timeAgo(h.time);
        return `<div class="history-item">
            <span class="emoji">${h.emoji}</span>
            <div>
                <span class="type-tag">${h.type}</span>
                <div class="text">${h.content}</div>
            </div>
        </div>`;
    }).join('');
}

function timeAgo(ts) {
    const diff = Date.now() - ts;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    return Math.floor(diff / 86400000) + '天前';
}

function copyResult() {
    if (!lastContent) return;
    const text = `【${lastType}】${lastContent}\n\n—— 来自 AI 盲盒 🎁 tylerzhang.xyz`;
    navigator.clipboard.writeText(text).then(() => {
        showToast('已复制 ✨');
    });
}

function shareResult() {
    if (!lastContent) return;
    const text = `【${lastType}】${lastContent}\n\n—— 来自 AI 盲盒 🎁`;
    if (navigator.share) {
        navigator.share({ title: 'AI 盲盒', text });
    } else {
        navigator.clipboard.writeText(text).then(() => {
            showToast('已复制，去粘贴分享吧 ✨');
        });
    }
}

function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:8px 20px;border-radius:8px;font-size:.85rem;z-index:999;transition:opacity .3s';
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 1500);
}

// 重置连开计数（5分钟没操作归零）
let comboTimer;
function resetCombo() {
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { comboCount = 0; document.getElementById('comboCount').textContent = 0; }, 300000);
}
document.addEventListener('click', resetCombo);
</script>

    <script src="/nav.js"></script>
</body>
</html>
