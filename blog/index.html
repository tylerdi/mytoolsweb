<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日创意 · Tyler's Blog</title>
    <link rel="icon" type="image/png" href="../resource/easyclaw.png">
    <style>
        a, button, .card, .chapter-item { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-2: #1e1e1e;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-secondary: #888;
            --accent: #646cff;
            --accent-hover: #535bf2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            height: 100dvh;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .header-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .logo span { color: var(--accent); }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav a:hover { color: var(--text); }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        .page-desc {
            color: var(--text-secondary);
            margin-bottom: 3rem;
            font-size: 1.05rem;
        }

        .post-list { list-style: none; }

        .post-item {
            border-bottom: 1px solid var(--border);
            padding: 2rem 0;
            transition: all 0.2s;
        }

        .post-item:first-child { padding-top: 0; }

        .post-item:hover { padding-left: 0.5rem; }

        .post-date {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-variant-numeric: tabular-nums;
        }

        .post-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .post-title a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s;
        }

        .post-title a:hover { color: var(--accent); }

        .post-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .post-tag {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--accent);
            background: rgba(100, 108, 255, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            margin-top: 0.75rem;
            font-weight: 500;
        }

        .footer {
            border-top: 1px solid var(--border);
            padding: 2rem 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 640px) {
            .container { padding: 2rem 1.25rem; }
            .page-title { font-size: 1.5rem; }
            .post-title { font-size: 1.15rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">Tyler<span>.</span></a>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/blog/">博客</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">💡 每日创意</h1>
        <p class="page-desc">每天一个新点子，AI 生成，持续积累。创业、技术、产品、脑洞，不设限。</p>

        <ul class="post-list" id="post-list">
            <!-- Posts will be injected by script -->
        </ul>
    </main>

    <footer class="footer">
        <p>Powered by <a href="https://www.tylerzhang.xyz">Tyler</a> & <a href="https://openclaw.ai">OpenClaw</a></p>
    </footer>

    <script>
        // Blog post manifest - auto-generated, newest first
        const posts = [
            // POSTS_PLACEHOLDER
            { date: "2026 年 05 月 07 日", title: "AI Agent正在重新定义「陪伴」", summary: "当代码成为你最忠诚的倾听者", tag: "AI,产品思考,创业,心理学", file: "2026-05-07-AI-Agent正在重新定义陪伴.html" },
            { date: "2026 年 05 月 06 日", title: "AI 正在成为你的新操作系统", summary: "从打开 App 到开口说话，交互范式正在迁移", tag: "AI,科技,趋势,Agent,操作系统", file: "2026-05-06-AI-正在成为你的新操作系统.html" },
            { date: "2026 年 05 月 05 日", title: "2026，你的AI员工已上线", summary: "从对话到委托，Agent正在重新定义工作方式", tag: "AI,Agent,效率,技术趋势", file: "2026-05-05-2026你的AI员工已上线.html" },
            { date: "2026 年 05 月 04 日", title: "AI 终于开始记住你了：记忆革命正在重新定义人机关系", summary: "当 AI 有了持久记忆，它就不再是工具，而是伙伴。", tag: "AI,记忆,产品思考,人机关系,技术趋势", file: "2026-05-04-AI-终于开始记住你了记忆革命正在重新定义人机关系.html" },
            { date: "2026 年 05 月 03 日", title: "会偷懒的人赢了：AI 时代的委托思维", summary: "真正的高手，是知道什么该交给 AI 的人", tag: "AI,效率,个人成长,思维方式", file: "2026-05-03-会偷懒的人赢了AI-时代的委托思维.html" },
            { date: "2026 年 05 月 02 日", title: "AI 不再是工具：当 Agent 成为数字世界的「中间层」", summary: "AI正在从工具进化为人与软件之间的翻译层，谁掌握入口谁就掌握生态。", tag: "AI,Agent,创业,趋势", file: "2026-05-02-AI-不再是工具当-Agent-成为数字世界的中间层.html" },
            { date: "2026 年 05 月 01 日", title: "五一特稿：AI 不是在消灭工作，是在消灭打工感", summary: "AI时代，劳动正在被重新定义", tag: "AI,未来,工作,创造力", file: "2026-05-01-五一特稿AI-不是在消灭工作是在消灭打工感.html" },
            { date: "2026 年 05 月 01 日", title: "第一篇：AI 如何改变我们的早晨", summary: "从一杯咖啡的角度，看 AI 如何重新定义早晨 routine", tag: "AI 生活", file: "2026-05-01-第一篇AI-如何改变我们的早晨.html" },
        ];

        const list = document.getElementById('post-list');
        
        if (posts.length === 0) {
            list.innerHTML = '<li class="post-item"><p class="post-summary" style="color:var(--text-secondary);">暂无文章，第一篇即将发布 ✨</p></li>';
        } else {
            posts.forEach(post => {
                const li = document.createElement('li');
                li.className = 'post-item';
                li.innerHTML = `
                    <div class="post-date">${post.date}</div>
                    <h2 class="post-title"><a href="posts/${post.file}">${post.title}</a></h2>
                    <p class="post-summary">${post.summary}</p>
                    <span class="post-tag">${post.tag}</span>
                `;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
