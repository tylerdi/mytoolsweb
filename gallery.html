<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6426056111301969" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 画廊 - 小鱼儿的数字花园</title>
    <link rel="canonical" href="https://tylerzhang.xyz/gallery">
    <meta name="description" content="AI 生成的艺术画廊，每日更新精美 AI 画作。">
    <meta name="keywords" content="AI画廊,AI艺术,AI绘画,AI图片,数字艺术">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0a;--surface:#111;--border:#1e1e1e;--text:#e8e8e8;--text-dim:#888;--accent:#646cff;--accent-glow:rgba(100,108,255,0.25);--pink:#ff6b9d;--gradient:linear-gradient(135deg,var(--accent),var(--pink))}
        html{scroll-behavior:smooth}
        body{font-family:'LXGW WenKai',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh}
        a{color:var(--accent);text-decoration:none}
        a:hover{text-decoration:underline}

        .container{max-width:1200px;margin:0 auto;padding:80px 20px 40px}

        /* 头部 */
        .header{text-align:center;margin-bottom:40px}
        .header h1{font-size:2.2rem;margin-bottom:10px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header p{color:var(--text-dim);font-size:0.9rem}
        .stats{display:flex;justify-content:center;gap:20px;margin-top:16px}
        .stat{padding:6px 16px;background:rgba(100,108,255,0.1);border:1px solid rgba(100,108,255,0.2);border-radius:20px;font-size:0.8rem;color:var(--accent)}

        /* 筛选标签 */
        .filter-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
        .filter-tab{padding:6px 14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:0.8rem;color:var(--text-dim);cursor:pointer;transition:all 0.2s}
        .filter-tab.active{background:var(--accent);color:white;border-color:var(--accent)}
        .filter-tab:hover{border-color:var(--accent)}

        /* 图片网格 */
        .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
        .gallery-item{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.3s}
        .gallery-item:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
        .gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s}
        .gallery-item:hover img{transform:scale(1.05)}
        .gallery-overlay{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.8))}
        .gallery-overlay h3{font-size:0.9rem;margin-bottom:4px;color:white}
        .gallery-overlay p{font-size:0.75rem;color:rgba(255,255,255,0.7)}
        .gallery-tag{position:absolute;top:12px;right:12px;padding:4px 10px;background:rgba(100,108,255,0.8);border-radius:12px;font-size:0.7rem;color:white}

        /* 加载状态 */
        .loading{text-align:center;padding:40px;color:var(--text-dim)}
        .loading .spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-right:8px}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* 空状态 */
        .empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
        .empty .emoji{font-size:3rem;margin-bottom:16px}

        /* 灯箱 */
        .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;display:none;align-items:center;justify-content:center}
        .lightbox.show{display:flex}
        .lightbox img{max-width:90%;max-height:90vh;object-fit:contain;border-radius:8px}
        .lightbox-close{position:absolute;top:20px;right:20px;background:none;border:none;color:white;font-size:2rem;cursor:pointer}
        .lightbox-info{position:absolute;bottom:20px;left:20px;right:20px;text-align:center}
        .lightbox-info h3{font-size:1.2rem;margin-bottom:8px}
        .lightbox-info p{font-size:0.9rem;color:rgba(255,255,255,0.7)}

        /* 返回首页 */
        .back-home{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:0.85rem;margin-bottom:20px}
        .back-home:hover{color:var(--accent);text-decoration:none}

        @media(max-width:768px){
            .container{padding:70px 16px 30px}
            .header h1{font-size:1.8rem}
            .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-home">← 返回首页</a>

        <div class="header">
            <h1>🎨 AI 画廊</h1>
            <p>AI 生成的艺术画作，每日更新</p>
            <div class="stats">
                <div class="stat" id="totalCount">加载中...</div>
                <div class="stat">每日更新</div>
            </div>
        </div>

        <div class="filter-tabs">
            <div class="filter-tab active" data-tag="all">全部</div>
            <div class="filter-tab" data-tag="portrait">人像</div>
            <div class="filter-tab" data-tag="creative">创意</div>
            <div class="filter-tab" data-tag="carbon-circle">碳基圈</div>
            <div class="filter-tab" data-tag="book-cover">封面</div>
        </div>

        <div id="galleryContainer">
            <div class="loading">
                <span class="spinner"></span>
                正在加载画廊...
            </div>
        </div>
    </div>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-info">
            <h3 id="lightboxTitle"></h3>
            <p id="lightboxDesc"></p>
        </div>
    </div>

    <script>
        let allImages = [];
        let currentFilter = 'all';

        // 加载图片
        async function loadGallery() {
            try {
                const response = await fetch('/api/gallery');
                const data = await response.json();
                
                if (data.ok && data.data) {
                    allImages = data.data;
                    document.getElementById('totalCount').textContent = `共 ${data.total || allImages.length} 张`;
                    renderGallery();
                } else {
                    showError('加载失败');
                }
            } catch (error) {
                console.error('加载画廊失败:', error);
                showError('网络错误');
            }
        }

        // 渲染画廊
        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            const filtered = currentFilter === 'all' 
                ? allImages 
                : allImages.filter(img => img.tag === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="emoji">🎨</div>
                        <p>暂无图片</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="gallery-grid">
                    ${filtered.map(img => `
                        <div class="gallery-item" onclick="openLightbox('${img.url}', '${escapeHtml(img.prompt)}', '${img.tag}')">
                            <img src="${img.url}" alt="${escapeHtml(img.prompt)}" loading="lazy">
                            <div class="gallery-tag">${getTagLabel(img.tag)}</div>
                            <div class="gallery-overlay">
                                <h3>${escapeHtml(img.prompt).substring(0, 50)}${img.prompt.length > 50 ? '...' : ''}</h3>
                                <p>${formatDate(img.created_at)}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 获取标签中文名
        function getTagLabel(tag) {
            const labels = {
                'portrait': '人像',
                'creative': '创意',
                'carbon-circle': '碳基圈',
                'book-cover': '封面'
            };
            return labels[tag] || tag;
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        // 转义 HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 打开灯箱
        function openLightbox(url, title, tag) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxTitle').textContent = title;
            document.getElementById('lightboxDesc').textContent = getTagLabel(tag);
            document.getElementById('lightbox').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // 关闭灯箱
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('show');
            document.body.style.overflow = '';
        }

        // 显示错误
        function showError(message) {
            document.getElementById('galleryContainer').innerHTML = `
                <div class="empty">
                    <div class="emoji">😢</div>
                    <p>${message}</p>
                </div>
            `;
        }

        // 筛选标签点击
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.tag;
                renderGallery();
            });
        });

        // 灯箱点击背景关闭
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target === document.getElementById('lightbox')) {
                closeLightbox();
            }
        });

        // ESC 关闭灯箱
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // 初始化
        loadGallery();
    </script>
<script src="/fish-tracker.js"></script>
</body>
</html>
