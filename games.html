<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>游戏合集 - AI工具箱</title>
    <link rel="icon" type="image/png" href="resource/easyclaw.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            pink: '#ff2a6d',
                            purple: '#d300c5',
                            blue: '#05d9e8',
                            dark: '#0d0221',
                            darker: '#090119',
                        }
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { textShadow: '0 0 5px #ff2a6d, 0 0 10px #ff2a6d' },
                            '100%': { textShadow: '0 0 10px #ff2a6d, 0 0 20px #ff2a6d, 0 0 30px #d300c5' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .game-cell {
            width: 20px;
            height: 20px;
            border: 1px solid rgba(255, 42, 109, 0.2);
        }
        @media (min-width: 640px) {
            .game-cell {
                width: 25px;
                height: 25px;
            }
        }
        .snake { background: #05d9e8 !important; }
        .food { background: #ff2a6d !important; border-radius: 50%; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyber-dark to-cyber-darker min-h-screen text-white font-sans">
    <!-- 导航栏 -->
    <nav class="bg-cyber-darker/80 backdrop-blur-md border-b border-cyber-pink/30 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-2">
                <i class="fa fa-gamepad text-2xl text-cyber-pink"></i>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyber-pink via-cyber-purple to-cyber-blue bg-clip-text text-transparent">游戏合集</h1>
            </a>
            <div class="flex items-center space-x-4">
                <a href="/" class="px-4 py-2 rounded-lg bg-cyber-pink/20 hover:bg-cyber-pink/30 text-white transition-all">
                    <i class="fa fa-home mr-2"></i>返回首页
                </a>
            </div>
        </div>
    </nav>

    <!-- 游戏列表 -->
    <div class="container mx-auto px-4 py-12">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 贪吃蛇 -->
            <div class="bg-cyber-dark/80 rounded-xl overflow-hidden border border-cyber-pink/30 shadow-lg hover:shadow-cyber-pink/20 transition-all duration-300 hover:-translate-y-1">
                <div class="h-48 bg-gradient-to-br from-cyber-blue/40 to-cyber-pink/40 flex items-center justify-center">
                    <i class="fa fa-long-arrow-right text-6xl text-white/80 animate-float"></i>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold mb-3 text-cyber-blue">🐍 贪吃蛇</h3>
                    <p class="text-sm text-gray-300 mb-4">经典贪吃蛇游戏，吃食物变长，不要撞墙和自己</p>
                    <button onclick="startGame('snake')" class="w-full px-4 py-2 rounded-lg bg-cyber-blue hover:bg-cyber-blue/80 text-white font-medium transition-all">
                        <i class="fa fa-play mr-2"></i>开始游戏
                    </button>
                </div>
            </div>

            <!-- 2048 -->
            <div class="bg-cyber-dark/80 rounded-xl overflow-hidden border border-cyber-pink/30 shadow-lg hover:shadow-cyber-pink/20 transition-all duration-300 hover:-translate-y-1">
                <div class="h-48 bg-gradient-to-br from-cyber-purple/40 to-cyber-blue/40 flex items-center justify-center">
                    <i class="fa fa-cubes text-6xl text-white/80 animate-float"></i>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold mb-3 text-cyber-purple">🔢 2048</h3>
                    <p class="text-sm text-gray-300 mb-4">数字合成游戏，合并相同数字得到2048</p>
                    <button onclick="startGame('2048')" class="w-full px-4 py-2 rounded-lg bg-cyber-purple hover:bg-cyber-purple/80 text-white font-medium transition-all">
                        <i class="fa fa-play mr-2"></i>开始游戏
                    </button>
                </div>
            </div>

            <!-- 更多游戏 -->
            <div class="bg-cyber-dark/80 rounded-xl overflow-hidden border border-cyber-pink/30 shadow-lg hover:shadow-cyber-pink/20 transition-all duration-300 hover:-translate-y-1 opacity-70">
                <div class="h-48 bg-gradient-to-br from-cyber-pink/40 to-cyber-purple/40 flex items-center justify-center">
                    <i class="fa fa-plus text-6xl text-white/80 animate-float"></i>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold mb-3 text-cyber-pink">🎮 更多游戏</h3>
                    <p class="text-sm text-gray-300 mb-4">更多好玩游戏正在开发中，敬请期待</p>
                    <button disabled class="w-full px-4 py-2 rounded-lg bg-gray-600 text-white font-medium cursor-not-allowed">
                        <i class="fa fa-clock-o mr-2"></i>开发中
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏弹窗 -->
    <div id="game-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center">
        <div class="w-full max-w-2xl mx-4 bg-cyber-dark rounded-xl border border-cyber-pink/30 p-6 relative">
            <button onclick="closeGame()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl transition-all">
                <i class="fa fa-times"></i>
            </button>
            <h2 id="game-title" class="text-2xl font-bold mb-4 text-center bg-gradient-to-r from-cyber-pink to-cyber-blue bg-clip-text text-transparent"></h2>
            <div id="game-content" class="bg-black/30 rounded-lg p-4 flex flex-col items-center justify-center min-h-[400px]">
                <!-- 游戏内容在这里 -->
            </div>
            <div class="mt-4 flex justify-between items-center text-gray-300">
                <div>
                    <span class="mr-4">得分: <span id="game-score" class="text-cyber-pink font-bold">0</span></span>
                </div>
                <div class="space-x-2">
                    <button onclick="restartGame()" class="px-4 py-2 rounded-lg bg-cyber-pink hover:bg-cyber-pink/80 text-white transition-all">
                        <i class="fa fa-refresh mr-2"></i>重新开始
                    </button>
                </div>
            </div>
            <!-- 移动端控制按钮 -->
            <div class="mt-6 grid grid-cols-3 gap-2 md:hidden">
                <div></div>
                <div ontouchstart="event.preventDefault(); mobileControl('up');" onclick="event.preventDefault(); mobileControl('up');" class="py-4 bg-cyber-purple rounded-lg text-white text-xl font-bold text-center active:bg-cyber-purple/70 cursor-pointer">↑</div>
                <div></div>
                <div ontouchstart="event.preventDefault(); mobileControl('left');" onclick="event.preventDefault(); mobileControl('left');" class="py-4 bg-cyber-purple rounded-lg text-white text-xl font-bold text-center active:bg-cyber-purple/70 cursor-pointer">←</div>
                <div ontouchstart="event.preventDefault(); mobileControl('down');" onclick="event.preventDefault(); mobileControl('down');" class="py-4 bg-cyber-purple rounded-lg text-white text-xl font-bold text-center active:bg-cyber-purple/70 cursor-pointer">↓</div>
                <div ontouchstart="event.preventDefault(); mobileControl('right');" onclick="event.preventDefault(); mobileControl('right');" class="py-4 bg-cyber-purple rounded-lg text-white text-xl font-bold text-center active:bg-cyber-purple/70 cursor-pointer">→</div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-cyber-darker/80 border-t border-cyber-pink/30 py-8 mt-16">
        <div class="container mx-auto px-4 text-center text-gray-400">
            <p>© 2026 AI工具箱 · 游戏合集</p>
            <p class="mt-2 text-sm">所有游戏均为本地运行，无需联网即可畅玩</p>
        </div>
    </footer>

    <script>
        const gameModal = document.getElementById('game-modal');
        const gameContent = document.getElementById('game-content');
        const gameTitle = document.getElementById('game-title');
        const gameScore = document.getElementById('game-score');
        
        let currentGame = null;
        let gameInterval = null;
        let score = 0;
        let dx = 1, dy = 0; // 贪吃蛇方向
        let nextDx = 1, nextDy = 0;

        // 关闭游戏
        function closeGame() {
            clearInterval(gameInterval);
            gameModal.style.display = 'none';
            currentGame = null;
        }

        // 重新开始
        function restartGame() {
            if (currentGame) {
                startGame(currentGame);
            }
        }

        // 移动端控制
        function mobileControl(dir) {
            console.log('点击方向按钮:', dir, '当前游戏:', currentGame);
            alert('点击了方向: ' + dir); // 调试用
            
            if (currentGame === 'snake') {
                changeDirection(dir);
            } else if (currentGame === '2048') {
                let moved = false;
                switch(dir) {
                    case 'up': moved = moveUp(); break;
                    case 'down': moved = moveDown(); break;
                    case 'left': moved = moveLeft(); break;
                    case 'right': moved = moveRight(); break;
                }
                console.log('2048移动结果:', moved);
                if (moved) {
                    addRandomTile();
                    draw();
                    if (isGameOver()) {
                        alert(`游戏结束！得分: ${score}`);
                    }
                }
            }
        }

        // ==================== 贪吃蛇游戏 ====================
        function startSnake() {
            score = 0;
            gameScore.textContent = '0';
            clearInterval(gameInterval);

            const GRID_SIZE = 20;
            
            // 创建网格
            let html = `<div class="grid gap-0">`;
            for (let y = 0; y < GRID_SIZE; y++) {
                html += `<div class="flex">`;
                for (let x = 0; x < GRID_SIZE; x++) {
                    html += `<div class="game-cell" id="cell-${x}-${y}"></div>`;
                }
                html += `</div>`;
            }
            html += `</div>`;
            gameContent.innerHTML = html;

            // 游戏数据
            let snake = [{x: 10, y: 10}];
            let food = {x: 5, y: 5};
            dx = 1; dy = 0;
            nextDx = 1; nextDy = 0;

            // 绘制
            function draw() {
                document.querySelectorAll('.game-cell').forEach(cell => {
                    cell.classList.remove('snake', 'food');
                });

                // 绘制蛇
                snake.forEach(segment => {
                    document.getElementById(`cell-${segment.x}-${segment.y}`).classList.add('snake');
                });

                // 绘制食物
                document.getElementById(`cell-${food.x}-${food.y}`).classList.add('food');
            }

            // 移动
            function move() {
                dx = nextDx;
                dy = nextDy;

                const head = {x: snake[0].x + dx, y: snake[0].y + dy};

                // 撞墙
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    clearInterval(gameInterval);
                    alert(`游戏结束！得分: ${score}`);
                    return;
                }

                // 撞自己
                if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                    clearInterval(gameInterval);
                    alert(`游戏结束！得分: ${score}`);
                    return;
                }

                snake.unshift(head);

                // 吃食物
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    gameScore.textContent = score;
                    // 生成新食物
                    do {
                        food = {
                            x: Math.floor(Math.random() * GRID_SIZE),
                            y: Math.floor(Math.random() * GRID_SIZE)
                        };
                    } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
                } else {
                    snake.pop();
                }

                draw();
            }

            // 键盘控制
            function handleKeydown(e) {
                switch(e.key) {
                    case 'ArrowUp': e.preventDefault(); changeDirection('up'); break;
                    case 'ArrowDown': e.preventDefault(); changeDirection('down'); break;
                    case 'ArrowLeft': e.preventDefault(); changeDirection('left'); break;
                    case 'ArrowRight': e.preventDefault(); changeDirection('right'); break;
                }
            }

            // 改变方向
            function changeDirection(dir) {
                switch(dir) {
                    case 'up': if (dy !== 1) { nextDx = 0; nextDy = -1; } break;
                    case 'down': if (dy !== -1) { nextDx = 0; nextDy = 1; } break;
                    case 'left': if (dx !== 1) { nextDx = -1; nextDy = 0; } break;
                    case 'right': if (dx !== -1) { nextDx = 1; nextDy = 0; } break;
                }
            }

            // 触屏控制
            let touchStartX = 0, touchStartY = 0;
            gameContent.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                e.preventDefault();
            }, {passive: false});
            gameContent.addEventListener('touchend', e => {
                const dxTouch = e.changedTouches[0].clientX - touchStartX;
                const dyTouch = e.changedTouches[0].clientY - touchStartY;
                
                if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
                    changeDirection(dxTouch > 0 ? 'right' : 'left');
                } else {
                    changeDirection(dyTouch > 0 ? 'down' : 'up');
                }
                e.preventDefault();
            }, {passive: false});

            document.removeEventListener('keydown', handleKeydown);
            document.addEventListener('keydown', handleKeydown);

            // 开始游戏
            draw();
            gameInterval = setInterval(move, 200);
        }

        // ==================== 2048游戏 ====================
        function start2048() {
            score = 0;
            gameScore.textContent = '0';
            clearInterval(gameInterval);

            const GRID_SIZE = 4;
            const CELL_SIZE = Math.min(80, Math.floor(window.innerWidth / 5));
            
            // 创建网格
            let html = `<div class="grid gap-3 p-3 bg-gray-800 rounded-lg" style="grid-template-columns: repeat(${GRID_SIZE}, ${CELL_SIZE}px);">`;
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                html += `<div class="w-[${CELL_SIZE}px] h-[${CELL_SIZE}px] flex items-center justify-center text-2xl font-bold rounded-lg bg-gray-700" id="cell-${i}"></div>`;
            }
            html += `</div>`;
            gameContent.innerHTML = html;

            // 游戏数据
            let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            
            // 生成新数字
            function addRandomTile() {
                const emptyCells = [];
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (grid[i][j] === 0) {
                            emptyCells.push({i, j});
                        }
                    }
                }
                if (emptyCells.length > 0) {
                    const cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    grid[cell.i][cell.j] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            // 绘制
            function draw() {
                const colors = {
                    0: 'bg-gray-700',
                    2: 'bg-yellow-100 text-gray-800',
                    4: 'bg-yellow-200 text-gray-800',
                    8: 'bg-orange-400 text-white',
                    16: 'bg-orange-500 text-white',
                    32: 'bg-red-500 text-white',
                    64: 'bg-red-600 text-white',
                    128: 'bg-yellow-300 text-gray-800',
                    256: 'bg-yellow-400 text-gray-800',
                    512: 'bg-yellow-500 text-white',
                    1024: 'bg-yellow-600 text-white',
                    2048: 'bg-yellow-700 text-white'
                };

                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        const cell = document.getElementById(`cell-${i * GRID_SIZE + j}`);
                        const value = grid[i][j];
                        cell.textContent = value || '';
                        cell.className = `w-[${CELL_SIZE}px] h-[${CELL_SIZE}px] flex items-center justify-center text-2xl font-bold rounded-lg ${colors[value] || 'bg-purple-600 text-white'}`;
                    }
                }
            }

            // 移动逻辑
            function moveLeft() {
                let moved = false;
                for (let i = 0; i < GRID_SIZE; i++) {
                    let row = grid[i].filter(val => val !== 0);
                    for (let j = 0; j < row.length - 1; j++) {
                        if (row[j] === row[j + 1]) {
                            row[j] *= 2;
                            score += row[j];
                            gameScore.textContent = score;
                            row.splice(j + 1, 1);
                            moved = true;
                        }
                    }
                    while (row.length < GRID_SIZE) {
                        row.push(0);
                    }
                    if (JSON.stringify(grid[i]) !== JSON.stringify(row)) {
                        grid[i] = row;
                        moved = true;
                    }
                }
                return moved;
            }

            function moveRight() {
                let moved = false;
                for (let i = 0; i < GRID_SIZE; i++) {
                    let row = grid[i].filter(val => val !== 0);
                    for (let j = row.length - 1; j > 0; j--) {
                        if (row[j] === row[j - 1]) {
                            row[j] *= 2;
                            score += row[j];
                            gameScore.textContent = score;
                            row.splice(j - 1, 1);
                            moved = true;
                        }
                    }
                    while (row.length < GRID_SIZE) {
                        row.unshift(0);
                    }
                    if (JSON.stringify(grid[i]) !== JSON.stringify(row)) {
                        grid[i] = row;
                        moved = true;
                    }
                }
                return moved;
            }

            function moveUp() {
                let moved = false;
                for (let j = 0; j < GRID_SIZE; j++) {
                    let col = [];
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== 0) {
                            col.push(grid[i][j]);
                        }
                    }
                    for (let i = 0; i < col.length - 1; i++) {
                        if (col[i] === col[i + 1]) {
                            col[i] *= 2;
                            score += col[i];
                            gameScore.textContent = score;
                            col.splice(i + 1, 1);
                            moved = true;
                        }
                    }
                    while (col.length < GRID_SIZE) {
                        col.push(0);
                    }
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== col[i]) {
                            grid[i][j] = col[i];
                            moved = true;
                        }
                    }
                }
                return moved;
            }

            function moveDown() {
                let moved = false;
                for (let j = 0; j < GRID_SIZE; j++) {
                    let col = [];
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== 0) {
                            col.push(grid[i][j]);
                        }
                    }
                    for (let i = col.length - 1; i > 0; i--) {
                        if (col[i] === col[i - 1]) {
                            col[i] *= 2;
                            score += col[i];
                            gameScore.textContent = score;
                            col.splice(i - 1, 1);
                            moved = true;
                        }
                    }
                    while (col.length < GRID_SIZE) {
                        col.unshift(0);
                    }
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== col[i]) {
                            grid[i][j] = col[i];
                            moved = true;
                        }
                    }
                }
                return moved;
            }

            // 检查游戏是否结束
            function isGameOver() {
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (grid[i][j] === 0) return false;
                        if (i < GRID_SIZE - 1 && grid[i][j] === grid[i + 1][j]) return false;
                        if (j < GRID_SIZE - 1 && grid[i][j] === grid[i][j + 1]) return false;
                    }
                }
                return true;
            }

            // 键盘控制
            function handleKeydown(e) {
                let moved = false;
                switch(e.key) {
                    case 'ArrowUp': e.preventDefault(); moved = moveUp(); break;
                    case 'ArrowDown': e.preventDefault(); moved = moveDown(); break;
                    case 'ArrowLeft': e.preventDefault(); moved = moveLeft(); break;
                    case 'ArrowRight': e.preventDefault(); moved = moveRight(); break;
                }

                if (moved) {
                    addRandomTile();
                    draw();
                    if (isGameOver()) {
                        alert(`游戏结束！得分: ${score}`);
                    }
                }
            }

            // 触屏控制
            let touchStartX = 0, touchStartY = 0;
            gameContent.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                e.preventDefault();
            }, {passive: false});
            gameContent.addEventListener('touchend', e => {
                const dxTouch = e.changedTouches[0].clientX - touchStartX;
                const dyTouch = e.changedTouches[0].clientY - touchStartY;

                let moved = false;
                if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
                    if (dxTouch > 50) moved = moveRight();
                    else if (dxTouch < -50) moved = moveLeft();
                } else {
                    if (dyTouch > 50) moved = moveDown();
                    else if (dyTouch < -50) moved = moveUp();
                }

                if (moved) {
                    addRandomTile();
                    draw();
                    if (isGameOver()) {
                        alert(`游戏结束！得分: ${score}`);
                    }
                }
                e.preventDefault();
            }, {passive: false});

            document.removeEventListener('keydown', handleKeydown);
            document.addEventListener('keydown', handleKeydown);

            // 初始化游戏
            addRandomTile();
            addRandomTile();
            draw();
        }

        // 启动游戏
        function startGame(gameName) {
            currentGame = gameName;
            gameTitle.textContent = gameName === 'snake' ? '🐍 贪吃蛇' : '🔢 2048';
            gameModal.style.display = 'flex';
            
            if (gameName === 'snake') {
                startSnake();
            } else if (gameName === '2048') {
                start2048();
            }
        }
    </script>
</body>
</html>
