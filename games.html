                extend: {
                    colors: {

                            blue: '#05d9e8',
                            dark: '#0d0221',
                            darker: '#090119',

                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { textShadow: '0 0 5px #ff2a6d, 0 0 10px #ff2a6d' },
                            '100%': { textShadow: '0 0 10px #ff2a6d, 0 0 20px #ff2a6d, 0 0 30px #d300c5' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },

                    }
                }
            }
        }

    </style>

    <script>
        const gameModal = document.getElementById('game-modal');
        const gameContent = document.getElementById('game-content');
        const closeModal = document.getElementById('close-modal');
        const gameTitle = document.getElementById('game-title');
        const gameScore = document.getElementById('game-score');
        const gameHighScore = document.getElementById('game-high-score');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');

        // 游戏状态
        let gameState = {
            currentGame: null,
            score: 0,
            highScore: parseInt(localStorage.getItem('game_high_score') || 0),
            isPaused: false,
            gameInterval: null
        };

        // 关闭模态框
        function closeGameModal() {
            clearInterval(gameState.gameInterval);
            gameModal.classList.add('hidden');
            gameState.currentGame = null;
        }

        closeModal.addEventListener('click', closeGameModal);
        gameModal.addEventListener('click', (e) => {
            if (e.target === gameModal) closeGameModal();
        });

        // 暂停/继续游戏
        pauseBtn.addEventListener('click', () => {
            gameState.isPaused = !gameState.isPaused;
            pauseBtn.innerHTML = gameState.isPaused 
                ? '<i class="fa fa-play mr-2"></i>继续' 
                : '<i class="fa fa-pause mr-2"></i>暂停';
        });

        // 重新开始游戏
        restartBtn.addEventListener('click', () => {
            if (gameState.currentGame) {
                startGame(gameState.currentGame);
            }
        });

        // 更新分数
        function updateScore(points) {
            gameState.score += points;
            gameScore.textContent = gameState.score;
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                gameHighScore.textContent = gameState.highScore;
                localStorage.setItem('game_high_score', gameState.highScore);
            }
        }

        // ==================== 贪吃蛇游戏 ====================
        function startSnake() {
            gameState.score = 0;
            gameState.isPaused = false;
            gameScore.textContent = '0';
            gameHighScore.textContent = gameState.highScore;
            pauseBtn.innerHTML = '<i class="fa fa-pause mr-2"></i>暂停';
            clearInterval(gameState.gameInterval);

            const GRID_SIZE = 20;
            const CELL_SIZE = Math.min(25, Math.floor(window.innerWidth / 30));
            
            // 创建网格
            let html = `<div class="grid gap-0" style="grid-template-columns: repeat(${GRID_SIZE}, ${CELL_SIZE}px);">`;
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                html += `<div class="game-cell" id="cell-${i}"></div>`;
            }
            html += '</div>';
            gameContent.innerHTML = html;

            // 游戏数据
            let snake = [{x: 10, y: 10}];
            let dx = 1;
            let dy = 0;
            let food = {x: Math.floor(Math.random() * GRID_SIZE), y: Math.floor(Math.random() * GRID_SIZE)};
            let nextDx = 1;
            let nextDy = 0;

            // 绘制
            function draw() {
                document.querySelectorAll('.game-cell').forEach(cell => {
                    cell.classList.remove('snake-cell', 'snake-food');
                });

                // 绘制蛇
                snake.forEach(segment => {
                    const index = segment.y * GRID_SIZE + segment.x;
                    document.getElementById(`cell-${index}`).classList.add('snake-cell');
                });

                // 绘制食物
                const foodIndex = food.y * GRID_SIZE + food.x;
                document.getElementById(`cell-${foodIndex}`).classList.add('snake-food');
            }

            // 移动
            function move() {
                if (gameState.isPaused) return;

                dx = nextDx;
                dy = nextDy;

                const head = {x: snake[0].x + dx, y: snake[0].y + dy};

                // 撞墙
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    clearInterval(gameState.gameInterval);
                    alert(`游戏结束！得分: ${gameState.score}`);
                    return;
                }

                // 撞自己
                if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    clearInterval(gameState.gameInterval);
                    alert(`游戏结束！得分: ${gameState.score}`);
                    return;
                }

                snake.unshift(head);

                // 吃食物
                if (head.x === food.x && head.y === food.y) {
                    updateScore(10);
                    // 生成新食物
                    do {
                        food = {x: Math.floor(Math.random() * GRID_SIZE), y: Math.floor(Math.random() * GRID_SIZE)};
                    } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
                } else {
                    snake.pop();
                }

                draw();
            }

            // 键盘控制
            function handleKeydown(e) {
                if (gameState.isPaused) return;
                
                switch(e.key) {
                    case 'ArrowUp':
                        if (dy !== 1) {
                            nextDx = 0;
                            nextDy = -1;
                        }
                        break;
                    case 'ArrowDown':
                        if (dy !== -1) {
                            nextDx = 0;
                            nextDy = 1;
                        }
                        break;
                    case 'ArrowLeft':
                        if (dx !== 1) {
                            nextDx = -1;
                            nextDy = 0;
                        }
                        break;
                    case 'ArrowRight':
                        if (dx !== -1) {
                            nextDx = 1;
                            nextDy = 0;
                        }
                        break;
                }
            }

            // 触屏控制
            let touchStartX = 0;
            let touchStartY = 0;
            
            gameContent.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                e.preventDefault();
            }, {passive: false});

            gameContent.addEventListener('touchend', (e) => {
                if (gameState.isPaused) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;

                if (Math.abs(dx) > Math.abs(dy)) {
                    // 水平滑动
                    if (dx > 0 && gameState.dx !== -1) { // 右滑
                        nextDx = 1;
                        nextDy = 0;
                    } else if (dx < 0 && gameState.dx !== 1) { // 左滑
                        nextDx = -1;
                        nextDy = 0;
                    }
                } else {
                    // 垂直滑动
                    if (dy > 0 && gameState.dy !== -1) { // 下滑
                        nextDx = 0;
                        nextDy = 1;
                    } else if (dy < 0 && gameState.dy !== 1) { // 上滑
                        nextDx = 0;
                        nextDy = -1;
                    }
                }
                e.preventDefault();
            }, {passive: false});

            document.removeEventListener('keydown', handleKeydown);
            document.addEventListener('keydown', handleKeydown);

            // 开始游戏
            draw();
            gameState.gameInterval = setInterval(move, 150);
        }

        // ==================== 2048游戏 ====================
        function start2048() {
            gameState.score = 0;
            gameState.isPaused = false;
            gameScore.textContent = '0';
            gameHighScore.textContent = gameState.highScore;
            pauseBtn.innerHTML = '<i class="fa fa-pause mr-2"></i>暂停';
            clearInterval(gameState.gameInterval);

            const GRID_SIZE = 4;
            const CELL_SIZE = 80;
            
            // 创建网格
            let html = `<div class="grid gap-3 p-3 bg-gray-800 rounded-lg" style="grid-template-columns: repeat(${GRID_SIZE}, ${CELL_SIZE}px);">`;
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                html += `<div class="game-cell flex items-center justify-center text-2xl font-bold rounded-lg bg-gray-700" id="cell-${i}"></div>`;
            }
            html += '</div>';
            gameContent.innerHTML = html;

            // 游戏数据
            let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            
            // 生成新数字
            function addRandomTile() {
                const emptyCells = [];
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (grid[i][j] === 0) {
                            emptyCells.push({i, j});
                        }
                    }
                }
                if (emptyCells.length > 0) {
                    const cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    grid[cell.i][cell.j] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            // 绘制
            function draw() {
                const colors = {
                    0: 'bg-gray-700',
                    2: 'bg-yellow-100 text-gray-800',
                    4: 'bg-yellow-200 text-gray-800',
                    8: 'bg-orange-400 text-white',
                    16: 'bg-orange-500 text-white',
                    32: 'bg-red-500 text-white',
                    64: 'bg-red-600 text-white',
                    128: 'bg-yellow-300 text-gray-800',
                    256: 'bg-yellow-400 text-gray-800',
                    512: 'bg-yellow-500 text-white',
                    1024: 'bg-yellow-600 text-white',
                    2048: 'bg-yellow-700 text-white'
                };

                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        const cell = document.getElementById(`cell-${i * GRID_SIZE + j}`);
                        const value = grid[i][j];
                        cell.textContent = value || '';
                        cell.className = `game-cell flex items-center justify-center text-2xl font-bold rounded-lg ${colors[value] || 'bg-purple-600 text-white'}`;
                    }
                }
            }

            // 移动逻辑
            function moveLeft() {
                let moved = false;
                for (let i = 0; i < GRID_SIZE; i++) {
                    let row = grid[i].filter(val => val !== 0);
                    for (let j = 0; j < row.length - 1; j++) {
                        if (row[j] === row[j + 1]) {
                            row[j] *= 2;
                            updateScore(row[j]);
                            row.splice(j + 1, 1);
                            moved = true;
                        }
                    }
                    while (row.length < GRID_SIZE) {
                        row.push(0);
                    }
                    if (JSON.stringify(grid[i]) !== JSON.stringify(row)) {
                        grid[i] = row;
                        moved = true;
                    }
                }
                return moved;
            }

            function moveRight() {
                let moved = false;
                for (let i = 0; i < GRID_SIZE; i++) {
                    let row = grid[i].filter(val => val !== 0);
                    for (let j = row.length - 1; j > 0; j--) {
                        if (row[j] === row[j - 1]) {
                            row[j] *= 2;
                            updateScore(row[j]);
                            row.splice(j - 1, 1);
                            moved = true;
                        }
                    }
                    while (row.length < GRID_SIZE) {
                        row.unshift(0);
                    }
                    if (JSON.stringify(grid[i]) !== JSON.stringify(row)) {
                        grid[i] = row;
                        moved = true;
                    }
                }
                return moved;
            }

            function moveUp() {
                let moved = false;
                for (let j = 0; j < GRID_SIZE; j++) {
                    let col = [];
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== 0) {
                            col.push(grid[i][j]);
                        }
                    }
                    for (let i = 0; i < col.length - 1; i++) {
                        if (col[i] === col[i + 1]) {
                            col[i] *= 2;
                            updateScore(col[i]);
                            col.splice(i + 1, 1);
                            moved = true;
                        }
                    }
                    while (col.length < GRID_SIZE) {
                        col.push(0);
                    }
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== col[i]) {
                            grid[i][j] = col[i];
                            moved = true;
                        }
                    }
                }
                return moved;
            }

            function moveDown() {
                let moved = false;
                for (let j = 0; j < GRID_SIZE; j++) {
                    let col = [];
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== 0) {
                            col.push(grid[i][j]);
                        }
                    }
                    for (let i = col.length - 1; i > 0; i--) {
                        if (col[i] === col[i - 1]) {
                            col[i] *= 2;
                            updateScore(col[i]);
                            col.splice(i - 1, 1);
                            moved = true;
                        }
                    }
                    while (col.length < GRID_SIZE) {
                        col.unshift(0);
                    }
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== col[i]) {
                            grid[i][j] = col[i];
                            moved = true;
                        }
                    }
                }
                return moved;
            }

            // 检查游戏是否结束
            function isGameOver() {
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (grid[i][j] === 0) return false;
                        if (i < GRID_SIZE - 1 && grid[i][j] === grid[i + 1][j]) return false;
                        if (j < GRID_SIZE - 1 && grid[i][j] === grid[i][j + 1]) return false;
                    }
                }
                return true;
            }

            // 键盘控制
            function handleKeydown(e) {
                if (gameState.isPaused) return;

                let moved = false;
                switch(e.key) {
                    case 'ArrowUp':
                        moved = moveUp();
                        break;
                    case 'ArrowDown':
                        moved = moveDown();
                        break;
                    case 'ArrowLeft':
                        moved = moveLeft();
                        break;
                    case 'ArrowRight':
                        moved = moveRight();
                        break;
                }

                if (moved) {
                    addRandomTile();
                    draw();
                    if (isGameOver()) {
                        alert(`游戏结束！得分: ${gameState.score}`);
                    }
                }
            }

            // 触屏控制
            let touchStartX = 0;
            let touchStartY = 0;
            
            gameContent.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                e.preventDefault();
            }, {passive: false});

            gameContent.addEventListener('touchend', (e) => {
                if (gameState.isPaused) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;

                let moved = false;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 50) { // 右滑
                        moved = moveRight();
                    } else if (dx < -50) { // 左滑
                        moved = moveLeft();
                    }
                } else {
                    if (dy > 50) { // 下滑
                        moved = moveDown();
                    } else if (dy < -50) { // 上滑
                        moved = moveUp();
                    }
                }

                if (moved) {
                    addRandomTile();
                    draw();
                    if (isGameOver()) {
                        alert(`游戏结束！得分: ${gameState.score}`);
                    }
                }
                e.preventDefault();
            }, {passive: false});

            document.removeEventListener('keydown', handleKeydown);
            document.addEventListener('keydown', handleKeydown);

            // 初始化游戏
            addRandomTile();
            addRandomTile();
            draw();
        }

        // 游戏卡片点击事件
        document.querySelectorAll('.game-card button').forEach(btn => {
            btn.addEventListener('click', function() {
                const gameName = this.closest('.game-card').querySelector('h3').textContent;
                gameTitle.textContent = gameName;
                gameState.currentGame = gameName;
                gameModal.classList.remove('hidden');

                // 启动对应游戏
                switch(gameName) {
                    case '贪吃蛇':
                        startSnake();
                        break;
                    case '2048':
                        start2048();
                        break;
                    default:
                        gameContent.innerHTML = `<div class="text-center text-xl text-gray-300">
                            <i class="fa fa-cogs text-4xl mb-4 text-cyber-pink"></i>
                            <p>${gameName} 功能开发中，敬请期待！</p>
                        </div>`;
                }
            });
        });
    </script>
</body>
</html>
