<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 · Tyler</title>
    <link rel="icon" type="image/png" href="resource/easyclaw.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a; --surface: #141414; --border: #2a2a2a;
            --text: #e8e8e8; --text-secondary: #888; --accent: #646cff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh;
        }
        .header {
            border-bottom: 1px solid var(--border); padding: 1.5rem 0;
            position: sticky; top: 0; background: rgba(10,10,10,0.85);
            backdrop-filter: blur(12px); z-index: 100;
        }
        .header-inner {
            max-width: 720px; margin: 0 auto; padding: 0 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo span { color: var(--accent); }
        .nav a { color: var(--text-secondary); text-decoration: none; margin-left: 2rem; font-size: 0.9rem; }
        .nav a:hover { color: var(--text); }
        .container { max-width: 720px; margin: 0 auto; padding: 3rem 2rem; }
        .page-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
        .page-header p { color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 2rem; }
        .changelog-date {
            font-size: 0.9rem; font-weight: 700; color: var(--accent);
            margin-top: 2rem; margin-bottom: 0.75rem; padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .changelog-date:first-child { margin-top: 0; }
        .changelog-entry {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.5rem 0; font-size: 0.9rem;
        }
        .entry-icon { font-size: 1rem; flex-shrink: 0; }
        .entry-msg { flex: 1; color: var(--text); }
        .entry-hash { font-size: 0.75rem; color: var(--text-secondary); font-family: monospace; }
        .footer {
            border-top: 1px solid var(--border); padding: 2rem 0;
            text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-top: 2rem;
        }
        .footer a { color: var(--accent); text-decoration: none; }
        @media (max-width: 640px) {
            .container { padding: 2rem 1.25rem; }
            .page-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">Tyler<span>.</span></a>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/blog/">博客</a>
                <a href="/ideas.html">灵感</a>
                <a href="/resources.html">资源</a>
                <a href="/changelog.html">日志</a>
                <a href="/about.html">关于</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>📋 更新日志</h1>
            <p>网站的每一次变化都记录在这里，透明公开</p>
        </div>

        <div class="changelog">

        </div>
    </main>

    <footer class="footer">
        <p>自动生成于 Git 历史 · <a href="https://github.com/tylerdi/mytoolsweb">View on GitHub</a></p>
    </footer>
</body>
</html>
